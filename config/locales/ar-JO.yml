    resource:
      kpi:
        actions:
          read:
            explanation: القدرة على الوصول الى صفحة مؤشرات الاداء
            label: الوصول الى صفحة مؤشرات الاداء
          kpi_assessment_status:
            explanation: القدرة على معرفة ، بالنسبة للحالات النشطة التي يمكن للمستخدم الوصول إليها ، نسبة هؤلاء الذين لديهم نموذج تقييم مكتمل.
            label: ' حالة التقييم'
          kpi_average_followup_meetings_per_case:
            explanation: القدرة على رؤية ، بالنسبة للحالات النشطة التي يمكن للمستخدم الوصول إليها ، متوسط عدد اجتماعات المتابعة التي تم إجراؤها خلال فترة زمنية محددة.
            label: متوسط اجتماعات المتابعة لكل حالة
          kpi_average_referrals:
            explanation: القدرة على رؤية ، في جميع الحالات النشطة التي يمكن للمستخدم الوصول إليها ، متوسط عدد الإحالات التي تمت لكل نوع من الخدمات.
            label: متوسط الإحالات
          kpi_case_closure_rate:
            explanation: القدرة على معرفة عدد الحالات التي تم إغلاقها في كل موقع شهريًا.
            label: عدد إغلاق القضية
          kpi_case_load:
            explanation: القدرة على رؤية متوسط عدد الحالات المفتوحة لدى كل منسق حالة.
            label: تحميل الحالات
          kpi_client_satisfaction_rate:
            explanation: القدرة على رؤية ، لكل حالة يمكن للمستخدم الوصول إليها ، ما هي نسبة الناجين الذين أكملوا استبيان التغذية الراجعة.
            label: معدل رضا العميل
          kpi_completed_case_action_plans:
            explanation: القدرة على رؤية ، لكل حالة يمكن للمستخدم الوصول إليها ، ما هي نسبة الناجين الذين أكملوا استبيان التغذية الراجعة.
            label: 6.  اكتملت خطط عمل الحالة
          kpi_completed_case_safety_plans:
            explanation: القدرة على رؤية ، لكل حالة يمكن للمستخدم الوصول إليها ، ما هي نسبة الناجين الذين أكملوا استبيان التغذية الراجعة.
            label: 5. اكتملت خطط سلامة الحالة
          kpi_completed_supervisor_approved_case_action_plans:
            explanation: القدرة على رؤية ، للحالات النشطة التي يمكن للمستخدم الوصول إليها ، النسبة التي أكمل فيها خطة عمل الحالة التي تمت الموافقة عليها من قبل المشرف.
            label: اعتماد خطة العمل المكتملة من قبل المشرف
          kpi_goal_progress_per_need:
            explanation: القدرة على رؤية ، في الحالات التي يمكن للمستخدم الوصول إليها ، النسبة المئوية للأهداف التي تم تحقيقها في كل فئة من فئات الاحتياجات.
            label: التقدم المحرز نحو الأهداف
          kpi_number_of_cases:
            explanation: القدرة على معرفة عدد الحالات المبلغ عنها حديثًا التي يتم فتحها كل شهر لكل موقع.
            label: عدد الحالات
          kpi_number_of_incidents:
            explanation: القدرة على معرفة عدد الحوادث المبلغ عنها حديثًا والتي يتم فتحها كل شهر لكل موقع.
            label: عدد الحوادث
          kpi_reporting_delay:
            explanation: القدرة على رؤية ، فيما يتعلق بجميع الحوادث التي يمكن للمستخدم الوصول إليها ، عدد الأيام المنقضية بين وقت تعرض الناجية للعنف المبني على النوع الاجتماعي ووقت قيام الناجية بإبلاغ مقدم الخدمة بذلك.
            label: الإبلاغ عن التأخير
          kpi_services_provided:
            explanation: القدرة على رؤية ، في جميع الحالات التي يمكن للمستخدم الوصول إليها ، نوع الخدمات التي قدمتها المنظمة في المنزل.
            label: ' الخدمات المقدمة'
          kpi_supervisor_to_caseworker_ratio:
            explanation: القدرة على رؤية نسبة منسقي الحالة إلى المشرفين.
            label: 15. المشرف على نسبة المفوضين
          kpi_time_from_case_open_to_close:
            explanation: القدرة على معرفة المدة التي تظل فيها الحالة مفتوحة لجميع الحالات التي يمكن للمستخدم الوصول إليها.
            label: الوقت من فتح القضية إلى إغلاقها
        label: مؤشرات الأداء الرئيسية
      agency:
        actions:
          assign:
            explanation: القدرة على اختيار وكالة عند إنشاء أو تعديل حساب مستخدم. إذا كان المستخدم الحالي لديه هذا الإذن بالإضافة إلى إذن "قراءة الوكالة" للمستخدمين ، فسيكون قادرًا فقط على إضافة مستخدم إلى وكالتهم الخاصة
            label: تعيين
          create:
            explanation: القدرة على إنشاء مؤسسة
            label: 'إنشاء '
          manage:
            explanation: 'السماح للمستخدم بتنفيذ جميع الإجراءات المتاحة على المؤسسات. إذن أذونات "الإدارة" تعني أساسًا "كل شيء". هام: يمنح هذا أيضًا القدرة على إنشاء مؤسسة جديدة.'
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
          read:
            explanation: القدرة على رؤية المؤسسات.
            label: عرض
          write:
            explanation: القدرة على تعديل المعلومات حول المؤسسات. يرجى ملاحظة أن هذا ينطبق على جميع المؤسسات في النظام.
            label: تعديل
        explanation: يمثل منظمة بها أعضاء يستخدمون النظام. توجد الوكالات بشكل مستقل عن مجموعات المستخدمين.
        label: مؤسسة
      audit_log:
        actions:
          read:
            explanation: يسمح للمستخدم بمشاهدة قائمة بجميع الإجراءات التي تم تنفيذها في النظام وتصفيتها ، مقسمة حسب المستخدم ونوع الإجراء ومعرف السجل ووقت الإجراء. هذا هو الأنسب للمسؤولين على المستوى الوطني أو على مستوى الوكالة ، لأن هذا يعرض الإجراءات التي يقوم بها جميع المستخدمين في النظام. يرجى ملاحظة أن سجل التدقيق لا يعرض معلومات التعريف الشخصية حول السجلات المتضمنة في كل إجراء.
            label: عرض
        explanation: قائمة قابلة للتصفية لجميع الإجراءات التي تم تنفيذها في النظام. لا تتضمن أي معلومات تعريفية عن الحالات أو الحوادث أو طلبات البحث عن المفقودين.
        label: سجل التدقيق
      case:
        actions:
          add_note:
            explanation: يسمح للمستخدم بإضافة إدخال إلى النموذج الفرعي "ملاحظات" (يُطلق عليه أحيانًا "التعليقات"). يقوم المستخدم بذلك عن طريق النقر فوق الزر "إضافة ملاحظات" في صفحة عرض الحالة. هذا الإجراء مفيد بشكل خاص للمديرين الذين ليس لديهم القدرة على تحرير الحالات ، لكنهم يريدون إضافة تذكيرات إلى حالة لمنسق الحالة. بهذه الطريقة ، فإن إضافة ملاحظة تشبه إضافة علامة. ميزة إضافة ملاحظة هي أنه عندما يضيف المدير ملاحظة إلى حالة ما ، سيظهر إشعار على الحالة لمنسق الحالة عندما يشاهد الحالة على أجهزتهم المحمولة.
            label: اضافة ملاحظة على الحالة
          add_registry_record:
            explanation: يسمح للمستخدم بربط سجل بحالة من نموذج تفاصيل السجل. يسمح أيضًا للمستخدم بإلغاء ربط أي سجل مرتبط بالحالة اساسا.
            label: إضافة / تحديث سجل التسجيل من الحالة
          approve_action_plan:
            explanation: يسمح للمشرف بالمصادقة على %{approval_label} لحالات منسقي الحالة لديهم
            label: مصادقة %{approval_label}
          approve_assessment:
            explanation: يسمح للمشرف بالمصادقة على %{approval_label} لحالات منسقي الحالة لديهم
            label: مصادقة نموذج %{approval_label}
          approve_bia:
            explanation: يسمح للمشرف بالمصادقة على %{approval_label} لحالات منسقي الحالة لديهم
            label: مصادقة نموذج %{approval_label}
          approve_case_plan:
            explanation: يسمح للمشرف بالمصادقة على %{approval_label} لحالات منسقي الحالة لديهم
            label: مصادقة %{approval_label}
          approve_closure:
            explanation: يسمح للمشرف بالمصادقة على %{approval_label} لحالات منسقي الحالة لديهم
            label: مصادقة نموذج %{approval_label}
          approve_gbv_closure:
            explanation: يسمح للمشرف بالمصادقة على %{approval_label} لحالات منسقي الحالة لديهم
            label: مصادقة نموذج %{approval_label}
          self_approve:
            explanation: بشكل تلقائي، لا يستطيع المستخدمون الموافقة على قضاياهم الخاصة. لكن مع هذا الإذن، يمكن للمستخدم الموافقة على أي قضية لديه صلاحية الوصول إليها، حتى لو كان هو مالك السجل.
            label: المصادقة على حالاتي
          assign:
            explanation: يسمح للمستخدم بإرسال حالة من مالك السجل الأصلي إلى أي مستخدم آخر في النظام. لا يلزم موافقة الطفل لهذا الإجراء. على عكس عمليات النقل ، لا يُمنح المستلم الفرصة لقبول التعيين أو رفضه.
            label: تعيين
          assign_within_agency:
            explanation: يسمح للمستخدم بإرسال حالة من مالك السجل الأصلي إلى أي مستخدم آخر في النظام. لا يلزم موافقة الطفل لهذا الإجراء. على عكس عمليات النقل ، لا يُمنح المستلم الفرصة لقبول او رفض التعيين
            label: تعيين لمستخدم داخل مؤسستي
          assign_within_user_group:
            explanation: يسمح للمستخدم بإرسال حالة من مالك السجل الأصلي إلى أي مستخدم آخر في مجموعات المستخدمين الحالية. لا يلزم موافقة الطفل لهذا الإجراء. على عكس عمليات النقل ، لا يُمنح المستلم الفرصة لقبول المهمة أو رفضها.
            label: تعيين إلى مستخدم ضمن مجموعة المستخدمين الخاصة بي
          create_case_from_referral:
            label: إنشاء حالة من إحالة
            explanation: يمكن للمستخدم إنشاء حالة من إحالة
          change_log:
            explanation: يمكن للمستخدم رؤية محفوظات لجميع التغييرات التي تم إجراؤها على السجل منذ إنشائه. يتضمن هذا القيم المسجلة لجميع الحقول.
            label: 'سجل التغيير '
          access_log:
            explanation: ' يمكن للمستخدم الاطلاع على سجل يتضمن جميع عمليات الوصول إلى السجل من قبل المستخدمين الذين ليسوا مالكي السجل الحاليين (بما في ذلك عمليات العرض والتحديث) منذ تاريخ إنشاء السجل.'
            label: سجل الوصول
          close:
            explanation: يسمح للمستخدم بتعيين حالة الحالة المفتوحة لإغلاقها.
            label: اغلاق
          consent_override:
            explanation: يسمح للمستخدم بإجراء إحالة أو نقل لحالة لم تقدم الموافقة.
            label: تجاوز عدم الموافقة عند الإحالة أو النقل
          create:
            explanation: القدرة على إنشاء حالة
            label: 'إنشاء '
          display_view_page:
            explanation: إذا أجرى المستخدم بحثًا عن حالة ليس لديه وصول إليها ، فإن هذا الإذن يسمح له برؤية نموذج صغير يحتوي على معلومات أساسية حول الحالة ، حتى لو لم يتمكن المستخدم من النقر فوق الحالة للاطلاع على جميع معلوماتها. الحقول التي تظهر في "طريقة العرض" هذه هي الحقول التي تم تكوينها إلى "إظهار في نموذج قصير". هذا النموذج مفيد أيضًا للمستخدمين الذين يقومون بإجراءات تتبع الأسرة وإعادة التوحيد ، نظرًا لأن "طريقة العرض" متاحة للمستخدم للوصول إليها عند مراجعة الحالات التي ظهرت على أنها "تطابقات محتملة" لطلب تتبع.
            label: عرض صفحة العرض
          enable_disable_record:
            explanation: القدرة على تعطيل أو تمكين حالة. لا تظهر الحالات "المعطلة" افتراضيًا في قائمة الحالات. يمكن للمستخدمين رؤية الحالات المعطلة في قائمة الحالات باستخدام عامل تصفية. نظرًا لأن النظام لا يسمح للمستخدمين بحذف الحالات ، فقد يرغب المستخدم في تعطيل حالة كبديل. على سبيل المثال ، إذا أنشأ المستخدم حالة عن طريق الخطأ ، أو كانت الحالة تحتوي على بيانات سيئة ، فيجب على المستخدم تعطيلها.
            label: تفعيل / تعطيل
          export_case_pdf:
            explanation: يمكن للمستخدم إنشاء تصدير ملف PDF من قائمة الحالة أو صفحات عرض الحالة ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لحالة واحدة أو متعددة أو جميع الحالات التي يمكن للمستخدم الوصول إليها. في ملف تصدير PDF ، يتم سرد المعلومات أولاً حسب الحالة ، ثم يتم تنظيمها بشكل أكبر حسب النموذج الذي تظهر عليه المعلومات.
            label: تصدير ملف حالة pdf
          export_csv:
            explanation: 'يمكن للمستخدم إنشاء تصدير ملف CSV من قائمة الحالة أو صفحات عرض الحالة ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لحالة واحدة أو متعددة أو جميع الحالات التي يمتلك المستخدم حق الوصول إليها. ملاحظة: لا يعرض تصدير CSV الأحرف غير اللاتينية (مثل العربية والبنغالية) بتنسيق قابل للقراءة.'
            label: تصدير ملف إلى CSV
          export_custom:
            explanation: يمكن للمستخدم إنشاء تصدير ملف XLS من قائمة الحالة أو صفحات عرض الحالة ، والتي تحتوي على مجموعة مخصصة من النماذج أو الحقول ، لحالة واحدة أو متعددة أو جميع الحالات التي يمتلك المستخدم حق الوصول إليها. في هذا التصدير ، يتم تمثيل كل نموذج في علامة التبويب الخاصة به داخل ملف XLS. يمكن للمستخدم تحديد النماذج أو الحقول التي يريد تضمينها في التصدير باستخدام صيغة Custom Export. يرجى ملاحظة أن المستخدمين يمكنهم فقط تضمين النماذج والحقول في التصدير إذا كان لديهم بالفعل القدرة على رؤية تلك النماذج والحقول عند عرض حالة في التطبيق.
            label: تصدير ملف مخصص
          export_duplicate_id_csv:
            explanation: لإنشاء تصدير CSV للحالات التي لها نفس حقل "الرقم القومي" (قد يكون لها تسمية مختلفة ، اعتمادًا على التكوين). نفذت فقط من صفحة قائمة الحالة.
            label: تصدير التكرارات
          export_json:
            explanation: يمكن للمستخدم إنشاء تصدير ملف JSON من قائمة الحالة أو صفحات عرض الحالة ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لحالة واحدة أو متعددة أو جميع الحالات التي يمتلك المستخدم حق الوصول إليها. يستخدم هذا التصدير بشكل أساسي لأولئك الذين يرغبون في تصدير الحالات من نظام Primero الحالي ثم استيرادها إلى نظام Primero مختلف ، أو إلى نظام إدارة معلومات آخر. تنسيق JSON قابل للقراءة آليًا وغير عملي لمعظم المستخدمين.
            label: تصدير JSON
          export_list_view_csv:
            explanation: يمكن للمستخدم إنشاء ملف تصدير CSV من صفحة قائمة الحالة التي تحتوي على نفس الحقول التي تظهر لهذا المستخدم في قائمة الحالة. نفذت فقط من صفحة قائمة الحالة.
            label: تصدير ملف عرض قائمة csv
          export_pdf:
            explanation: يمكن للمستخدم إنشاء تصدير ملف PDF من قائمة الحالة أو صفحات عرض الحالة ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لحالة واحدة أو متعددة أو جميع الحالات التي يمكن للمستخدم الوصول إليها. في ملف تصدير PDF ، يتم سرد المعلومات أولاً حسب الحالة ، ثم يتم تنظيمها بشكل أكبر حسب النموذج الذي تظهر عليه المعلومات.
            label: تصدير ملف حالة pdf
          export_photowall:
            explanation: يسمح للمستخدم بتصدير ملف من صفحة قائمة الحالة التي تحتوي على صور جميع الحالات المحددة. يستخدم هذا التصدير بشكل أساسي في أنشطة البحث عن الأسرة ولم شملها. نفذت فقط من صفحة قائمة الحالة.
            label: تصدير جدار الصور
          export_unhcr_csv:
            label: تصدير مفوضية الأمم المتحدة السامية لشؤون اللاجئين بتنسيق CSV
            explanation: ' متوقف الاستخدام - لم تعد هذه الميزة مستخدمة.'
          export_xls:
            explanation: 'يمكن للمستخدم إنشاء تصدير ملف XLS من قائمة الحالة أو صفحات عرض الحالة ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لحالة واحدة أو متعددة أو جميع الحالات التي يمتلك المستخدم حق الوصول إليها. في هذا التصدير ، يتم تمثيل كل نموذج في علامة التبويب الخاصة به داخل ملف XLS. ملاحظة: يعرض تنسيق XLS الأحرف غير اللاتينية (مثل العربية والبنغالية) بتنسيق قابل للقراءة ، بينما لا يعرض تنسيق CSV.'
            label: تصدير ملف Excel (ملف XLS)
          find_tracing_match:
            explanation: يستخدم هذا حصريًا في السياقات مع نشاط تتبع الأسرة ولم شملها. سيرى المستخدمون الذين لديهم هذا الإذن زر "Find Tracing Match" في صفحة عرض الحالة. عندما ينقرون عليه ، سيصلون إلى قائمة طلبات التعقب في النظام والتي تعتبر مطابقات محتملة لحالتهم.
            label: ايجاد أثر التطابق من القضية
          flag:
            explanation: القدرة على إضافة علامة إلى حالة. يمكن للمستخدمين الذين لديهم هذا الإذن أيضًا إزالة العلامات التي أضافوها إلى إحدى الحالات.
            label: علامة
          flag_multiple:
            explanation: ' يتيح للمستخدم إضافة علامة إلى عدة حالات من قائمة سجلات الحالات.'
            label: ' وضع علامة على عدة حالات'
          resolve_any_flag:
            explanation: يسمح للمستخدم بحل أي علامة على السجل، بغض النظر عمن قام بإنشاء العلامة.
            label: حل اي علامة
          flag_update:
            explanation: ' يتيح للمستخدم تحديث أي علامة على السجل، بغض النظر عن المستخدم الذي قام بإنشاء تلك العلامة.'
            label: تحديث العلامة
          import:
            explanation: يسمح للمستخدم بإنشاء حالة جديدة أو أكثر من خلال استيرادها من ملف CSV أو Excel أو JSON. يجب أن يكون الملف الذي تم استيراده بتنسيق * جدا * بشكل خاص حتى يتم استيراد المعلومات بشكل صحيح. يجب أن تكون هذه الوظيفة متاحة فقط للمستخدمين الإداريين ذوي المهارات التقنية المتقدمة والمعرفة المتعمقة بكيفية تنسيق البيانات في Primero. نفذت فقط من صفحة قائمة الحالة.
            label: استيراد
          incident_details_from_case:
            explanation: القدرة على إضافة إدخال للنموذج الفرعي "تفاصيل الحادث" في حالة عثرت عليها في نتائج البحث ، ولكن لا يمكنك الوصول إليها. يقوم المستخدم بتنفيذ هذا الإجراء من صفحة نتائج البحث عن طريق تحديد حالة واحدة أو أكثر ، ثم تحديد "إضافة حادث" من قائمة الإجراءات. ثم يرى المستخدم نموذجًا يحتوي على جميع الحقول في النموذج الفرعي "تفاصيل الحادث" ، حيث يمكنه إدخال معلومات حول الخدمة وإرسالها. نظرًا لأنه لا يمكن تنفيذ هذا الإجراء إلا من صفحة نتائج البحث ، فمن المنطقي أن يحصل الدور على هذا الإذن فقط إذا كان لديه أيضًا إذن "البحث عن سجلات الحالة التي يملكها مستخدمون آخرون".
            label: أضف تفاصيل الحادثة إلى حالة مستخدم آخر من صفحة نتائج البحث
          incident_from_case:
            explanation: 'يسمح هذا الإذن للمستخدم بالنقر فوق زر "إنشاء حادثة". يؤدي هذا إلى إنشاء حادثة و قد يحتوي على بعض المعلومات المنسوخة من سجل الحالة.

              بالنسبة لحالات العنف القائم على النوع الاجتماعي، يوجد هذا الزر أعلى صفحة حالة العرض ويتوافق مع المعلومات المتعلقة بالحالة ككل.

              في بعض سياقات تتبع الحوادث، يوجد هذا الزر في نموذج فرعي "تفاصيل الحادثة". في هذه الحالة ، قد يتم نسخ بعض المعلومات من النموذج الفرعي لتفاصيل الحادث حيث تم النقر فوق الزر ، وكذلك من الحالة ككل. بمعنى آخر. قد يحتوي الحادث الجديد الذي تم إنشاؤه على الحقل "نوع العنف" من النموذج الفرعي لتفاصيل الحادث الفردي ، ولكن قد يحتوي أيضًا على عمر وجنس الحالة نفسها. لاحظ أن هذا الإذن يسمح أيضًا للمستخدم بمشاهدة رابط للحادث الذي تم إنشاؤه.'
            label: إنشاء حادثة من حالة
          remove_alert:
            explanation: ' تتيح هذه الصلاحية للمستخدم إزالة تنبيه من الحالة. وعادةً ما يتم إنشاء التنبيهات عند تعديل حقل معيّن، مثل تحديث الملاحظات. وتُعرض التنبيهات عادةً على شكل نقطة صفراء بجانب الحالة.'
            label: إزالة التنبيه من حالة
          manage:
            explanation: يسمح للمستخدم بتنفيذ جميع الإجراءات المتاحة في الحالات. إذن "الإدارة" يعني أساسًا "كل شيء".
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
          read:
            explanation: القدرة على عرض القضية
            label: عرض
          receive_referral:
            explanation: يسمح للمستخدم بتلقي الإحالة. سيظهر المستخدمون الذين لديهم هذا الإذن كمستلمين محتملين لإجراء إحالة ، بينما لن يظهر المستخدمون الذين ليس لديهم هذا الإذن كمستلمين محتملين عندما يبحث شخص ما عن مستلم في نموذج الإحالة.
            label: تلقي الإحالة
          receive_referral_different_module:
            explanation: يسمح للمستخدم بتلقي إحالة لسجل تم إنشاؤه في وحدة نمطية مختلفة من بريميرو. سيظهر المستخدمون الذين لديهم هذا الإذن كمستلمين محتملين لإجراء إحالة لهذا السجل ، بينما لن يظهر المستخدمون الذين ليس لديهم هذا الإذن كمستلمين محتملين عندما يبحث شخص ما عن مستلم في نموذج الإحالة.
            label: تلقي الإحالة من مستخدم في وحدة بريميرو مختلفة
          receive_transfer:
            explanation: يسمح للمستخدم بتلقي النقل. سيظهر المستخدمون الذين لديهم هذا الإذن كمستلمين محتملين لإجراء النقل ، بينما لن يظهر المستخدمون الذين ليس لديهم هذا الإذن كمستلمين محتملين عندما يبحث شخص ما عن مستلم في طريقة النقل.
            label: استلام النقل
          referral:
            explanation: يسمح لمستخدم بمنح حق الوصول مؤقتًا إلى حالة لمستخدم آخر. سيتمكن مستلم الإحالة من تنفيذ جميع الإجراءات نفسها في الحالة المُحالة حيث سيكون بمقدوره القيام بذلك في حالاته الخاصة. عندما لا يحتاج المستلم إلى الوصول إلى الحالة ، يمكنه النقر فوق الزر "تم" في النموذج الفرعي الإحالات والتتنقلات ، وسيفقد الوصول إلى الحالة. يمكنك فقط إحالة حالة إلى مستخدم له دور له القدرة على تلقي الإحالات.
            label: إحالة
          referral_within_user_group:
            explanation: تقيّد هذه الصلاحية المستخدم بحيث لا يتمكن من إرسال إحالة إلا إلى مستخدم ينتمي إلى إحدى مجموعات المستخدمين الخاصة به. ويجب أن تكون الأدوار التي تمتلك هذه الصلاحية مخوّلة أيضًا بصلاحية "الإحالة" و/أو "إحالة الحالة من النموذج الفرعي للخدمات".
            label: ' الإحالة إلى مستخدمين ضمن مجموعتي'
          referral_from_service:
            explanation: يسمح للمستخدم برؤية زر "إحالة" في النموذج الفرعي للخدمات. عندما ينقر المستخدم على هذا الزر ، سيظهر نموذج الإحالة مع تعطيل حقول نوع الخدمة والوكالة وموفر الخدمة والموقع ، ولكن يتم ملؤها تلقائيًا بالمعلومات الخاصة بهذه الحقول في النموذج الفرعي للخدمات الذي نقر المستخدم على زر إحالة.
            label: إحالة الحالة من النموذج الفرعي للخدمة
          accept_or_reject_referral:
            explanation: ' يتيح للمستخدمين تحديد ما إذا كانت الإحالة الخارجية قد تم قبولها أو رفضها من قبل الجهة المستلمة.'
            label: ' تحديد الإحالات الخارجية كمقبولة / مرفوضة'
          receive_referral_within_user_group:
            explanation: ' تقيّد هذه الصلاحية المستخدم بحيث لا يتمكن من استلام إحالة إلا من مستخدم ينتمي إلى إحدى مجموعات المستخدمين الخاصة به.'
            label: ' استلام إحالة من مستخدمين ضمن مجموعتي'
          remove_assigned_users:
            explanation: ' تتيح هذه الصلاحية للمستخدم إنهاء إحالة أو عملية نقل قيد الانتظار، مما يؤدي إلى إلغاء صلاحية الوصول للجهة المستلمة. وبالنسبة للإحالات، تتيح هذه الصلاحية أيضًا للمستخدم تحديد الإحالة كمكتملة، مع بيان ما إذا كانت الإحالة ناجحة، وما إذا تم تقديم الخدمات، وإضافة ملاحظات حول الإحالة. كما يمكن استخدام هذا الإجراء مع الإحالات الخارجية أيضًا.'
            label: ' إلغاء الإحالة أو النقل / تحديد الإحالة كمكتملة'
          reopen:
            explanation: يسمح للمستخدم بفتح حالة مغلقة حاليًا.
            label: إعادة فتح
          request_approval_action_plan:
            explanation: يسمح للمستخدم (عادة ما يكون منسق الحالة) بمطالبة المشرف بالمصادقة على حالتهم %{approval_label}.
            label: طلب مصادقة على %{approval_label}
          request_approval_assessment:
            explanation: يسمح للمستخدم (عادة ما يكون منسق الحالة) بمطالبة  المشرف بالمصادقة على حالتهم %{approval_label}.
            label: طلب مصادقة على %{approval_label}
          request_approval_bia:
            explanation: يسمح للمستخدم (عادة ما يكون منسق الحالة) بمطالبة  المشرف بالمصادقة على حالتهم %{approval_label}.
            label: طلب مصادقة على %{approval_label}
          request_approval_case_plan:
            explanation: يسمح للمستخدم (عادة ما يكون منسق الحالة) بمطالبة المشرف بالمصادقة على حالتهم %{approval_label}.
            label: طلب مصادقة على %{approval_label}
          request_approval_closure:
            explanation: يسمح للمستخدم (عادة ما يكون عامل الحالة) بمطالبة  المشرف بالمصادقة على حالتهم %{approval_label}.
            label: طلب مصادقة على %{approval_label}
          request_approval_gbv_closure:
            explanation: يسمح للمستخدم (عادة ما يكون عامل الحالة) بمطالبة المشرف بالمصادقة على حالتهم %{approval_label}.
            label: طلب مصادقة على %{approval_label}
          request_transfer:
            explanation: يكشف عن زر "طلب نقل" الموجود على "طريقة العرض". يتيح الزر للمستخدم إرسال رسالة تحتوي على ملاحظة مخصصة عبر البريد الإلكتروني إلى مالك السجل الحالي للقضية ، ويطلب من مالك السجل نقل الحالة إلى المستخدم الذي أرسل الطلب. يعد هذا مفيدًا في السياقات التي يغير فيها الأطفال المواقع كثيرًا ، ويحتاج العاملون في الحالة إلى منسق الحالة السابق للطفل لإرسال معلومات حول الطفل لتجنب إنشاء سجل مكرر.
            label: طلب نقل
          search_owned_by_others:
            explanation: للسماح لمستخدم بإجراء بحث عن السجلات التي لا يمكنهم عادةً الوصول إليها ، إما لأنهم ليسوا مالك السجل لهذه الحالة ، أو (للمديرين) لأن مالك السجل ليس في مجموعات المستخدمين الخاصة بهم. لاحظ أنه بينما سيرى المستخدم الحالة في عرض نتائج البحث ، لن يتمكن من النقر فوق صفحة عرض الحالة لهذه الحالة ، مما يعني أنه لن يتمكن من رؤية أي معلومات تفصيلية حول الحالة.
            label: البحث عن سجلات الحالة المملوكة لمستخدم آخر
          service_provision_incident_details:
            explanation: يسمح للمستخدم برؤية الزر المسمى "حفظ وإضافة تقديم الخدمة" في الجزء السفلي من نموذج إضافة حادث. يؤدي النقر فوق هذا الزر إلى حفظ المعلومات التي تم إدخالها حاليًا حول الحادث ، ثم نقل المستخدم مباشرةً إلى نموذج إضافة توفير الخدمة. نظرًا لأن هذا الإجراء مرتبط بشكل مباشر بإجراءات إضافة حادث وإضافة توفير خدمة ، فمن المنطقي فقط منح هذا الإذن لدور ما إذا كان هذا الدور يحتوي أيضًا على "إضافة تفاصيل الحادث إلى حالة مستخدم آخر" و "إضافة توفير الخدمة إلى مستخدم آخر" أذونات الحالة ".
            label: راجع إضافة زر توفير الخدمة في نموذج تفاصيل الحادث
          services_section_from_case:
            explanation: القدرة على إضافة إدخال للنموذج الفرعي للخدمات في حالة وجدتها في نتائج البحث ، ولكن لا يمكنك الوصول إليها. يقوم المستخدم بتنفيذ هذا الإجراء من صفحة نتائج البحث عن طريق تحديد حالة واحدة أو أكثر ، ثم تحديد "إضافة توفير الخدمة" من قائمة الإجراءات. يرى المستخدم بعد ذلك نموذجًا يحتوي على جميع الحقول في النموذج الفرعي للخدمات ، حيث يمكنه إدخال معلومات حول الخدمة وإرسالها. نظرًا لأنه لا يمكن تنفيذ هذا الإجراء إلا من صفحة نتائج البحث ، فمن المنطقي أن يحصل الدور على هذا الإذن فقط إذا كان لديه أيضًا إذن "البحث عن سجلات الحالة التي يملكها مستخدمون آخرون".
            label: إضافة تقديم خدمة لحالة مستخدم آخر
          service_own_entries_only:
            explanation: ' تتيح هذه الصلاحية للمستخدم، عند الوصول إلى حالة تمت إحالتها إليه، عرض السجلات الموجودة في النموذج الفرعي "الخدمات" التي تم اختياره فيها فقط كمقدم خدمة. وتُستخدم هذه الصلاحية عادةً لأدوار مقدمي الخدمات.'
            label: ' الوصول فقط إلى السجلات الخاصة بي في النموذج الفرعي للخدمات'
          sync_external:
            explanation: القدرة على مزامنة سجل مع نظام إدارة معلومات خارجي
            label: تزامن مع نظام إدارة المعلومات الخارجية
          sync_mobile:
            explanation: يسمح للمستخدم بالتخزين المؤقت للحالات للاستخدام في وضع عدم الاتصال.
            label: وضع علامة على عدم الاتصال
          transfer:
            explanation: يسمح للمستخدم بإرسال حالة من مالك السجل الحالي إلى أي مستخدم في النظام لديه القدرة على تلقي عمليات النقل. ومع ذلك ، لا يتغير مالك سجل الحالة إلى أن "يقبل" مستلم النقل. إذا "رفض" المستلم النقل بدلاً من ذلك ، يفقد المستلم إمكانية الوصول إلى الحالة ، ويحتفظ بمالك السجل الأصلي.
            label: نقل حالة
          view_photo:
            explanation: يسمح للمستخدم بإرسال حالة من مالك السجل الحالي إلى أي مستخدم في النظام لديه القدرة على تلقي عمليات النقل. ومع ذلك ، لا يتغير مالك سجل الحالة إلى أن "يقبل" مستلم النقل. إذا "رفض" المستلم النقل بدلاً من ذلك ، يفقد المستلم إمكانية الوصول إلى الحالة ، ويحتفظ بمالك السجل الأصلي.
            label: عرض الصورة من عرض قائمة الحالة
          view_incident_from_case:
            explanation: '"عند عرض الحالة ، يمكن للمستخدم الاطلاع على قائمة بالأحداث المرتبطة بالحالة ، بالإضافة إلى بعض المعلومات الموجزة حول كل منها.'
            label: عرض الحوادث من القضية
          view_protection_concerns_filter:
            explanation: يسمح للمستخدم بمشاهدة عامل التصفية مخاوف الحماية في صفحة قائمة الحالات.
            label: اعرض عامل التصفية مخاوف الحماية في صفحة قائمة الحالات
          view_registry_record:
            explanation: يسمح للمستخدم بعرض معلومات أي سجل مرتبط بحالة. يسمح أيضًا للمستخدم بمشاهدة نموذج تفاصيل السجل على الحالة.
            label: عرض سجل التسجيل من الحالة
          write:
            explanation: القدرة على النقر فوق الزر "تعديل" وتحديث المعلومات في الحالة والنقر فوق "حفظ"
            label: تعديل
          accept_or_reject_transfer:
            explanation: السماح للمستخدم بقبول أو رفض النقل نيابة عن مستخدم آخر موجود في فريقك (على سبيل المثال ، يقبل المشرف نقل تم إرساله إلى منسق الحالة).
            label: قبول أو رفض النقل لمستخدم آخر في فريقك.
          list_case_names:
            explanation: 'لا يمكن للمشرفين عادةً رؤية أسماء الحالات في قائمة الحالات. إذا حصل المشرف على هذا الإذن ، فسيكون قادرًا على رؤية الأسماء في القائمة. '
            label: إذا كان المشرف، يمكنه رؤية أسماء الحالات في قائمة الحالة.
          mark_for_offline:
            explanation: يسمح للمستخدم بالتخزين المؤقت للحالة للاستخدام في وضع عدم الاتصال.
            label: وضع علامة على عدم الاتصال
          view_family_record:
            explanation: يمكن للمستخدمين عرض نموذج "سجل الأسرة" ضمن الحالة، والذي يتضمن رابطًا إلى سجل الأسرة المرتبط بالحالة.
            label: عرض سجل الاسره من الحالة
          case_from_family:
            explanation: ' يمكن للمستخدمين إنشاء حالة لأحد أفراد أسرة الحالة من خلال النموذج الفرعي "تفاصيل الأسرة". يُرجى ملاحظة أنه سيتم إنشاء سجل أسرة تلقائيًا لربط هاتين الحالتين ضمن الأسرة نفسها.'
            label: ' إنشاء حالة من تفاصيل الأسرة'
          link_family_record:
            explanation: ' يتيح للمستخدم البحث عن سجل أسرة موجود وربطه بالحالة. كما يتيح له إلغاء ارتباط سجل الأسرة بسجل الحالة.'
            label: ربط / إلغاء ربط سجل الأسرة بالحالة
          view_case_relationships:
            explanation: ' يتيح للمستخدم عرض قائمة بجميع الحالات المرتبطة بالحالة الحالية.'
            label: عرض الحالات المرتبطة
          update_case_relationships:
            explanation: ' تتيح هذه الصلاحية للمستخدم، عند تحديث الحالة الخاصة به، البحث عن حالة أخرى موجودة وربطها بالحالة الحالية. كما يتيح للمستخدمين أيضًا إلغاء ربط هذه الحالة الأخرى بالحالة الحالية.'
            label: ' ربط / إلغاء ربط حالة بحالة أخرى'
          attribute:
            explanation: حدد المستخدم الذي قام بالتعرّف على الحالة. في بعض الأنظمة، قد يكون هذا المستخدم ببساطة هو الذي بدأ أولًا إدخال المستفيد في مسار إدارة الحالة. وفي أنظمة أخرى تتيح التسجيل الذاتي، قد يكون هذا المستخدم هو المستفيد نفسه.
            label: ' الخاصية'
        explanation: يمثل طفلاً فرديًا أو ناجٍ أو مستفيد آخر.
        label: حالة
      dashboard:
        actions:
          action_needed_new_updated:
            explanation: يعرض مؤشر "جديد ومُحدث" في لوحة "الإجراءات المطلوبة". يشمل هذا الحالات التي تم تعيينها حديثًا للمستخدم الحالي، أو التي قام مستخدم آخر بتحديثها منذ آخر مرة قام فيها المستخدم الحالي بالتحديث.
            label: 'الإجراء المطلوب: جديد أو محدث'
          action_needed_identified:
            explanation: ' يعرض عدد الحالات التي تم اكتشافها، ولكن لم يتم فتحها بعد ولم تبدأ بتلقي خدمات إدارة الحالة.'
            label: 'إجراء مطلوب: الحالات المحددة'
          action_needed_new_referrals:
            explanation: ' يعرض مؤشر "الإحالات قيد الانتظار" في لوحة معلومات "الإجراءات المطلوبة". ويشمل ذلك الحالات التي توجد فيها إحالة للمستخدم الحالي ولم يقم بقبولها بعد.'
            label: 'إجراء مطلوب: الإحالات المعلّقة'
          action_needed_transfer_awaiting_acceptance:
            explanation: ' يعرض مؤشر "عمليات النقل بانتظار القبول" في لوحة معلومات "الإجراءات المطلوبة". ويشمل ذلك أي حالات تحتوي على عملية نقل إلى المستخدم الحالي ولم يقم المستخدم الحالي بقبولها بعد.'
            label: 'إجراء مطلوب: عمليات النقل بانتظار القبول'
          approvals_action_plan:
            explanation: يعرض عدد حالات المستخدم الحالي مع طلبات الموافقة على خطة العمل المعلقة أو الموافق عليها أو المرفوضة.
            label: مصادقات منسق الحالة عن %{approval_label} الحالة .
          approvals_action_plan_pending:
            explanation: يعرض عدد الحالات في مجموعة المشرف مع طلبات المصادقة على الخطة المعلقة.
            label: مصادقات المشرف على %{approval_label} الحالة .
          approvals_assessment:
            explanation: يعرض عدد حالات المستخدم الحالي مع طلبات المصادقة على التقييم المعلقة أو المصادق عليها أو المرفوضة
            label: مصادقات منسق الحالات عن %{approval_label} الحالة .
          approvals_assessment_pending:
            explanation: يعرض عدد الحالات في فريق المشرف مع طلبات المصادقة على التقييم المعلقة.
            label: مصادقات المشرف عن %{approval_label} الحالة .
          approvals_case_plan:
            explanation: يعرض عدد حالات المستخدم الحالي مع طلبات المصادقة على خطة الحالة المعلقة أو المصادق عليها أو المرفوضة.
            label: مصادقات منسق الحالات عن %{approval_label} الحالة .
          approvals_case_plan_pending:
            explanation: يعرض عدد الحالات في فريق المشرف مع طلبات المصادقة على خطة الحالة المعلقة.
            label: مصادقات المشرف عن %{approval_label} الحالة .
          approvals_closure:
            explanation: يعرض عدد حالات المستخدم الحالي مع طلبات مصادقة الإغلاق المعلقة أو المصادق عليها أو المرفوضة.
            label: مصادقات منسق الحالات عن %{approval_label} الحالة .
          approvals_closure_pending:
            explanation: يعرض عدد الحالات في فريق المشرف مع طلبات المصادقة على الإغلاق المعلقة.
            label: مصادقات المشرف عن %{approval_label} الحالة .
          approvals_gbv_closure:
            explanation: يعرض عدد حالات المستخدم الحالي مع طلبات المصادقات على إغلاق العنف القائم على النوع الاجتماعي والتي هي في انتظار المراجعة أو المصادق عليها أو المرفوضة.
            label: مصادقات منسق الحالات عن %{approval_label} الحالة .
          approvals_gbv_closure_pending:
            explanation: يوضح عدد الحالات في فريق المشرف مع طلبات المصادقة المعلقة لإغلاق العنف القائم على النوع الاجتماعي.
            label: مصادقات المشرف عن %{approval_label} الحالة .
          case_overview:
            explanation: نظرة عامة على بطاقة لوحة ملخص البيانات في الجزء العلوي من الصفحة الرئيسية ، والتي تتضمن أرقامًا مثل الإجمالي والحالات الجديدة
            label: نظرة عامة على لوحة ملخص البيانات
          case_risk:
            explanation: يظهر عدد الحالات في كل مستوى خطر.
            label: الحالات حسب مستوى الخطورة
          cases_by_task_overdue_assessment:
            explanation: سمح للمشرف بمعرفة عدد الحالات التي تأخرت فيها مهام التقييم لكل واحد من  العاملين في الحالة.
            label: مهام التقييم المتأخرة
          cases_by_task_overdue_case_plan:
            explanation: يسمح للمشرف بمعرفة عدد الحالات التي تأخرت فيها مهام خطة الحالة لكل واحد من العاملين في الحالة.
            label: مهام خطة الحالة المتأخرة
          cases_by_task_overdue_followups:
            explanation: يسمح للمشرف بمعرفة عدد الحالات التي تأخرت فيها مهام المتابعة لكل واحد من العاملين في الحالة.
            label: مهام المتابعة المتأخرة
          cases_by_task_overdue_services:
            explanation: يسمح للمشرف بمعرفة عدد الحالات التي تأخرت فيها مهام الخدمة لكل واحد من العاملين في الحالة.
            label: مهام الخدمة المتأخرة
          dash_case_incident_overview:
            explanation: ' يعرض للمدير أو المشرف عدد الحالات التي يديرها كل مستخدم ضمن فريقه، والتي تتم إحالتها أو نقلها إلى مستخدمين آخرين.'
            label: نظرة عامة - حالاتي / الحوادث
          dash_cases_by_incident_type:
            explanation: ' يعرض للمستخدم عدد الحالات لكل نوع من أنواع الحوادث.'
            label: ' الحالات حسب نوع الحادثة'
          dash_cases_by_social_worker:
            explanation: الجدول الذي يوضح كيفية العدد الإجمالي للحالات المفتوحة وعدد الحالات الجديدة التي يديرها كل مستخدم في مجموعات المستخدمين الحالية. يمثل كل صف مستخدمًا في مجموعات المستخدمين الخاصة بالمستخدم الحالي ، بينما يمثل "الإجمالي" و "الجديد" عمودين.
            label: عرض الحالات حسب منسق الحالة
          dash_cases_to_assign:
            explanation: 'هام: للاداريين فقط. يعرض عدد الحالات التي يمتلكها المستخدم الحالي مباشرةً (يجب أن يكون مديرًا). تفترض لوحة ملخص البيانات هذه أن المديرين لا يديرون حالاتهم الخاصة ، وأنه إذا كان لدى المدير حالاتهم الخاصة ، فيجب عليهم تعيين هذه الحالات لمنسقي الحالة في فريقهم.'
            label: (للمديرين) الحالات التي أحتاج إلى تعيينها لأشخاص في فريقي
          dash_flags:
            explanation: يعرض قائمة بالعلامات التي أضافها المستخدمون الآخرون إلى سجلاتي ، بالإضافة إلى العلامات التي أضفتها إلى سجلات المستخدمين الآخرين.
            label: السجلات ذات العلامات
          dash_group_overview:
            explanation: يُظهر للمدير عدد الحالات المفتوحة والمغلقة التي يديرها المستخدمون في فريقهم.
            label: حالات مجموعاتي
          dash_matching_results:
            explanation: إهمال. لوحة ملخص البيانات هذه غير وظيفية وستتم إزالتها في الإصدار 2.
            label: عرض النتائج المطابقة
          dash_protection_concerns:
            explanation: الجدول الذي يوضح عدد الحالات التي لها كل مخاوف تتعلق بالحماية. يمثل كل صف في الجدول أحد الشواغل المتعلقة بالحماية ، بينما تشير الأعمدة إلى حالات مختلفة للحالات ("كل الحالات" ، "الحالات المفتوحة" ، "الجديدة (هذا الأسبوع)" ، "مغلقة (هذا الأسبوع)")
            label: القضايا حسب اهتمامات الحماية
          dash_protection_concerns_by_location:
            explanation: هذه هي نفس لوحة ملخص البيانات "عرض مخاوف الحماية" ، باستثناء أنه يمكن للمستخدم تحديد موقع من القائمة المنسدلة لعرض إحصائيات حول انتشار مخاوف الحماية في هذا الموقع فقط.
            label: عرض مخاوف الحماية حسب الموقع
          dash_reporting_location:
            explanation: الجدول الذي يوضح عدد الحالات الموجودة في كل موقع (على مستوى واحد من الخصوصية مثل "مقاطعة" أو "منطقة"). كل صف في الجدول عبارة عن موقع ، وتشير الأعمدة إلى حالات مختلفة للحالات ("OPEN CASES" ، "NEW (LAST WEEK)" ، جدي (هذا الأسبوع)" ، "CLOSED (LAST WEEK) ،" "CLOSED (هذا الاسبوع)"). تستخدم عادة لحسابات المدير أو المسؤول.
            label: الحالات عن طريق الإبلاغ عن الموقع
          dash_service_provisions:
            explanation: يعرض عدد الحالات التي قام فيها مستخدمون آخرون بإضافة تقديم خدمة لهم. يظهر هذا الرقم في القسم الرئيسي من لوحة ملخص البيانات (داشبورد)
            label: الحالات حسب نوع تقديم الخدمة
          dash_shared_from_my_team:
            explanation: يُظهر  للمدير او المشرف عدد الحالات التي يديرها كل مستخدم في فريقه ، والتي تتم إحالتها أو نقلها إلى مستخدمين آخرين.
            label: حالات مشاركة من مجموعتي مع المجموعات الأخرى
          dash_shared_with_me:
            explanation: يوضح عدد الحالات التي تم إحالتها أو نقلها إليك.
            label: حالات مشاركة معي
          dash_shared_with_my_team:
            explanation: يُظهر  للمدير او المشرف عدد الحالات التي تمت إحالتها أو نقلها إلى كل مستخدم في فريقه.
            label: حالات مشاركة مع مجموعتي
          dash_shared_with_my_team_overview:
            explanation: يُظهر للمدير او المشرف عدد الحالات التي تمت إحالتها أو نقلها إلى كل مستخدم في فريقه.
            label: حالات مشاركة مع مجموعتي (نظرة عامة)
          dash_shared_with_others:
            explanation: يوضح عدد حالاتي التي تحتوي على إحالات نشطة أو عمليات نقل معلقة أو مرفوضة. ليس عادةً للمشرفين ، ما لم يديروا القضايا بأنفسهم.
            label: حالات مشاركة مع مجموعات أخرى
          dash_violations_category_verification_status:
            explanation: 'يُظهر عدد انتهاكات MRM من كل نوع والتي تم تصنيفها حسب وضع التحقق '
            label: MRM - عدد الانتهاكات لكل حالة تحقق
          dash_violations_category_region:
            explanation: يوضح عدد انتهاكات MRM التي حدثت في كل منطقة ، مقسمة حسب نوع الانتهاك.
            label: MRM - عدد الانتهاكات لكل منطقة
          dash_perpetrator_armed_force_group_party_names:
            explanation: يُظهر عدد انتهاكات MRM من كل نوع والتي تم تصنيفها حسب المسيء
            label: MRM - عدد الانتهاكات حسب المسيء
          dash_show_none_values:
            explanation: يضيف فئة "بلا مستوى مخاطرة" إضافية إلى جميع لوحات ملخص البيانات التي تقسم الحالات حسب مستوى المخاطرة. هذا مخصص بشكل خاص للتكوينات التي تحتوي على خيار "بلا مخاطر" رابع لحقول مستوى المخاطرة.
            label: عرض الحالات ذات "مستوى عدم وجود مخاطر" في لوحة ملخص بيانات (داشبورد) التقييم
          dash_tasks:
            explanation: يسمح للمستخدم برؤية صفحة المهام. يجب استخدام هذا للعاملين في الحالة ومقدمي الخدمات ، حيث ستكون الأرقام مخصصة للحالات التي تديرها بشكل مباشر. يجب على المديرين بدلاً من ذلك الحصول على لوحة ملخص بيانات "عرض الحالات حسب المهمة المتأخرة" ، لأن هذا يتيح لهم رؤية المهام المتأخرة لكل شخص في مجموعات المستخدمين الخاصة بهم.
            label: صفحة المهام
          dash_national_admin_summary:
            explanation: يظهر إجمالي الحالات المفتوحة في النظام ، وعدد الحالات الجديدة التي تم إنشاؤها في كل من الأسبوعين الماضيين ، وعدد الحالات التي تم إغلاقها في كل من الأسبوعين الماضيين.
            label: ملخص المسؤول
          view_response:
            explanation: لكل نوع من أنواع الاستجابة ، يوضح عدد الحالات في كل مستوى من مستويات المخاطر التي لديها خدمات اقتربت من الموعد النهائي أو تأخرت في الانتهاء.
            label: عرض الاستجابات
          workflow:
            explanation: للسماح لمنسق الحالة برؤية رسم بياني دائري يوضح عدد حالاتهم في كل مرحلة من مراحل سير عمل إدارة الحالة.
            label: الحالات مقسمة حسب سير العمل
          workflow_team:
            explanation: يسمح للمشرف برؤية جدول يوضح عدد حالات منسقي الحالة في كل مرحلة من مراحل إجراءات إدارة الحالة
            label: الحالات حسب سير العمل ومنسق الحالة
        explanation: تملي المعلومات الموجزة التي تظهر على الصفحة الرئيسية.
        label: لوحة ملخص البيانات (داشبورد)
      disabled:
        explanation: إذا قمت بتعطيل هذا الدور ، فلن تتمكن بعد الآن من تعيينه إلى حسابات المستخدمين.
        label: مُعطله
      referral_authorization:
        explanation: ' يعني ذلك أن هذا الدور سيظهر كخيار ضمن القائمة المنسدلة "نوع الإحالة" عندما يقوم المستخدم بإجراء إحالة داخلية. وإذا اختار المستخدم هذا الدور كنوع للإحالة، فلن يتمكن مستلم الإحالة من الوصول إلا إلى النماذج التي يملك هذا الدور صلاحية الوصول إليها.


          فعلى سبيل المثال، إذا اختار المستخدم "مقدم الخدمات الطبية" كنوع للإحالة، وكان دور مقدم الخدمات الطبية يمتلك صلاحية الوصول فقط إلى نموذجي "معلومات الحالة" و"مخاوف الحماية"، فلن يتمكن مستلم الإحالة من عرض سوى هذين النموذجين.'
        label: ' هل يمكن استخدام هذا الدور ضمن القائمة المنسدلة "نوع الإحالة"؟'
      duplicate:
        actions:
          read:
            explanation: يسمح للمستخدم بإجراء بحث متقدم لجميع الحالات في النظام ، باستخدام عدد من المعايير ، بما في ذلك الاسم واللقب والجنس والعمر والجنسية.
            label: عرض
        explanation: بحث متقدم عن لدور المديرين في النظام.
        label: بحث مكرر
      forms:
        case:
          explanation: 'تقييد وصول المستخدم إلى النماذج في الحالات يحد من المعلومات التي يمكن للمستخدم رؤيتها في الحادث. على سبيل المثال ، إذا كان المستخدم لديه حق الوصول إلى نموذج مالك السجل فقط ، فسيكون أيضًا قادرًا فقط على رؤية المعلومات الواردة في الحقول الموجودة في هذا النموذج. إذا كان المستخدم الحالي لديه وصول محدود إلى النموذج ولديه القدرة على إدارة تكوين النموذج ، فإن تقييد وصوله إلى النموذج يحد أيضًا من النماذج التي يمكنه تكوينها. ملاحظة: إذا لم يتم تحديد أي نماذج ، فهذا يعني أن الدور لديه حق الوصول إلى جميع النماذج للحالات.'
          label: نماذج - حالة
        incident:
          explanation: 'تقييد وصول المستخدم إلى النماذج الخاصة بطلبات التتبع يحد من المعلومات التي يمكن للمستخدم رؤيتها في أي حادث. على سبيل المثال ، إذا كان المستخدم لديه حق الوصول إلى نموذج مالك السجل فقط ، فسيكون أيضًا قادرًا فقط على رؤية المعلومات الواردة في الحقول الموجودة في هذا النموذج. إذا كان المستخدم الحالي لديه وصول محدود إلى النموذج ولديه القدرة على إدارة تكوين النموذج ، فإن تقييد وصوله إلى النموذج يحد أيضًا من النماذج التي يمكنه تكوينها. ملاحظة: إذا لم يتم تحديد أي نماذج ، فهذا يعني أن الدور لديه حق الوصول إلى جميع نماذج الحوادث.'
          label: نماذج - حادثة
        tracing_request:
          explanation: 'تقييد وصول المستخدم إلى النماذج في طلبات التتبع يحد من المعلومات التي يمكن للمستخدم رؤيتها في طلب التتبع. على سبيل المثال ، إذا كان المستخدم لديه حق الوصول إلى نموذج مالك السجل فقط ، فسيكون أيضًا قادرًا فقط على رؤية المعلومات الواردة في الحقول الموجودة في هذا النموذج. إذا كان المستخدم الحالي لديه وصول محدود إلى النموذج ولديه القدرة على إدارة تكوين النموذج ، فإن تقييد وصوله إلى النموذج يحد أيضًا من النماذج التي يمكنه تكوينها. ملاحظة: إذا لم يتم تحديد أي نماذج ، فهذا يعني أن الدور لديه حق الوصول إلى كافة النماذج الخاصة بطلبات التتبع.'
          label: نماذج  - طلب التتبع
        registry_record:
          explanation: 'تقييد وصول المستخدم إلى النماذج الخاصة بطلبات التتبع يحد من المعلومات التي يمكن للمستخدم رؤيتها في أي حادث. على سبيل المثال ، إذا كان المستخدم لديه حق الوصول إلى نموذج مالك السجل فقط ، فسيكون أيضًا قادرًا فقط على رؤية المعلومات الواردة في الحقول الموجودة في هذا النموذج. إذا كان المستخدم الحالي لديه وصول محدود إلى النموذج ولديه القدرة على إدارة تكوين النموذج ، فإن تقييد وصوله إلى النموذج يحد أيضًا من النماذج التي يمكنه تكوينها. ملاحظة: إذا لم يتم تحديد أي نماذج ، فهذا يعني أن الدور لديه حق الوصول إلى جميع نماذج الحوادث.'
          label: النماذج - التسجيل
        family:
          label: النماذج - الأسرة
          explanation: 'تقييد وصول المستخدم إلى نماذج الأسرة يحدّ من المعلومات التي يمكنه الاطلاع عليها ضمن سجل الأسرة. فعلى سبيل المثال، إذا كان المستخدم يمتلك صلاحية الوصول إلى نموذج "مالك السجل" فقط، فسيتمكن من رؤية المعلومات الموجودة في حقول ذلك النموذج فقط. وإذا كان المستخدم الحالي يمتلك صلاحيات وصول محدودة إلى النماذج مع إمكانية إدارة إعدادات النماذج، فإن هذا التقييد سيحدّ أيضًا من النماذج التي يمكنه إعدادها أو تعديلها.'
      group:
        actions:
          admin_only:
            explanation: هذا يعني أن المستخدمين الذين لديهم هذا الدور سيكونون قادرين فقط على رؤية الأشياء المتعلقة بإدارة النظام ، مثل التقارير ، وتكوين النموذج والبحث ، والمستخدمين ، والأدوار ، ومجموعات المستخدمين. لن يروا أي حالات فردية أو طلبات تعقب أو حوادث.
            label: لا توجد سجلات - وظائف المشرف فقط
          agency:
            explanation: يمكن للدور الوصول إلى السجلات التي يديرها جميع المستخدمين في وكالتهم. إذا كان المستخدم لديه حق الوصول إلى المستخدمين ، فيمكنه الوصول إلى جميع المستخدمين في وكالتهم.
            label: جميع السجلات أو المستخدمين في مؤسستي
          all:
            explanation: يمكن للدور الوصول إلى جميع السجلات والمستخدمين ومجموعات المستخدمين في النظام ، بغض النظر عن مجموعات المستخدمين التي ينتمون إليها.
            label: الوصول لجميع السجلات أو المستخدمين
          group:
            explanation: يمكن للدور الوصول إلى السجلات التي يديرها جميع المستخدمين في مجموعات المستخدمين الخاصة بهم. يمكنهم فقط الوصول إلى المستخدمين في مجموعات المستخدمين الخاصة بهم. يمكنهم فقط الوصول إلى مجموعات المستخدمين الخاصة بهم.
            label: 'الوصول لجميع السجلات أو المستخدمين في مجموعتي '
          self:
            explanation: يمكن للدور الوصول إلى السجلات الخاصة بهم (الحالات أو طلبات التعقب أو الحوادث) ، ويمكنه تحرير حساب المستخدم الخاص بهم.
            label: الوصول لسجلاتي أو المستخدم فقط
          webhook:
            label: الويب هوك
        explanation: يتحكم في السجلات (الحالات أو طلبات التعقب أو الحوادث) ، يمكن للدور الوصول إليه. إذا كان للدور حق الوصول إلى المستخدمين ومجموعات المستخدمين ، فإن هذا يتحكم أيضًا في المستخدمين ومجموعات المستخدمين التي يمكنهم الوصول إليها. الأدوار التي لها حق الوصول إلى "بلا سجلات" يمكنها فقط الوصول إلى تكوين النظام مثل النماذج والمستخدمين والتقارير.
        label: ما السجلات التي يؤثر فيها هذا الدور؟
      incident:
        actions:
          assign:
            explanation: ' يتيح للمستخدم تعيين حادثة من مالك السجل الأصلي إلى أي مستخدم آخر في النظام. ولا يمكن تعيين الحوادث المرتبطة بالفعل بحالة؛ إذ يجب بدلًا من ذلك إعادة تعيين الحالة المرتبطة، مما سيؤدي إلى تحديث ملكية سجل الحادثة تلقائيًا.'
            label: تعيين
          change_log:
            explanation: يمكن للمستخدم رؤية محفوظات لجميع التغييرات التي تم إجراؤها على السجل منذ إنشائه. يتضمن هذا القيم المسجلة لجميع الحقول.
            label: 'سجل التغيير '
          access_log:
            explanation:   يمكن للمستخدم الاطلاع على سجل يتضمن جميع مرات الوصول إلى السجل من قبل المستخدمين الذين ليسوا مالكي السجل الحاليين (بما في ذلك عمليات العرض والتحديث)، وذلك منذ إنشاء السجل.
            label: سجل الوصول
          create:
            explanation: القدرة على إنشاء حادثة.
            label: إنشاء
          enable_disable_record:
            explanation: القدرة على تعطيل أو تمكين حادث. لا تظهر الحوادث "المعطلة" بشكل افتراضي في قائمة الحوادث. يمكن للمستخدمين رؤية الحوادث المعطلة في قائمة الحوادث من خلال تطبيق مرشح.
            label: تفعيل / تعطيل
          export_case_pdf:
            explanation: يمكن للمستخدم إنشاء تصدير ملف PDF من قائمة الحوادث أو صفحات عرض الحوادث ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لسجل واحد أو متعدد أو جميع السجلات التي يمكن للمستخدم الوصول إليها. في ملف تصدير PDF ، يتم سرد المعلومات أولاً حسب الحالة ، ثم يتم تنظيمها بشكل أكبر حسب النموذج الذي تظهر عليه المعلومات.
            label: تصدير ملف إلى PDF
          export_csv:
            explanation: يمكن للمستخدم إنشاء تصدير ملف CSV من قائمة الحوادث أو صفحات عرض الحوادث ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لحادث واحد أو عدة حوادث أو جميع الحوادث التي يمكن للمستخدم الوصول إليها.
            label: تصدير ملف إلى CSV
          export_custom:
            explanation: يمكن للمستخدم تحديد نماذج أو حقول محددة لتصديرها على صيغة ملف XLS.
            label: تصدير ملف مخصص
          export_incident_recorder_xls:
            explanation: يمكن للمستخدم إنشاء ملف تصدير XLS متخصص يسمح بتبادل البيانات باستخدام أداة GBV Incident Recorder.
            label: تصدير سجل الحادثة بامتداد XLS
          export_mrm_violation_xls:
            explanation: يمكن للمستخدم إنشاء تصدير Excel (ملف XLS) متخصص لانتهاكات MRM. هذا الإجراء متاح في صفحة عرض الحوادث وقائمة الحوادث.
            label: تصدير انتهاكات MRM إلى Excel (ملف XLS)
          export_json:
            explanation: يمكن للمستخدم إنشاء ملف تصدير JSON من قائمة الحوادث أو صفحات عرض الحوادث ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لحادث واحد أو متعدد أو لجميع الحوادث التي يمكن للمستخدم الوصول إليها. يستخدم هذا التصدير بشكل أساسي لأولئك الذين يرغبون في تصدير الحوادث من نظام Primero الحالي ثم استيرادها إلى نظام Primero مختلف ، أو إلى نظام إدارة معلومات آخر. تنسيق JSON قابل للقراءة آليًا وغير عملي لمعظم المستخدمين.
            label: تصدير JSON
          export_list_view_csv:
            explanation: يمكن للمستخدم إنشاء ملف تصدير CSV من صفحة قائمة الحوادث التي تحتوي على نفس الحقول التي تظهر لهذا المستخدم في قائمة الحوادث. نفذت فقط من صفحة قائمة الحوادث.
            label: تصدير ملف عرض قائمة csv
          export_pdf:
            explanation: يمكن للمستخدم إنشاء تصدير ملف PDF من قائمة الحوادث أو صفحات عرض الحوادث ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لسجل واحد أو متعدد أو جميع السجلات التي يمكن للمستخدم الوصول إليها. في ملف تصدير PDF ، يتم سرد المعلومات أولاً حسب الحالة ، ثم يتم تنظيمها بشكل أكبر حسب النموذج الذي تظهر عليه المعلومات.
            label: تصدير ملف إلى PDF
          export_xls:
            explanation: يمكن للمستخدم إنشاء تصدير ملف XLS من قائمة الحوادث أو صفحات عرض الحوادث ، والتي تحتوي على مجموعة مخصصة من النماذج أو الحقول ، لحالة واحدة أو متعددة أو جميع الحالات التي يمكن للمستخدم الوصول إليها. في هذا التصدير ، يتم تمثيل كل نموذج في علامة التبويب الخاصة به داخل ملف XLS. يمكن للمستخدم تحديد النماذج أو الحقول التي يريد تضمينها في التصدير باستخدام صيغة Custom Export. يرجى ملاحظة أن المستخدمين يمكنهم فقط تضمين النماذج والحقول في التصدير إذا كان لديهم بالفعل القدرة على رؤية تلك النماذج والحقول عند عرض حالة في التطبيق.
            label: تصدير ملف Excel (ملف XLS)
          flag:
            explanation: القدرة على إضافة علامة إلى الحادث. يمكن للمستخدمين الذين لديهم هذا الإذن أيضًا إزالة العلامات التي أضافوها إلى إحدى الحوادث.
            label: علامة
          resolve_any_flag:
            explanation: يسمح للمستخدم بحل أي علامة على السجل، بغض النظر عمن قام بإنشاء العلامة.
            label: حل اي علامة
          flag_update:
            explanation: ' يتيح للمستخدم تحديث أي علامة على السجل، بغض النظر عن المستخدم الذي قام بإنشاء تلك العلامة.'
            label: تحديث العلامة
          import:
            explanation: يسمح للمستخدم بإنشاء حدث جديد أو أكثر من خلال استيرادها من ملف CSV أو Excel أو JSON. يجب أن يكون الملف الذي تم استيراده بتنسيق * جدا * بشكل خاص حتى يتم استيراد المعلومات بشكل صحيح. يجب أن تكون هذه الوظيفة متاحة فقط للمستخدمين الإداريين ذوي المهارات التقنية المتقدمة والمعرفة المتعمقة بكيفية تنسيق البيانات في Primero. نفذت فقط من صفحة قائمة الحوادث.
            label: استيراد
          remove_alert:
            explanation: تتيح هذه الصلاحية للمستخدم إزالة تنبيه من إحدى الحوادث. وعادةً ما يتم إنشاء التنبيهات عند تعديل حقل معين، مثل تحديث الملاحظات. وتظهر هذه التنبيهات عادةً على شكل نقطة صفراء بجانب الحادثة.
            label: إزالة تنبيه من الحادثة
          link_incident_to_case:
            explanation: يسمح للمستخدم بربط الحادثة بالحالة المحددة.
            label: ربط الحادثه بحالة
          manage:
            explanation: يسمح للمستخدم بتنفيذ جميع الإجراءات المتاحة على الحوادث. إذن "الإدارة" يعني أساسًا "كل شيء".
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
          read:
            explanation: القدرة على عرض الحادثه
            label: عرض
          sync_mobile:
            explanation: يسمح هذا الإذن بشكل عام للمستخدم باستخدام تطبيق الهاتف المحمول. أولاً ، يسمح للمستخدم برؤية إجراءات "Mark for Mobile" و "Un-mark for Mobile" ، والتي تظهر في قائمة الحوادث وصفحات عرض الحوادث. يشير وضع علامة على حادثة للجوال إلى أنه يجب مزامنة المعلومات المتعلقة بهذا الحادث بين الجهاز المحمول للمستخدم وتطبيق الويب ، بينما يؤدي إلغاء تحديد حادثة للجوال إلى إيقاف حدوث هذه المزامنة. لا يمكن للمستخدمين الذين ليس لديهم هذا الإذن أيضًا مزامنة أجهزتهم المحمولة مع تطبيق الويب بشكل عام ، مما يعني أنهم لا يستطيعون استخدام تطبيق الهاتف لإدارة الحوادث.
            label: مزامنة مع جهاز المحمول
          verify_mrm:
            explanation: يمكن لمستخدم آلية الرصد والابلاغ تغيير لائحة الانتهاكات.
            label: تحقق من آلية الرصد والابلاغ
          write:
            explanation: القدرة على النقر فوق الزر "تحرير" وتحديث المعلومات حول الحادث والنقر فوق "حفظ". كما يسمح للمستخدم بتعطيل أو تمكين حادث.
            label: تعديل
        explanation: يمثل الحدث الذي وقع. عادة ما تكون هذه حوادث إساءة أو عنف ، على الرغم من أنها يمكن أن تتوافق أيضًا مع أحداث مثل المواجهات مع سلطات إنفاذ القانون. غالبًا ما ترتبط الحوادث بالحالات.
        label: حادثة
      is_manager:
        explanation: ينطبق على أي دور مستخدم يشرف عمومًا على مستخدمين آخرين. يسمح هذا للمستخدم بمشاهدة لوحات ملخص البيانات (داشبورد) والفلاتر التي تساعد المستخدم في إدارة فريق.
        label: هل هو مدير؟
      managed_report:
        actions:
          reporting_locations_report:
            label: موقع الإبلاغ (حالات)
            explanation: القدرة على عرض إحصائيات حول عدد الحالات المسجلة خلال نطاق زمني معين، وتصفيتها حسب موقع الإبلاغ، ومقسمة حسب العمر والجنس. يسمح هذا الإذن أيضًا للمستخدم بتصدير البيانات من الرؤى.
          followups_report:
            label: المتابعات (حالات)
            explanation: القدرة على عرض إحصائيات حول عدد المتابعات التي تم إجراؤها خلال نطاق زمني محدد، والتي تمت تصفيتها حسب نوع المتابعة، ومقسمة حسب العمر والجنس. يسمح هذا الإذن أيضًا للمستخدم بتصدير البيانات من الرؤى.
          services_report:
            label: الخدمات (الحالات)
            explanation: القدرة على عرض إحصائيات حول عدد الخدمات المقدمة خلال نطاق زمني معين، مفلترة حسب نوع الخدمة، ومقسمة حسب العمر والجنس. يسمح هذا الإذن أيضًا للمستخدم بتصدير البيانات من الرؤى.
          protection_concerns_report:
            label: مخاطر الحماية (الحالات)
            explanation: القدرة على عرض إحصائيات حول مخاطر حماية الأطفال للملفات المسجلة خلال نطاق زمني محدد. يسمح هذا الإذن أيضًا للمستخدم بتصدير البيانات من الرؤى.
          managed_report_scope:
            label: ما هي السجلات التي يمكن لهذا الدور رؤيتها من المؤشرات الإحصائية (الرؤى)؟
          managed_report_scope_all:
            label: الكل
          managed_report_scope_group:
            label: البيانات المستندة إلى المجموعة فقط
          managed_report_scope_agency:
            label: البيانات المستندة إلى المؤسسة فقط
          violations:
            explanation: القدرة على الوصول إلى انتهاكات آلية الرصد والابلاغ من المؤشرات الإحصائية.
            label: الانتهاكات
          gbv_statistics:
