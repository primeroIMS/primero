            explanation: ' يتيح للمستخدم  نقل سجل أسرة من مالك السجل الأصلي إلى أي مستخدم آخر في النظام. ولا يتطلب هذا الإجراء الحصول على موافقة. كما يتيح للمستخدم تعيين عدة سجلات أسر في الوقت نفسه من خلال عرض القائمة.'
            label: تعيين
          search_owned_by_others:
            explanation: ' يتيح للمستخدم إجراء بحث عن سجلات لا يملك عادةً صلاحية الوصول إليها، سواء لكونه ليس مالك سجل تلك الأسرة، أو (بالنسبة للمديرين) لأن مالك السجل لا ينتمي إلى مجموعات المستخدمين التابعة لهم. ومع ذلك، ورغم ظهور سجل الأسرة في نتائج البحث، فلن يتمكن المستخدم من فتح صفحة عرض سجل الأسرة، وبالتالي لن يتمكن من الاطلاع على أي معلومات تفصيلية عنه.'
            label: ' البحث عن سجلات الأسر المملوكة لمستخدمين آخرين'
          search_and_select_family_record:
            explanation: 'يتيح للمستخدم البحث عن سجل أسرة واختياره عند تنفيذ إجراءات على سجلات أخرى (مثل ربط سجل أسرة بحالة خاصة به). ولا تمنح هذه الصلاحية إمكانية الوصول إلى قائمة الأسر أو صفحات عرض سجلات الأسر.'
            label: ' البحث عن سجل أسرة واختياره'
          display_view_page:
            explanation: ' يتيح للمستخدمين عرض معلومات المعاينة الخاصة بسجل الأسرة، حتى إذا لم يكن لديهم صلاحية الوصول إلى السجل الكامل. ويمكن للمسؤولين تحديد الحقول التي تظهر في هذه المعاينة من خلال تفعيل خيار "النموذج المختصر" للحقل ضمن محرر النماذج.'
            label: معاينة
        label: الأسرة
      report:
        actions:
          create:
            explanation: القدرة على إنشاء تقرير جديد. عندما يُنشئ المستخدم تقريرًا ، يصبح مرئيًا لجميع المستخدمين الذين لديهم حق الوصول "للقراءة" أو "قراءة المجموعة" إلى التقارير.
            label: إنشاء
          group_read:
            explanation: القدرة على عرض جميع التقارير. ستظهر الأرقام في كل تقرير فقط تلك السجلات التي يمكن الوصول إليها من قبل المستخدمين في مجموعات المستخدمين الحالية. غالبًا ما يتم استخدام هذا الإذن للمسؤولين المحليين أو الإقليميين أو الوكالات الذين يتطلعون إلى اكتساب رؤى حول أداء فرقهم أو مؤسستهم. يمنح هذا الإذن المستخدم أيضًا القدرة على تصدير البيانات من تقرير.
            label: عرض (البيانات المستندة إلى المجموعة)
          manage:
            explanation: يسمح للمستخدم بتنفيذ جميع الإجراءات المتاحة على الوكالات. إذن "الإدارة" يعني أساسًا "كل شيء".
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
          read:
            explanation: القدرة على عرض جميع التقارير. ستعكس الأرقام الموجودة في كل تقرير جميع السجلات في النظام ، بدلاً من مجرد السجلات التي يمتلك المستخدم الحالي حق الوصول إليها. يمنح هذا الإذن المستخدم أيضًا القدرة على تصدير البيانات من تقرير.
            label: عرض
          write:
            explanation: القدرة على تحرير جميع التقارير (بما في ذلك تلك التي أنشأها مستخدمون آخرون).
            label: تعديل
          agency_read:
            explanation: القدرة على عرض جميع التقارير. ستعكس الأرقام الواردة في كل تقرير فقط تلك السجلات التي يمكن الوصول إليها من قبل المستخدمين في وكالة المستخدم الحالية. غالبًا ما يستخدم هذا الإذن لمسؤولي نظام الوكالة.
            label: عرض (البيانات المستندة إلى المنظمة)
        explanation: أداة تحليل البيانات المجمعة. يشمل تمثيلات الجدول والرسم البياني للبيانات.
        label: تقرير
      reporting_location_level:
        explanation: 'سيتحكم هذا في مستوى المواقع التي تظهر لهذا الدور في لوحات ملخص البيانات (داشبورد) ، والفلاتر ، وشروط الإحالة ، وشروط النقل. إذا تركت هذا الحقل فارغًا ، فسيرى هذا الدور مستوى موقع الإبلاغ الافتراضي للنظام.'
        label: ما نوع الموقع الذي يجب استخدامه للإبلاغ عن هذا الدور؟
      role:
        actions:
          assign:
            explanation: القدرة على تحديد دور عند إنشاء أو تحرير حساب مستخدم. هذا الإذن ضروري لأي دور يقوم بإنشاء أو تحرير حسابات المستخدمين.
            label: تعيين
          copy:
            explanation: القدرة على إنشاء نسخة من الدور. هذا مفيد لمسؤولي النظام الذين قد ينشئون عددًا من الأدوار المتشابهة جدًا مع بعضها البعض (مثل مزودي الخدمة).
            label: نسخ
          create:
            explanation: القدرة على انشاءدور
            label: إنشاء
          delete:
            explanation: القدرة على حذف الدور.
            label: حذف
          manage:
            explanation: 'يسمح للمستخدم بتنفيذ جميع الإجراءات المتاحة على الأدوار. إذن "الإدارة" يعني أساسًا "كل شيء". هام: يمنح هذا أيضًا القدرة على إنشاء الأدوار وحذفها.'
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
          permitted_roles:
            explanation: 'إذا كان لدى دورٍ معين صلاحية تنفيذ أي من الإجراءات المذكورة أعلاه على الأدوار، فسيكون بإمكانه تنفيذ تلك الإجراءات على الأدوار المحددة في هذه القائمة.


              فعلى سبيل المثال، إذا كان لدى دورٍ معين صلاحيتا «الاطلاع» و"تعيين" فيما يتعلق بالأدوار، ولكن القائمة المحددة ضمن حقل "الأدوار التي يديرها" (Managed Roles) تقتصر على "منسق حالة" (CP Case Worker) و"مشرف منسقي حاله" (CP Manager)، فسيكون بإمكانه الاطلاع على هذين الدورين فقط، كما سيقتصر تعيين المستخدمين الجدد على هذين الدورين.


              أما إذا لم يتم تحديد أي أدوار ضمن حقل "الأدوار التي يديرها"، فسيكون بإمكانه الاطلاع على جميع الأدوار وإنشاء حسابات مستخدمين جديدة باستخدام أي دور متاح في النظام.'
            label: أدوار أخرى يديرها هذا الدور
          read:
            explanation: القدرة على رؤية الأدوار
            label: عرض
          write:
            explanation: القدرة على النقر فوق الزر "تحرير" في صفحة عرض الدور ، وتحديث أذونات الدور ، ثم حفظ الدور.
            label: تعديل
        explanation: تملي الإجراءات التي يمكن للمستخدم تنفيذها في النظام.
        label: أدوار المستخدم
      system:
        actions:
          manage:
            explanation: القدرة على رؤية المعلومات وتحديثها على معلومات الاتصال بالنظام والإشعارات الافتراضية وإعدادات البريد الإلكتروني الترحيبية والخوادم المتزامنة. عادة ما يكون هذا الإذن محجوزًا لمسؤول النظام
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
        explanation: إعدادات التكوين المتنوعة على مستوى النظام.
        label: نظام
      tracing_request:
        actions:
          change_log:
            explanation: يمكن للمستخدم رؤية التغييرات السابقة التي تم إجراؤها على السجل منذ إنشائه. يتضمن هذا القيم المسجلة لجميع الحقول.
            label: 'سجل التغيير '
          access_log:
            explanation: يمكن للمستخدم الاطلاع على سجل بجميع عمليات الوصول إلى السجل (عرض أو تحديث) التي أجراها مستخدمون غير المسؤول الحالي عن الحالة، وذلك منذ تاريخ إنشاء السجل.
            label: سجل الوصول
          create:
            explanation: القدرة على إنشاء طلب تتبع
            label: إنشاء
          enable_disable_record:
            explanation: القدرة على تعطيل أو تمكين طلب التتبع. لا تظهر طلبات التتبع "المعطلة" بشكل افتراضي في قائمة طلبات التتبع. يمكن للمستخدمين رؤية طلبات التتبع المعطلة في قائمة طلبات التتبع عن طريق تطبيق عامل تصفية.
            label: تفعيل / تعطيل
          export_case_pdf:
            explanation: يمكن للمستخدم إنشاء تصدير ملف PDF من قائمة طلبات التتبع أو عرض صفحات طلب التتبع ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لسجل واحد أو متعدد أو جميع السجلات التي يمتلك المستخدم حق الوصول إليها. في ملف تصدير PDF ، يتم سرد المعلومات أولاً حسب الحالة ، ثم يتم تنظيمها بشكل أكبر حسب النموذج الذي تظهر عليه المعلومات.
            label: تصدير ملف إلى PDF
          export_csv:
            explanation: يمكن للمستخدم إنشاء تصدير ملف CSV من قائمة طلبات التتبع أو عرض صفحات طلب التتبع ، والتي تحتوي على جميع الحقول التي يمتلك المستخدم الحالي حق الوصول إليها ، لطلبات تتبع واحدة أو متعددة أو جميع طلبات التتبع التي يمتلك المستخدم حق الوصول إليها.
            label: تصدير ملف إلى CSV
          export_custom:
            explanation: يمكن للمستخدم إنشاء تصدير ملف XLS من قائمة طلبات التتبع أو صفحات عرض طلب التتبع ، والتي تحتوي على مجموعة مخصصة من النماذج أو الحقول ، لطلب تتبع واحد أو متعدد أو كل طلبات التتبع التي يمتلك المستخدم حق الوصول إليها. في هذا التصدير ، يتم تمثيل كل نموذج في علامة التبويب الخاصة به داخل ملف XLS. يمكن للمستخدم تحديد النماذج أو الحقول التي يريد تضمينها في التصدير باستخدام صيغة Custom Export. يرجى ملاحظة أن المستخدمين يمكنهم فقط تضمين النماذج والحقول في التصدير إذا كان لديهم بالفعل القدرة على رؤية تلك النماذج والحقول عند عرض طلب التتبع في التطبيق.
            label: تصدير ملف مخصص
          export_json:
            explanation: يمكن للمستخدم إنشاء تصدير ملف JSON من قائمة طلبات التتبع أو عرض صفحات طلب التتبع ، والتي تحتوي على جميع الحقول التي يمتلك المستخدم الحالي حق الوصول إليها ، لطلبات تتبع واحدة أو متعددة أو جميع طلبات التتبع التي يمتلك المستخدم حق الوصول إليها. يستخدم هذا التصدير بشكل أساسي لأولئك الذين يرغبون في تصدير طلبات التتبع من نظام Primero الحالي ثم استيرادها إلى نظام Primero مختلف ، أو إلى نظام إدارة معلومات آخر. تنسيق JSON قابل للقراءة آليًا وغير عملي لمعظم المستخدمين.
            label: تصدير JSON
          export_list_view_csv:
            explanation: يمكن للمستخدم إنشاء تصدير ملف CSV من صفحة قائمة طلبات التتبع التي تحتوي على نفس الحقول التي تظهر لهذا المستخدم في قائمة طلبات التتبع. يتم إجراؤه فقط من صفحة قائمة طلبات التتبع.
            label: تصدير ملف عرض قائمة csv
          export_pdf:
            explanation: يمكن للمستخدم إنشاء ملف تصدير PDF من قائمة طلبات التتبع أو عرض صفحات طلب التتبع ، والتي تحتوي على جميع الحقول التي يمكن للمستخدم الحالي الوصول إليها ، لسجل واحد أو متعدد أو جميع السجلات التي يمتلك المستخدم حق الوصول إليها. في ملف تصدير PDF ، يتم سرد المعلومات أولاً حسب الحالة ، ثم يتم تنظيمها بشكل أكبر حسب النموذج الذي تظهر عليه المعلومات.
            label: تصدير ملف إلى PDF
          export_xls:
            explanation: 'يمكن للمستخدم إنشاء تصدير ملف XLS من قائمة طلبات التتبع أو صفحات عرض طلب التتبع ، والتي تحتوي على جميع الحقول التي يمتلك المستخدم الحالي حق الوصول إليها ، لطلبات تتبع واحدة أو متعددة أو جميعها التي يمتلك المستخدم حق الوصول إليها. في هذا التصدير ، يتم تمثيل كل نموذج في علامة التبويب الخاصة به داخل ملف XLS. ملاحظة: يعرض تنسيق XLS الأحرف غير اللاتينية (مثل العربية والبنغالية) بتنسيق قابل للقراءة ، بينما لا يعرض تنسيق CSV.'
            label: تصدير ملف Excel (ملف XLS)
          flag:
            explanation: القدرة على إضافة علامة لطلب تتبع. يمكن للمستخدمين الذين لديهم هذا الإذن أيضًا إزالة العلامات التي قاموا بإضافتها إلى طلب التتبع.
            label: علامة
          resolve_any_flag:
            explanation: يسمح للمستخدم بحل أي علامة على السجل، بغض النظر عمن قام بإنشاء العلامة.
            label: حل اي علامة
          flag_update:
            explanation: ' يتيح للمستخدم تحديث أي علامة على السجل، بغض النظر عن المستخدم الذي قام بإنشاء تلك العلامة.'
            label: تحديث العلامة
          import:
            explanation: يسمح للمستخدم بإنشاء حالة جديدة أو أكثر من خلال استيرادها من ملف CSV أو Excel أو JSON. يجب أن يكون الملف الذي تم استيراده بتنسيق * جدا * بشكل خاص حتى يتم استيراد المعلومات بشكل صحيح. يجب أن تكون هذه الوظيفة متاحة فقط للمستخدمين الإداريين ذوي المهارات التقنية المتقدمة والمعرفة المتعمقة بكيفية تنسيق البيانات في Primero. نفذت فقط من صفحة قائمة الحالة.
            label: استيراد
          manage:
            explanation: يسمح للمستخدم بتنفيذ جميع الإجراءات المتاحة على طلبات التتبع. إذن "الإدارة" يعني أساسًا "كل شيء".
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
          read:
            explanation: القدرة على عرض طلب التعقب. يجب أن تتمتع الأدوار التي لها القدرة على رؤية طلبات التتبع أيضًا بالقدرة على رؤية نوع سجل المطابقة المحتملة.
            label: عرض
          write:
            explanation: القدرة على النقر فوق الزر "تحرير" ، وتحديث المعلومات حول طلب التتبع ، والنقر فوق "حفظ". كما يسمح للمستخدم بتعطيل أو تمكين طلب التتبع
            label: تعديل
        explanation: يمثل فردًا يحاول تحديد مكانه وجمع شمله في حالة غير مصحوب أو منفصل.
        label: طلب التتبع
      transfer:
        actions:
          transfer:
            explanation: هذا يعني أن الدور سيظهر كخيار لـ "نوع المستلم" عندما يقوم المستخدم بإحالة خارجية. إذا اختار المستخدم هذا الدور كنوع النقل، فإن التصدير الذي ينشئه Primero عندما يرسل المستخدم النقل سيحتوي فقط على المعلومات الموجودة في النماذج التي يمكن لهذا الدور الوصول إليها. لذلك ، على سبيل المثال ، إذا اختار المستخدم "مزود الخدمة الطبية" كنوع المستلم ، وكان دور مقدم الخدمة الطبية لديه حق الوصول فقط إلى نماذج الهوية الأساسية ومخاوف الحماية ، فإن ملف التصدير الذي يصدره النظام للنقل الخارجي سيكون فقط تحتوي على الحقول الموجودة في هذين الشكلين.
            label: هل يمكن استخدام هذا الدور لإجراء عمليات نقل خارجية؟
        label: نقل حالة
      user:
        actions:
          agency_read:
            explanation: القدرة على رؤية حسابات المستخدمين هذه فقط في وكالة المستخدم الحالية. يؤثر هذا أيضًا على حسابات المستخدمين التي يمكن للمستخدم الحالي تنفيذ إجراءات أخرى عليها. على سبيل المثال ، إذا كان المستخدم الحالي لديه إذن "كتابة" على المستخدمين ، ولكن لديه أيضًا إذن قراءة الوكالة ، فسيكون قادرًا فقط على تعديل حسابات المستخدمين الموجودة في وكالتهم الخاصة. وبالمثل ، إذا كان المستخدم الحالي لديه إذن "إدارة" للمستخدمين ، ولكن لديه إذن "قراءة الوكالة" ، فسيكون قادرًا فقط على إنشاء مستخدمين لوكالتهم الخاصة.
            label: عرض (من خلاال المؤسسة)
          create:
            explanation: القدرة على إنشاء حساب مستخدم
            label: 'إنشاء '
          disable_multiple:
            explanation: ' تعطيل عدة مستخدمين من قائمة المستخدمين. لن يتمكّن المستخدمون المعطَّلون من الوصول إلى النظام بعد الآن.'
            label: ' تعطيل عدة مستخدمين'
          manage:
            explanation: 'يسمح للمستخدم بتنفيذ جميع الإجراءات المتاحة على المستخدمين. إذن "الإدارة" يعني أساسًا "كل شيء". هام: يمنح هذا أيضًا القدرة على إنشاء حسابات مستخدمين جديدة.'
            label: إدارة (كافة الأذونات لنوع المورد هذا)
          read:
            explanation: القدرة على رؤية حسابات المستخدمين. بشكل افتراضي ، كل مستخدم لديه القدرة على رؤية وتحرير المعلومات المتعلقة بحساب المستخدم الخاص به (مثل كلمة المرور والبريد الإلكتروني).
            label: عرض
          send_email_multiple:
            explanation: تتيح هذه الخاصية تحديد عدة مستخدمين من قائمة المستخدمين وإرسال بريد إلكتروني إليهم يتضمن رسالة مخصصة.
            label: إرسال بريد إلكتروني إلى عدة مستخدمين
          write:
            explanation: القدرة على النقر فوق الزر "تحرير" في صفحة إظهار المستخدم ، وتحديث المعلومات حول المستخدم ، ثم الحفظ. يرجى ملاحظة أن هذا الإذن يمنحك أيضًا القدرة على تعطيل حسابات المستخدمين.
            label: تعديل
        explanation: يمثل حساب مستخدم فردي.
        label: مستخدمين
      user_group:
        actions:
          assign:
            explanation: القدرة على اختيار مجموعات المستخدمين عند إنشاء حساب مستخدم أو تحريره. يرجى ملاحظة أنه إذا كان لدى المستخدم الحالي مستوى الوصول "فقط السجلات أو المستخدمين في مجموعتي" ، فسيكون قادرًا فقط على تحديد واحدة أو أكثر من مجموعات المستخدمين * الخاصة بهم * لحساب المستخدم الذي يقومون بإنشائه أو تحريره. هذا يعني أن المدير الذي لديه القدرة على تعيين مجموعات مستخدمين سيكون قادرًا فقط على إضافة مستخدم إلى مجموعات المستخدمين التي ينتمي إليها المدير حاليًا. هذا الإذن ضروري لأي دور يقوم بإنشاء أو تحرير حسابات المستخدمين.
            label: تعيين
          create:
            explanation: القدرة على انشاء مجموعة مستخدمين.
            label: 'إنشاء '
          delete:
            explanation: القدرة على حذف مجموعة مستخدمين.
            label: حذف
          manage:
            explanation: 'يسمح للمستخدم بتنفيذ جميع الإجراءات المتاحة على مجموعات المستخدمين. إذن "الإدارة" يعني أساسًا "كل شيء". هام: يمنح هذا أيضًا القدرة على إنشاء مجموعات مستخدمين وحذفها.'
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
          read:
            explanation: القدرة على رؤية مجموعات المستخدمين.
            label: عرض
          write:
            explanation: القدرة على تعديل مجموعات المستخدمين.
            label: تعديل
        explanation: يمثل فريقًا أو مجموعة متعاونة من المستخدمين الذين يمكنهم مشاركة المعلومات. يمكن للمديرين عادةً رؤية جميع السجلات التي يديرها الأخصائيون الاجتماعيون في مجموعات المستخدمين الخاصة بهم.
        label: مجموعات المستخدمين
      webhook:
        actions:
          read:
            label: عرض
            explanation: القدرة على سرد ومراجعة تكوينات webhook عبر واجهة برمجة التطبيقات
          write:
            label: تعديل
            explanation: القدرة على إنشاء وتعديل تهيئة الرد التلقائي على الويب عبر واجهة برمجة التطبيقات
          create:
            explanation: القدرة على إنشاء تكوين webhook عبر واجهة برمجة التطبيقات.
            label: انشاء
          delete:
            explanation: القدرة على حذف تكوين webhook عبر API.
            label: حذف
          manage:
            label: إدارة (كل الأذونات لهذا النوع من الموارد)
            explanation: يُستخدم لأدوار النظام التي تصل إلى Primero Webhooks للأنظمة الأخرى. لا ينصح باستخدامه لغير المطورين.
      activity_log:
        actions:
          transfer:
            explanation: يمكن للمستخدم النقر فوق قسم سجل النشاطات في لوحة ملخص البيانات (داشبورد) والاطلاع على سجل بجميع عمليات النقل المقبولة أو المرفوضة للحالات التي يمكنهم الوصول إليها.
            label: عمليات النقل
          manage:
            label: إدارة (كل الأذونات لهذا النوع من الموارد)
            explanation: القدرة على الوصول للكل.
        label: سجل النشاطات
      usage_report:
        actions:
