            explanation: يمكن للمستخدم الاطلاع على سجل بجميع عمليات الوصول إلى السجل (عرض أو تحديث) التي أجراها مستخدمون آخرون غير المالك الحالي للحالة، وذلك منذ تاريخ إنشاء السجل.
            label: سجل الوصول
          create:
            explanation: القدرة على إنشاء سجل التسجيل.
            label: انشاء
          enable_disable_record:
            explanation: القدرة على تعطيل أو تمكين سجل التسجيل. لا تظهر السجلات "المعطلة" بشكل افتراضي في قائمة التسجيل. يمكن للمستخدمين رؤية سجلات التسجيل المعطلة في قائمة التسجيل باستخدام عامل تصفية.
