        label: تشابه محتمل
      primero_configuration:
        actions:
          manage:
            explanation: القدرة على حفظ التكوينات وتطبيقها وإرسالها. عادة ما يكون هذا الإذن محجوزًا لمسؤول النظام.
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
        label: التكوين
      referral:
        actions:
          refer:
            explanation: هذا يعني أن الدور سيظهر كخيار لـ "نوع المستلم" عندما يقوم المستخدم بإحالة خارجية. إذا اختار المستخدم هذا الدور كنوع الإحالة ، فإن التصدير الذي ينشئه Primero عندما يرسل المستخدم الإحالة سيحتوي فقط على المعلومات الموجودة في النماذج التي يمكن لهذا الدور الوصول إليها. لذلك ، على سبيل المثال ، إذا اختار المستخدم "مزود الخدمة الطبية" كنوع المستلم ، وكان دور مقدم الخدمة الطبية لديه حق الوصول فقط إلى نماذج الهوية الأساسية ومخاوف الحماية ، فإن ملف التصدير الذي يصدره Primero للإحالة الخارجية سيكون فقط تحتوي على الحقول الموجودة في هذين الشكلين.
            label: هل يمكن استخدام هذا الدور للإحالات الخارجية؟
        label: إحالة
      registry_record:
        actions:
          change_log:
            explanation: يمكن للمستخدم رؤية تاريخ التغييرات التي تم إجراؤها على السجل منذ إنشائه. يتضمن هذا القيم المسجلة لجميع الحقول.
