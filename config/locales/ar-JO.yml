          cases_workflow_report:
            label: سير العمل (حالات)
            explanation: القدرة على عرض الإحصائيات حول حالات حالة سير العمل. يسمح هذا الإذن أيضًا للمستخدم بتصدير البيانات من الرؤى.
          violence_type_report:
            label: نوع العنف (حالات وحوادث)
            explanation: القدرة على عرض إحصائيات عن نوع العنف. يسمح هذا الإذن أيضًا للمستخدم بتصدير البيانات من الرؤى.
          referrals_transfers_report:
            label: الإحالات و النقل (حالات)
            explanation: يرى المستخدمون عدد الحالات التي تم إحالتها ونقلها من كل مجموعة مستخدمين إلى كل مجموعة مستخدمين أخرى.
