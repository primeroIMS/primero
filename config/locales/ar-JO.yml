      matching_configuration:
        actions:
          manage:
            explanation: القدرة على التحكم في الحقول التي تتم مقارنتها للعثور على التطابقات بين طلب التتبع والحالات. نظرًا لأن هذا يتحكم في كيفية تشغيل المطابقة في النظام بأكمله ، يجب أن يكون هذا الإذن متاحًا بشكل عام فقط لمسؤول النظام.
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
        explanation: يتحكم في الحقول المستخدمة لمقارنة طلبات التتبع بالحالات أثناء تتبع الأسرة ولم شملها.
        label: تكوين المطابقة
      metadata:
        actions:
          manage_restricted:
            label: إدارة (صلاحيات مقيّدة)
            explanation: صلاحيات محدودة لإعادة تسمية النماذج وحقولها والقوائم المرجعية، وإعادة ترتيبها أو إخفائها.
          manage:
            explanation: إمكانية إنشاء النماذج وحقولها والقوائم المرجعية وتعديلها وترجمتها.
            label: إدارة (كافة الأذونات لهذا النوع من الموارد)
        explanation: يتحكم في القدرة على تكوين نماذج وحقول النظام، بالإضافة إلى خيارات البحث المستخدمة داخلها.
        label: النماذج، القوائم المرجعية
      module:
        actions:
          cp:
            label: CP
          gbv:
            label: GBV
          mrm:
            label: MRM
        explanation: عناصر التحكم في الوحدات النمطية التي ينطبق عليها هذا الدور
        label: الوحدات النمطية
      potential_match:
        actions:
          read:
            explanation: يمثل الرابط بين طلب التعقب والحالة. يعد الوصول إلى التطابقات المحتملة أمرًا ضروريًا لأعمال تتبع الأسرة ولم شملها (FTR). يسمح للمستخدم بمشاهدة نموذج ملخص التتبع في الحالات.
            label: عرض
          view_audio:
            explanation: يتحكم في ما إذا كان المستخدم الذي يبحث عن تطابق تتبع يمكنه رؤية الملفات الصوتية للحالة أو طلب التتبع المرتبط بالمطابقة المحتملة.
            label: عرض الملف الصوتي
          view_photo:
            explanation: يتحكم في ما إذا كان المستخدم الذي يبحث عن تطابق تتبع يمكنه رؤية الصور الخاصة بالحالة أو طلب التتبع المرتبط بالمطابقة المحتملة.
            label: عرض الصور
          manage:
            explanation: يسمح للمستخدم بتنفيذ جميع الإجراءات المتاحة على المطابقات المحتملة. إذن "الإدارة" يعني أساسًا "كل شيء".
