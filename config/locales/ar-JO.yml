            label: نتائج الحماية
            explanation: نتائج الحماية التي تم تطويرها في الأصل لوحدة إدارة حالات الحماية PCM. تشمل نسبة الحالات الذين يظهرون تحسنًا في الرفاه النفسي الاجتماعي ونسبة % الذين أفادوا بتأثر أقل بمخاطر الحماية.
          process_quality_total_cases:
            label: 'العملية والجودة - %  إجمالي المستفيدين من إدارة حالات الحماية'
            explanation: ينطبق فقط على وحدة إدارة حالات الحماية (PCM). يعرض العدد الإجمالي للحالات التي تخضع لإدارة حالات الحماية.
          process_quality_average_cases:
            label: 'العملية والجودة - المتوسط العام لعدد الحالات لكل منسق حالة'
            explanation: ينطبق فقط على وحدة إدارة حالات الحماية (PCM). يعرض المتوسط العام لعدد حالات PCM لكل أخصائي إدارة حالات.
          process_quality_successful_referrals:
            label: 'العملية والجودة - نسبة % الإحالات الناجحة'
            explanation: ينطبق فقط على وحدة إدارة حالات الحماية (PCM). يعرض نسبة الإحالات إلى الخدمات التي تم تنفيذها بنجاح.
          process_quality_implemented_referrals:
            label: العملية والجودة - الإحالات الناجحة حسب تاريخ التنفيذ
            explanation: ينطبق فقط على وحدة إدارة حالات الحماية (PCM). يعرض عدد الإحالات الناجحة إلى الخدمات التي تم تنفيذها في كل شهر.
          case_characteristics:
            label: 'خصائص الحالة'
            explanation: 'ينطبق فقط على وحدة إدارة حالات الحماية (PCM). يفصل الحالات حسب عدد من الخصائص الرئيسية: مخاطر الحماية، مستوى الخطورة، المدة، حالة الإعاقة، استكمال خطة الأمان، والجنس.'
