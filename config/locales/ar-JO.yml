            explanation: يتتبع مؤشرات الأداء الرئيسية لإدارة حالات حماية الطفل، بما في ذلك نسبة الإحالات المقدمة من مختلف الجهات المعنية، وموقع الإبلاغ والجنس للحالات المتعلقة بمخاطر الحماية المحددة، ونسبة الحالات حسب سبب الإغلاق.
          case_management_kpis_service_referrals_report:
