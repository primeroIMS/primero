      reporting_site: "موقع الإبلاغ"
      helptext: |
        يحسب هذا المؤشر عدد الحالات الجديدة التي يتم فتحها كل شهر لكل موقع من مواقع التقارير.
        يُفهم موقع التقارير على أنه الموقع الذي تقدم فيه منظمة المستخدم الخدمات
         حيث تم الإبلاغ عن الحالة إلى مقدم الخدمة
    number_of_incidents:
      title: "2. عدد الحوادث المسجلة"
      reporting_site: "موقع الإبلاغ"
      helptext: |
        يحسب هذا المؤشر عدد الحالات الجديدة التي يتم فتحها كل شهر لكل موقع من مواقع التقارير.
        يُفهم موقع التقارير على أنه الموقع الذي تقدم فيه منظمة المستخدم الخدمات
         حيث تم الإبلاغ عن الحالة إلى مقدم الخدمة
    reporting_delay:
      title: "3. الإبلاغ عن التأخير"
      delay: "تأخير"
      total_incidents: "إجمالي الحوادث"
      helptext: |
        يحسب هذا المؤشر ويصنف عدد الأيام التي انقضت بين وقت
        تعرضت الناجية للعنف المبني على النوع الاجتماعي وعندما أبلغت الناجية بذلك لأول مرة لمقدم الخدمة . أنه تم حسابها بناءً على وقت إبلاغ منظمة المستخدم بالحادثة. البيانات مصنفة على أساس فترات زمنية مختلفة (0-3 أيام ؛ 4-5 أيام ؛ 6-14 يومًا ؛ 15-30 يومًا ؛ اكتر شهر واحد أكثر من 3 أشهر)
    service_access_delay:
      title: "تأخير الوصول إلى الخدمة"
      delay: "تأخير"
      total_incidents: "إجمالي الحوادث"
    assessment_status:
      title: "4. حالة التقييم"
      completed: "مكتمل"
      completed_supervisor_approved: " مكتمل وتمت الموافقة عليها من قبل المشرف"
      helptext: |
        يحسب هذا المؤشر نسبة الحالات النشطة التي تم إنشاء نموذج تقييم لها
        منجز. يعتبر التقييم مكتملاً حيث توجد مجموعة من الحقول الإلزامية داخل
        استكمال استمارة تقييم الناجين.
    completed_case_safety_plans:
      title: "5. اكتملت خطط سلامة الحالة"
      completed: "5. اكتملت خطط سلامة الحالة"
      helptext: |
        يحسب هذا المؤشر نسبة الحالات النشطة التي تم وضع خطة أمان لها في الاعتبار
        ضرورية ومكتملة (مثل عنف الشريك الحميم ، خطر الانتحار / القتل ، حماية الطفل)
        تعتبر خطة السلامة مكتملة حيث توجد مجموعة من الحقول الإلزامية ضمن خطة الأمان
        اكتمل النموذج.
    completed_case_action_plans:
      title: "6.  اكتملت خطط عمل الحالة"
      completed: "6.  اكتملت خطط عمل الحالة"
      label: "6.  اكتملت خطط عمل الحالة"
      helptext: |
        يحسب هذا المؤشر نسبة الحالات النشطة التي تم وضع خطة عمل حالة لها
        منجز. تعتبر خطة عمل الحالة مكتملة حيث توجد مجموعة من الحقول الإلزامية بداخلها
        استيفاء نموذج خطة العمل
    completed_supervisor_approved_case_action_plans:
      title: "7. الموافقة على خطط عمل الحالة من قبل المشرف"
      completed_and_approved: "تمت الموافقة على خطط إجراءات الحالة المكتملة من قبل المشرف"
      helptext: |
        يحسب هذا المؤشر نسبة الحالات النشطة التي تم وضع خطة عمل حالة لها
        تم إكمالها واعتمادها من قبل المشرف. تعتبر خطة عمل الحالة مكتملة عندما أ
        تم إكمال مجموعة الحقول الإلزامية في نموذج خطة العمل. تعتبر خطة الحالة
        تمت المصادقة عليها عندما يطلب أخصائي الحالة المصادقة على خطة الحالة والمشرف
        يصادق على خطة الحالة على المنصة.
    services_provided:
      title: "8. الخدمات المقدمة"
      service: "خدمة"
      count: "مرات المقدمة"
      male: "ذكر"
      female: "أنثى"
      0-11: "0-11"
      12-17: "12-17"
      '>18': ">18"
      disability: "اعاقة "
      no_disability: "لا وجود لاعاقة"
      helptext: |+
        يحسب هذا المؤشر نوع الخدمة (الخدمات) المقدمة للناجين في إدارة الحالة
        معالجة. من خلال الخدمة المقدمة ، فإننا نعني الخدمة التي تقدمها منظمة المستخدم
        داخليًا ، وليست خدمة مقدمة عن طريق الإحالات إلى خدمات أخرى أو إحالات داخلية

    average_referrals:
      title: "9. متوسط الإحالات"
      label: "متوسط الإحالات لكل حالة"
      helptext: "يحسب هذا المؤشر متوسط عدد الإحالات لكل حالة مسجلة (لجميع الأنواع \nمن الخدمات) في جميع الحالات ، سواء كانت الحالة نشطة / مفتوحة أو مغلقة. يتضمن الإحالات \nالمسجلة في علامة تبويب الحالة ، وليس فقط الإحالات التي تتم من خلال النظام الأساسي \n \n"
    referrals_per_service:
      title: "الإحالات لكل خدمة"
    average_followup_meetings_per_case:
      title: "10. متوسط اجتماعات المتابعة لكل حالة"
      label: "متوسط اجتماعات المتابعة لكل حالة"
      helptext: |
        يحسب هذا المؤشر متوسط عدد اجتماعات المتابعة التي أجريت لكل حالة نشطة
        لكل منسق على المنصة. اجتماع المتابعة هو اجتماع بين منسق الحالة و
        الحالة بعد المقابلة / الإفصاح الأولي.
    time_from_case_open_to_close:
      title: "11. الوقت المستغرق من فتح الحالة إلى حالة إغلاقها\n "
      time: "وقت"
      percent: "نسبة الحالات"
      helptext: |
        يقيس هذا المؤشر المدة التي تظل فيها القضايا مفتوحة ، ومدة إدارة الحالة
        تأخذ العملية من التقرير الأولي إلى منظمة المستخدم لإغلاق الحالة. طول الوقت
        مقسمة حسب الإطار الزمني التالي: أقل من شهر واحد ؛ بين 1 و 3 أشهر ؛ ما بين
        3-6 أشهر أكثر من 6 أشهر.
    case_closure_rate:
      title: "12. عدد إغلاق القضية"
      reporting_site: "موقع الإبلاغ"
      helptext: |
        يقيس هذا المؤشر عدد الحالات التي تم إغلاقها شهريًا لكل موقع إبلاغ. موقع التقارير
        يُفهم على أنه الموقع الذي تقدم فيه منظمة المستخدم الخدمات وحيث
        تم الإبلاغ عن الحادث لمزود الخدمة.
    client_satisfaction_rate:
      title: "13. معدل رضا العميل"
      label: "رضا العملاء"
      invalid: "لا يمكننا حساب هذا في الوقت الحالي."
      helptext: |
        يقيس هذا المؤشر النسبة المئوية للناجين الذين أكملوا استبيان آراء العملاء
        الذين يشعرون بالرضا عن خدمات إدارة الحالة المقدمة لهم. هذا المؤشر
        من خلال استكمال نموذج ملاحظات العميل على GBVIMS + من قبل موظف آخر
        من منسق الحالة الذي قدم الخدمة للناجي.
    supervisor_to_caseworker_ratio:
      title: "14. عدد منسقي الحالات لكلّ مشرف."
      label: "عدد منسقي الحالة لكلّ مشرف"
      helptext: |
        هذا المؤشر هو عدد منسقي الحالة الذين يشرف عليهم المشرف: المشرف على الحالة
        نسبة العاملين. يعتمد هذا الحساب على أدوار النظام المخصصة على النظام الأساسي.
    case_load:
      title: "15. تحميل القضايا"
      case_load: "تحميل الحالات"
      percent: "النسبة المئوية لمنسقي الحالة مع عبء القضايا"
      10cases: "اقل من 10 حالات"
      20cases: "11 - 20 حالة"
      21-30cases: "21 - 30 حالة"
      30cases: "اكثر من 30 حالة"
      helptext: |
        يقيس هذا المؤشر متوسط عدد الحالات لكل أخصائي حالة تم تمكينه بناءً على الحالات النشطة.
        يتم تقسيم نسبة الحالات إلى العاملين في الحالة بناءً على التقسيم التالي: أقل من 10
        الحالات المفتوحة ، ما بين 10-20 قضية مفتوحة ، ما بين 21-30 قضية مفتوحة ، أكثر من 30 قضية مفتوحة
