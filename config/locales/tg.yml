            label: Дидан
          write:
            explanation: Қобилияти зер кардани тугмаи "Таҳрир", навсозии маълумот дар бораи дархости ҷустуҷӯ ва зер кардани "Захира кардан". Инчунин ба корбар имкон медиҳад, ки дархости ҷустуҷӯро ғайрифаъол ё фаъол созад.
            label: ' Таҳрир кардан'
        explanation: Шахсеро ифода мекунад, ки кӯшиш мекунад як Парвандаи ҳамроҳинадошта ё ҷудошударо ёбад ва бо ӯ дубора муттаҳид шавад.
        label: Дархости ҷустуҷӯ
      transfer:
        actions:
          transfer:
            explanation: Ин маънои онро дорад, ки нақш ҳамчун имконот барои "Навъи қабулкунанда" ҳангоми иҷрои муроҷиати берунӣ аз ҷониби корбар пайдо мешавад. Агар корбар ин нақшро ҳамчун навъи интиқол интихоб кунад, содироте, ки Primero ҳангоми фиристодани интиқол аз ҷониби корбар эҷод мекунад, танҳо маълумотеро дар бар мегирад, ки дар шаклҳое мавҷуд аст, ки ин нақш ба онҳо дастрасӣ дорад. Масалан, агар корбар "Провайдери хидмати тиббӣ"-ро ҳамчун навъи қабулкунанда интихоб кунад ва нақши Провайдери хидмати тиббӣ танҳо ба шаклҳои "Шахсияти асосӣ" ва "Нигарониҳои ҳифзӣ" дастрасӣ дошта бошад, файли содирот, ки Primero барои интиқоли берунӣ содир мекунад, танҳо майдонҳоеро дар бар мегирад, ки дар ин ду шакл ҳастанд.
