            label: Дидан
          send_email_multiple:
            explanation: ' Имкон медиҳад, ки аз рӯйхати корбарон якчанд корбарро интихоб намуда, ба онҳо паёми электронӣ бо матни фармоишӣ ирсол кунед.'
