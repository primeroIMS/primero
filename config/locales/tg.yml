            explanation: Ба корбар имкон медиҳад, ки сабтҳоеро ҷустуҷӯ намояд, ки одатан ба онҳо дастрасӣ надорад. Ин метавонад аз он сабаб бошад, ки ӯ соҳиби сабти парванда нест ё (барои роҳбарон) соҳиби сабт ба гурӯҳҳои корбарии онҳо дохил намешавад. Лутфан дар назар дошта бошед, ки гарчанде корбар парвандаро дар натиҷаҳои ҷустуҷӯ мебинад, ӯ наметавонад саҳифаи намоиши парвандаро боз кунад ва аз ин рӯ ба маълумоти муфассали парванда дастрасӣ нахоҳад дошт.
