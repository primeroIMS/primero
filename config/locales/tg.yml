        actions:
          read:
            explanation: ' Ба корбар имкон медиҳад, ки рӯйхати ҳамаи амалҳои дар низом иҷрошударо бинад ва филтр намояд. Ин рӯйхат аз рӯи корбар, навъи амал, рақами мушаххаси сабт ва вақти иҷрои амал гурӯҳбандӣ карда мешавад. Ин иҷозат бештар барои маъмурони сатҳи миллӣ ё сатҳи ташкилот мувофиқ аст, зеро амалҳои анҷомдодаи ҳамаи корбарони системаро нишон медиҳад. Лутфан дар назар дошта бошед, ки сабти аудиторӣ маълумоти шахсияти муайянкунандаи шахсро оид ба сабтҳои марбут ба ҳар як амал намоиш намедиҳад.'
            label: Дидан
        explanation: Рӯйхати филтршавандаи ҳамаи амалҳои дар низом иҷрошуда. Маълумоти муайянкунандаи шахсиятро оид ба парвандаҳо, ҳодисаҳо ё дархостҳои пайгирӣ намоиш намедиҳад.
        label: ' Сабтҳои аудиторӣ'
      case:
        actions:
          add_note:
            explanation: Б Ба корбар имкон медиҳад, ки ба зер-шакли «Қайдҳо» (ки баъзан «Шарҳҳо») низ номида мешавад, сабти нав илова намояд. Корбар ин амалро тавассути пахш кардани тугмаи «Иловаи қайд» дар саҳифаи намоиши парванда анҷом медиҳад. Ин имконият махсусан барои роҳбароне муфид аст, ки ҳуқуқи таҳрири парвандаҳоро надоранд, аммо мехоҳанд барои корманди масъули парванда ёддошт ё хотиррасонӣ гузоранд. Аз ин ҷиҳат, илова кардани қайд ба гузоштани аломат монанд аст. Бартарии илова кардани қайд дар он аст, ки вақте роҳбар ба парванда қайд илова мекунад, барои корманди масъули парванда ҳангоми дидани парванда дар дастгоҳи мобилӣ огоҳинома намоиш дода мешавад.
            label: Илова кардани қайдҳо ба парванда
          add_registry_record:
            explanation: Ба корбар имкон медиҳад, ки аз шакли тафсилоти феҳрист феҳристро ба парванда пайваст намояд. Инчунин ба корбар иҷозат медиҳад, ки пайвастагии ҳар гуна феҳристеро, ки қаблан ба парванда вобаста карда шудааст, бекор намояд.
            label: ' Илова ё навсозии сабти феҳрист аз парванда'
          approve_action_plan:
            explanation: ' Ба роҳбар имкон медиҳад, ки %{approval_label}ро барои парвандаҳои кормандони масъули парванда тасдиқ намояд.'
            label: Тасдиқ кардан %{approval_label}
          approve_assessment:
            explanation: ' Ба роҳбар имкон медиҳад, ки %{approval_label}ро барои парвандаҳои кормандони масъули парванда тасдиқ намояд.'
            label: ' Тасдиқ кардан %{approval_label}шакл'
          approve_bia:
            explanation: ' Ба роҳбар имкон медиҳад, ки %{approval_label}ро барои парвандаҳои кормандони масъули парванда тасдиқ намояд.'
            label: ' Тасдиқ кардан %{approval_label}шакл'
          approve_case_plan:
            explanation: ' Ба роҳбар имкон медиҳад, ки %{approval_label}ро барои парвандаҳои кормандони масъули парванда тасдиқ намояд.'
            label: Тасдиқ кардан %{approval_label}
          approve_closure:
            explanation: ' Ба роҳбар имкон медиҳад, ки %{approval_label}ро барои парвандаҳои кормандони масъули парванда тасдиқ намояд.'
            label: ' Тасдиқ кардан %{approval_label}шакл'
          approve_gbv_closure:
            explanation: ' Ба роҳбар имкон медиҳад, ки %{approval_label}ро барои парвандаҳои кормандони масъули парванда тасдиқ намояд.'
            label: ' Тасдиқ кардан %{approval_label}шакл'
          self_approve:
            explanation: ' Бо нобаёнӣ, корбарон наметавонанд парвандаҳои худро тасдиқ намоянд. Бо доштани ин иҷозат, корбар метавонад ҳар парвандаеро, ки ба он дастрасӣ дорад, тасдиқ кунад, ҳатто агар худи ӯ соҳиби сабт бошад.'
            label: Тасдиқ кардани парвандаҳои худ
          assign:
            explanation: Ба корбар имкон медиҳад, ки парвандаро аз соҳиби аслии сабт ба ҳар як корбари дигари низом аз нав вогузор намояд. Барои иҷрои ин амал розигии кӯдак талаб карда намешавад. Бар хилофи интиқолгиранда имкони қабул ё рад кардани ин вогузориро надорад.
            label: Вогузор кардан
          assign_within_agency:
            explanation: Ба корбар имкон медиҳад, ки парвандаро аз соҳиби аслии сабт ба ҳар як корбари дигари ташкилоти худ аз нав вогузор намояд. Барои иҷрои ин амал розигии кӯдак талаб карда намешавад. Бар хилофи интиқолгиранда имкони қабул ё рад кардани ин вогузориро надорад.
            label: ' Таъйин кардан ба корбар аз макомоти ман'
          assign_within_user_group:
            explanation: ' Ба корбар имкон медиҳад, ки парвандаро аз соҳиби аслии сабт ба ҳар як корбари дигари гурӯҳҳои корбарии худ аз нав вогузор намояд. Барои иҷрои ин амал розигии кӯдак талаб карда намешавад. Бар хилофи интиқолгиранда имкони қабул ё рад кардани ин вогузориро надорад.'
            label: ' Таъйин кардан ба корбар аз гурӯҳи корбарии ман'
          create_case_from_referral:
            label: ' Эҷод кардани парванда аз равонасози'
            explanation: ' Имконияти эҷоди парванда аз равонасози'
          change_log:
            explanation: Имконияти дидани таърихи пурраи тағйиротҳои сабт, аз ҷумла арзишҳои сабтшудаи ҳамаи майдонҳо.
            label: ' Сабти тағйирот'
          access_log:
            explanation: Имконияти дидани таърихи пурраи дастрасиҳо ба сабт аз ҷониби дигар корбарон (дидан ва навсозӣ) аз замони таъсиси сабт.
            label: ' Сабти дастрасиҳо'
          close:
            explanation: Имконияти тағйир додани мақоми парванда аз Кушода ба Баста.
            label: Махкам кардан
          consent_override:
            explanation: Имконияти анҷом додани роҳхат ё интиқоли парванда дар ҳолате, ки розигӣ пешниҳод нашудааст.
            label: ' Сарфи назар кардани набудани розигӣ ҳангоми равонасози ё интиқоли парванда'
          create:
            explanation: Қобилияти эҷод кардани парванда
            label: Эҷод кардан
          display_view_page:
            explanation: ' Агар корбар барои парвандае ҷустуҷӯ анҷом диҳад, ки ба он дастрасӣ надорад, ин иҷозат ба ӯ имкон медиҳад, ки равзанаи хурде-ро бо маълумоти асосӣ дар бораи парванда бубинад, ҳатто агар ӯ натавонад парвандаро кушода тамоми маълумоти онро дидан кунад. Майдонҳое, ки дар ин «равзанаи намоиш» нишон дода мешаванд, ҳамон майдонҳое мебошанд, ки барои намоиш дар «Шакли кӯтоҳ» танзим шудаанд. Ин равзана инчунин барои корбароне, ки амалҳои пайгирӣ ва муттаҳидсозии оиларо иҷро мекунанд, муфид аст, зеро онҳо метавонанд ҳангоми баррасии парвандаҳое, ки ҳамчун «Мувофиқати эҳтимолӣ»  барои дархости пайгирӣ нишон дода шудаанд, аз ин равзана истифода баранд.'
            label: ' Намоиши саҳифа'
          enable_disable_record:
            explanation: Имконияти ғайрифаъол ё фаъол кардани парванда. Парвандаҳои «ғайрифаъол» ба таври пешфарз дар рӯйхати парвандаҳо намоиш дода намешаванд. Корбарон метавонанд бо истифода аз филтр парвандаҳои ғайрифаъолро дар рӯйхати парвандаҳо бинанд. Азбаски Примеро ба корбарон иҷозати нест кардани парвандаҳоро намедиҳад, ғайрифаъол кардани парванда метавонад ҳамчун ҷойгузини несткунӣ истифода шавад. Масалан, агар корбар тасодуфан парвандаеро эҷод карда бошад ё маълумоти парванда нодуруст бошад, бояд он парвандаро ғайрифаъол намояд.
            label: Фаъол / Ғайрифаъол
          export_case_pdf:
            explanation: Корбар метавонад аз рӯйхати парвандаҳо ё саҳифаҳои намоиши парванда содироти файли PDF-ро эҷод кунад, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад — барои як, якчанд ё ҳамаи парвандаҳое, ки корбар ба онҳо дастрасӣ дорад. Дар файли содироти PDF, маълумот аввал аз рӯи парванда ва сипас аз рӯи шакле, ки маълумот дар он ҷойгир аст, тартиб дода мешавад.
            label: Содир кардани PDF-и парванда
          export_csv:
            explanation: 'Корбар метавонад аз рӯйхати парвандаҳо ё саҳифаи намоиши парванда файли содиротии CSV эҷод намояд, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад. Содирот метавонад барои як парванда, чанд парванда ё ҳамаи парвандаҳое, ки корбар ба онҳо дастрасӣ дорад, иҷро карда шавад. ЭЗОҲ: Содироти CSV ҳарфҳои ғайрилотинӣ (масалан, арабӣ ё бенгалӣ)-ро дар шакли хонданбоб дуруст намоиш намедиҳад.'
            label: Содир кардани CSV
          export_custom:
            explanation: ' Корбар метавонад аз рӯйхати парвандаҳо ё саҳифаи намоиши парванда файли содиротии XLS эҷод намояд, ки маҷмӯи фармоишии шаклҳо ё майдонҳоро дар бар мегирад. Содирот метавонад барои як парванда, чанд парванда ё ҳамаи парвандаҳое, ки корбар ба онҳо дастрасӣ дорад, анҷом дода шавад. Дар ин содирот ҳар як шакл дар ҷадвали алоҳидаи файли XLS ҷойгир карда мешавад. Корбар метавонад тавассути равзанаи «Содироти фармоишӣ» интихоб намояд, ки кадом шаклҳо ё майдонҳо ба содирот дохил карда шаванд. Лутфан дар назар дошта бошед, ки корбарон танҳо он шаклҳо ва майдонҳоро метавонанд ба содирот дохил намоянд, ки ҳангоми дидани парванда дар система аллакай ҳуқуқи дидани онҳоро доранд.'
            label: Содироти фармоишӣ
          export_duplicate_id_csv:
            explanation: Барои парвандаҳое, ки дорои як арзиши якхелаи майдони Рақами мушаххаскунандаи  миллӣ мебошанд, файли содиротии CSV эҷод мекунад. (Номи ин майдон вобаста ба танзимоти низом метавонад фарқ кунад.) Ин амал танҳо аз саҳифаи рӯйхати парвандаҳо иҷро карда мешавад.
            label: ' Содироти сабтҳои такрорӣ'
          export_json:
            explanation: ' Корбар метавонад аз рӯйхати парвандаҳо ё саҳифаи намоиши парванда файли содиротии JSON эҷод намояд, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад. Содирот метавонад барои як парванда, якчанд парванда ё ҳамаи парвандаҳое, ки корбар ба онҳо дастрасӣ дорад, анҷом дода шавад. Ин навъи содирот асосан барои онҳое пешбинӣ шудааст, ки мехоҳанд парвандаҳоро аз низоми ҷории Примеро содир намуда, баъдан онҳоро ба низоми дигари Примеро ё ба низоми дигари идоракунии иттилоот ворид намоянд. Формати JSON барои коркарди мошинӣ пешбинӣ шудааст ва барои аксари корбарон барои хондани мустақим чандон қулай нест.'
            label: Содир кардани JSON
          export_list_view_csv:
            explanation: Корбар метавонад аз саҳифаи рӯйхати парвандаҳо файли содиротии CSV эҷод намояд, ки ҳамон майдонҳоеро дар бар мегирад, ки барои ин корбар дар рӯйхати парвандаҳо намоиш дода мешаванд. Ин амал танҳо аз саҳифаи рӯйхати парвандаҳо иҷро карда мешавад.
            label: Содироти CSV-и намоиши рӯйхат
          export_pdf:
            explanation: Корбар метавонад аз рӯйхати парвандаҳо ё саҳифаҳои намоиши парванда содироти файли PDF-ро эҷод кунад, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад — барои як, якчанд ё ҳамаи парвандаҳое, ки корбар ба онҳо дастрасӣ дорад. Дар файли содироти PDF, маълумот аввал аз рӯи парванда ва сипас аз рӯи шакле, ки маълумот дар он ҷойгир аст, тартиб дода мешавад.
            label: Содир кардани PDF-и парванда
          export_photowall:
            explanation: Ба корбар имкон медиҳад, ки аз саҳифаи рӯйхати парвандаҳо файлеро содир намояд, ки аксҳои ҳамаи парвандаҳои интихобшударо дар бар мегирад. Ин навъи содирот асосан барои фаъолиятҳои пайгирӣ ва муттаҳидсозии оила истифода мешавад. Ин амал танҳо аз саҳифаи рӯйхати парвандаҳо иҷро карда мешавад.
            label: ' Содироти девори аксҳо'
          export_unhcr_csv:
            label: Содир кардани UNHCR CSV
            explanation: Кӯҳнашуда - Ин имконият дигар мавриди истифода қарор надорад.
          export_xls:
            explanation: 'Корбар метавонад аз рӯйхати парвандаҳо ё саҳифаи намоиши парванда файли содиротии XLS эҷод намояд, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад. Содирот метавонад барои як парванда, якчанд парванда ё ҳамаи парвандаҳое, ки корбар ба онҳо дастрасӣ дорад, анҷом дода шавад. Дар ин содирот ҳар як шакл дар ҷадвали алоҳидаи дохили файли XLS ҷойгир карда мешавад. ЭЗОҲ: Формати XLS ҳарфҳои ғайрилотинӣ (масалан, арабӣ ё бенгалӣ)-ро дар шакли хонданбоб дуруст намоиш медиҳад, дар ҳоле ки содироти CSV чунин имкониятро надорад.'
            label: Содироти Excel (файли XLS)
          find_tracing_match:
            explanation: Ин иҷозат танҳо дар ҳолатҳои марбут ба фаъолияти Пайгирӣ ва Муттаҳидсозии Оила истифода мешавад. Корбароне, ки ин иҷозатро доранд, дар саҳифаи намоиши парванда тугмаи «Дарёфти мувофиқати пайгирӣ»-ро мебинанд. Ҳангоми пахш кардани ин тугма, онҳо ба рӯйхати дархостҳои пайгирии мавҷуда дар низом равона мешаванд, ки метавонанд барои парвандаи онҳо ҳамчун «мувофиқатҳои эҳтимолӣ» бошанд.
            label: ' Дарёфти мутобиқати ҷустуҷӯ аз парванда'
          flag:
            explanation: ' Имконияти илова кардани нишонагузори ба парванда. Корбароне, ки ин иҷозатро доранд, инчунин метавонанд аломатҳоеро, ки худашон ба парванда илова кардаанд, хориҷ намоянд.'
            label: ' Нишонагузорӣ'
          flag_multiple:
            explanation: ' Имконияти илова кардани нишонагузори ба якчанд парванда аз рӯйхати парвандаҳо.'
            label: Нишонгузории якчанд парванда
          resolve_any_flag:
            explanation: Ба корбар имкон медиҳад, ки ҳар гуна нишонагузориро дар сабт ҳал кунад, новобаста аз он ки нишонагузориро кӣ эҷод кардааст.
            label: Бартараф кардани ҳар гуна нишонагузори
          flag_update:
            explanation: Ба корбар имкон медиҳад, ки ҳар гуна нишонагузориро дар сабт навсозӣ кунад, новобаста аз он ки нишонагузориро кӣ эҷод кардааст.
            label: Нишонагузориро навсозӣ кунед
          import:
            explanation: Ба корбар имкон медиҳад, ки бо ворид кардани парвандаҳо аз файли CSV, Excel ё JSON як ё якчанд парвандаи нав эҷод кунад. Файли воридшаванда бояд хеле мушаххас формат карда шавад, то ки маълумот дуруст ворид карда шавад. Ин функсия бояд танҳо барои корбарони маъмурӣ, ки малакаҳои пешрафтаи техникӣ ва дониши амиқи тарзи форматбандии маълумот дар Primero доранд, дастрас бошад. Танҳо аз саҳифаи рӯйхати парвандаҳо иҷро карда мешавад.
            label: Воридот
          incident_details_from_case:
            explanation: ' Имконияти илова кардани сабт ба зершакли «Тафсилоти ҳодиса» барои парвандае, ки дар натиҷаи ҷустуҷӯ пайдо шудааст, аммо корбар ба худи парванда дастрасӣ надорад. Корбар ин амалро аз саҳифаи натиҷаҳои ҷустуҷӯ анҷом медиҳад: як ё якчанд парвандаро интихоб карда, аз менюи амалҳо варианти «Иловаи ҳодиса»-ро интихоб менамояд. Пас аз он равзанае кушода мешавад, ки тамоми майдонҳои зер-шакли «Тафсилоти ҳодиса»-ро дар бар мегирад ва корбар метавонад маълумотро оид ба хизматрасонӣ ворид ва сабт намояд. Азбаски ин амал танҳо аз саҳифаи натиҷаҳои ҷустуҷӯ иҷрошаванда аст, доштани ин иҷозат танҳо дар сурате мантиқӣ мебошад, ки нақш инчунин иҷозати «Ҷустуҷӯи сабтҳои парвандаҳои тааллуқдошта ба корбарони дигар»-ро низ дошта бошад.'
            label: Илова кардани маълумоти ҳодиса ба парвандаи корбари дигар тавассути саҳифаи натиҷаҳои ҷустуҷӯ
          incident_from_case:
            explanation: ' Ин иҷозат ба корбар имкон медиҳад, ки тугмаи «Эҷоди ҳодиса»ро пахш намояд. Дар натиҷа ҳодисаи нав эҷод мешавад, ки метавонад баъзе маълумотро аз парванда нусхабардорӣ намояд. Барои парвандаҳои марбут ба зӯроварии гендерӣ, ин тугма дар қисми болоии саҳифаи намоиши парванда ҷойгир буда, ба маълумоти умумии парванда марбут аст. Дар баъзе ҳолатҳои пайгирии ҳодисаҳо, ин тугма дар зер-шакли «Тафсилоти ҳодиса» ҷойгир мешавад. Дар чунин ҳолат, маълумот метавонад ҳам аз зер-шакли «Тафсилоти ҳодиса», ки аз он ҷо тугма пахш шудааст, ва ҳам аз худи парванда нусхабардорӣ гардад. Масалан, ҳодисаи нави эҷодшуда метавонад майдони «Навъи зӯроварӣ»-ро аз зершакли тафсилоти ҳодиса ва ҳамчунин маълумотро дар бораи синну сол ва ҷинси парванда дар бар гирад. Ҳамчунин, ин иҷозат ба корбар имконият медиҳад, ки пайванди ҳодисаи эҷодшударо бубинад.'
            label: Эҷод кардани ҳодиса аз парванда
          remove_alert:
            explanation: Ин иҷозат ба корбар имкон медиҳад, ки огоҳиномаро аз парванда хориҷ намояд. Огоҳиномаҳо одатан ҳангоми тағйир додани майдони муайян, масалан ҳангоми навсозии қайдҳо, ба таври худкор эҷод мешаванд. Одатан огоҳинома бо нуқтаи зард дар назди парванда намоиш дода мешавад.
            label: ' Бартараф кардани огоҳинома аз парванда'
          manage:
            explanation: Ба корбар иҷозат медиҳад, ки ҳамаи амалҳои дастрасро нисбат ба парвандаҳо иҷро намояд. Иҷозати «Идоракунӣ» аслан маънои «дастрасии пурра ба ҳама амалҳо»-ро дорад.
            label: Идоракунӣ (ҳамаи иҷозатҳо барои ин навъи захира)
          read:
            explanation: Қобилияти дидани парванда
