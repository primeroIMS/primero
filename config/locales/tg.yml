          write:
            explanation: Имконияти пахш кардани тугмаи «Таҳрир»  дар саҳифаи намоиши нақш, навсозии иҷозатҳои нақш ва баъдан захира кардани тағйирот.
            label: Таҳрир кардан
        explanation: ' Муайян мекунад, ки корбар дар Примеро кадом амалҳоро иҷро карда метавонад.'
        label: Нақшхо
      system:
        actions:
          manage:
            explanation: ' Имконияти дидан ва навсозӣ кардани маълумот оид ба маълумоти тамосии низом, танзимоти асосии огоҳиномаҳо ва паёмҳои хушомадгӯӣ, инчунин серверҳои ҳамоҳангшуда. Ин иҷозат одатан танҳо барои маъмури низом пешбинӣ шудааст.'
            label: Идоракунӣ (ҳамаи иҷозатҳо барои ин навъи захира)
