          referral:
            explanation: Ба корбар имкон медиҳад, ки дастрасӣ ба парвандаро муваққатан ба корбари дигар диҳад. Гирандаи роҳхат метавонад нисбат ба парвандаи роҳхатшуда ҳамон амалҳоеро иҷро намояд, ки нисбат ба парвандаҳои худ иҷро карда метавонад. Вақте ки гиранда дигар ба парванда дастрасӣ ниёз надорад, ӯ метавонад тугмаи «Анҷом ёфт»-ро дар зер-шакли «Равонасозиҳо ва интиқолҳо» пахш намояд ва дастрасии ӯ ба парванда қатъ мегардад. Шумо метавонед танҳо ба корбароне роҳхат фиристед, ки нақши онҳо имконияти қабули равонасозиро дорад.
            label: Равонасози
          referral_from_service:
            explanation: ' Ба корбар имкон медиҳад, ки тугмаи «Равонасози»-ро дар зер-шакли «Хизматрасониҳо» бубинад. Вақте ки корбар ин тугмаро пахш мекунад, равзанаи роҳхат кушода мешавад. Дар ин равзана майдонҳои «Навъи хизматрасонӣ», «Ташкилот», «Пешниҳодкунандаи хизматрасонӣ» ва «Макон» ғайрифаъол хоҳанд буд, аммо ба таври худкор бо маълумоти аз ҳамон сабти зер-шакли «Хизматрасониҳо», ки дар он тугмаи «Равонасози» пахш шудааст, пур карда мешаванд'
            label: ' Ирсоли роҳхати парванда аз зер-шакли хизматрасониҳо'
          remove_assigned_users:
            explanation: Ба корбар имкон медиҳад, ки дигар корбаронро аз майдони «Дигар корбарони таъйиншуда» хориҷ намояд. Корбар дар ин рӯйхат ворид мешавад, агар барои парванда роҳхат ё интиқол гирифта бошад, вале онро ҳанӯз қабул ё рад накарда бошад. Ҳангоми хориҷ кардани корбар аз майдони «Дигар корбарони таъйиншуда», дастрасии ӯ ба парванда низ бекор карда мешавад. Аз ин рӯ, корбароне, ки ин иҷозатро доранд, метавонанд дастрасии он корбаронро ба парванда барҳам диҳанд, ки қаблан роҳхат гирифтаанд ё барои онҳо интиқоли ҳанӯз баррасинашуда мавҷуд аст. Лутфан дар назар дошта бошед, ки ин иҷозат танҳо дар ҳолате амал мекунад, ки корбари ҷорӣ инчунин ҳуқуқи таҳрири парвандаро дошта бошад.
            label: Хориҷ кардани дигар корбарони таъйиншуда (пас гирифтани дастрасӣ ба парванда аз корбарони роҳхатгирифта)
