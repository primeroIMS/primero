          dash_case_incident_overview:
            explanation: ' Барои роҳбар шумораи парвандаҳои идорашавандаи ҳар як аъзои даста, ки ба дигар корбарон ирсол ё интиқол шудаанд, намоиш дода мешавад.'
            label: Шарҳи умумӣ - Парвандаҳо / Ҳодисаҳои ман
          dash_cases_by_social_worker:
