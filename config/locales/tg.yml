      title: " 9. Шумораи миёнаи равонасозиҳо"
      label: "Шумораи миёнаи равонасозиҳо барои ҳар як ҳолат"
      helptext: " Ин нишондиҳанда шумораи миёнаи равонасозиҳоро барои ҳар як ҳолати ба қайд гирифташуда (барои ҳамаи намудҳои хизматрасониҳо) \nдар байни тамоми ҳолатҳо ҳисоб мекунад, новобаста аз он ки ҳолат фаъол/кушода аст ё баста шудааст. Ба ин нишондиҳанда равонасозиҳое дохил мешаванд, \nки дар ҷадвали ҳолат сабт шудаанд, на танҳо равонасозиҳое, ки тавассути платформа анҷом дода шудаанд.\n"
    referrals_per_service:
      title: "Равонасозиҳо тибқи намуди хизматрасонӣ"
    average_followup_meetings_per_case:
      title: "10. Шумораи миёнаи вохӯриҳои пайгирӣ барои ҳар як ҳолат"
      label: "Шумораи миёнаи вохӯриҳои пайгирӣ барои ҳар як ҳолат"
      helptext: "Ин нишондиҳанда шумораи миёнаи вохӯриҳои пайгириро, ки барои ҳар як ҳолати фаъол \nаз ҷониби ҳар як корманди масъули ҳолат дар платформа баргузор шудаанд, ҳисоб мекунад. Вохӯрии пайгирӣ вохӯрие мебошад, ки байни корманди масъули ҳолат ва \nнаҷотёфта пас аз мусоҳибаи ибтидоӣ ё ошкор намудани ҳодиса баргузор мегардад.\n"
    time_from_case_open_to_close:
      title: "11. Давомнокии вақт аз кушодани ҳолат то бастани ҳолат"
      time: "Вақт "
      percent: " Фоизи ҳолатҳо"
      helptext: "Ин нишондиҳанда муайян мекунад, ки ҳолатҳо то чӣ муддат \nкушода нигоҳ дошта мешаванд ва раванди идоракунии ҳолат аз лаҳзаи пешниҳоди гузориши аввалия ба Ташкилоти корбар то бастани ҳолат чӣ қадар \nвақтро дар бар мегирад. Давомнокии вақт ба гурӯҳҳои зерин ҷудо карда мешавад: камтар аз 1 моҳ; аз 1 то 3 моҳ; \nаз 3-6 моҳ; зиёда аз 6 моҳ.\n"
    case_closure_rate:
      title: " 12. Шумораи ҳолатҳои баста‌шуда"
      reporting_site: "Макони ҳисоботдиҳӣ"
      helptext: " Ин нишондиҳанда шумораи ҳолатҳоеро чен мекунад, ки дар як моҳ барои ҳар як макони ҳисоботдиҳӣ баста шудаанд. Макони ҳисоботдиҳӣ\n ҳамчун маконе фаҳмида мешавад, ки дар он Ташкилоти корбар хизматрасониҳо пешниҳод мекунад ва ҳодиса \nдар он ҷо ба провайдери хизматрасонӣ гузориш дода шудааст.\n"
    client_satisfaction_rate:
      title: "13. Сатҳи қаноатмандии мизоҷон"
      label: "Қаноатмандии мизоҷон"
      invalid: "Ҳисобкунии ин нишондиҳанда дар ҳоли ҳозир дастрас нест."
      helptext: "Ин нишондиҳанда фоизи наҷотёфтагонеро чен мекунад, ки Пурсишномаи бозхӯрди мизоҷонро\nпур карда, аз хизматрасониҳои идоракунии ҳолат, ки ба онҳо пешниҳод шудаанд, қаноатманд мебошанд. Ин нишондиҳанда \nбар асоси пур кардани шакли «Бозхӯрди мизоҷ» дар GBVIMS+ муайян карда мешавад, ки онро корманде пур мекунад, ки ғайр аз \nкорманди масъули ҳолат бошад ва ба наҷотёфта хизматрасонӣ пешниҳод накарда бошад.\n"
    supervisor_to_caseworker_ratio:
      title: "14. Таносуби супервизорҳо ба кормандони масъули ҳолат"
      label: "Кормандони масъули ҳолат барои ҳар як супервизор"
      helptext: |
        Ин нишондиҳанда шумораи кормандони масъули ҳолатро, ки аз ҷониби ҳар як супервизор назорат карда мешаванд, нишон медиҳад, яъне таносуби
         супервизор ба корманди масъули ҳолат. Ин ҳисоб бар асоси нақшҳои корбарӣ, ки дар платформа таъин шудаанд, анҷом дода мешавад.
    case_load:
      title: "15. Ҳаҷми сарбории корманди масъули ҳолат"
      case_load: "Ҳаҷми сарбории корманди масъули ҳолат"
      percent: " Фоизи кормандони масъули ҳолат, ки сарбории парванда доранд"
      10cases: "< 10 парвандаҳо"
      20cases: "11 - 20 парвандаҳо"
      21-30cases: "21 - 30 парвандаҳо"
      30cases: "> 30 парвандаҳо"
      helptext: "Ин нишондиҳанда бори миёнаи парвандаҳоро барои ҳар як корманди фаъоли масъули ҳолат дар асоси ҳолатҳои фаъол чен мекунад. \nТаносуби шумораи ҳолатҳо ба кормандони масъули ҳолат тибқи гурӯҳбандии зерин тақсим карда мешавад: камтар аз 10\n ҳолати кушода, аз 10-20 ҳолати кушода, аз 21-30 ҳолати кушода ва зиёда аз 30 ҳолати кушода.\n"
    date_range_dialog:
      title: "Интихоби фосилаи санаҳо"
      description: "Пас аз татбиқи ин тағйирот, маълумот барои фосилаи байни ду санаи дар поён муайяншуда интихоб карда мешавад."
