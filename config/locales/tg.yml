            label: Таҳрир кардан
        explanation: Ҳодисаеро ифода мекунад, ки воқеъ шудааст. Инҳо одатан ҳодисаҳои зӯроварӣ ё бадрафторӣ мебошанд, аммо метавонанд ба рӯйдодҳои дигар, аз қабили тамос ё бархӯрд бо мақомоти ҳифзи ҳуқуқ низ марбут бошанд. Ҳодисаҳо аксаран ба парвандаҳо пайваст карда мешаванд.
