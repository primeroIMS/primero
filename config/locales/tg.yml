          create:
            explanation: Қобилияти эҷод кардани гурӯҳи корбарӣ.
            label: ' Эҷод кунед'
          delete:
            explanation: Қобилияти тоза кардани гурӯҳи корбарӣ.
            label: Тоза кардан
          manage:
            explanation: 'Ба корбар имкон медиҳад, ки ҳамаи амалҳои дастрасро бо гурӯҳҳои корбарӣ иҷро кунад. Иҷозати "Идоракунӣ" аслан маънои "ҳама чиз"-ро дорад. МУҲИМ: Ин инчунин қобилияти эҷод ва нест кардани гурӯҳҳои корбариро медиҳад.'
            label: Идоракунӣ (ҳамаи иҷозатҳо барои ин навъи захира)
          read:
            explanation: Қобилияти дидани гурӯҳҳои корбарон.
            label: Дидан
          write:
            explanation: Қобилияти таҳрири гурӯҳҳои корбарон.
            label: ' Таҳрир кардан'
        explanation: Дастаро ё гурӯҳи ҳамкори корбаронеро ифода мекунад, ки метавонанд маълумотро мубодила кунанд. Мудирон одатан метавонанд ҳамаи сабтҳоеро бинанд, ки аз ҷониби корбарони иҷтимоӣ дар Гурӯҳҳои корбарии онҳо идора карда мешаванд.
