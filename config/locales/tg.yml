            label: Намоиши нигарониҳои ҳифзӣ аз рӯи маҳалли ҷойгиршавӣ
          dash_reporting_location:
            explanation: Ҷадвале, ки нишон медиҳад дар ҳар як макон чанд парванда мавҷуд аст (дар як сатҳи муайяни тақсимоти маъмурӣ, масалан «Вилоят» ё «Ноҳия»). Ҳар як сатри ҷадвал як маконро ифода мекунад ва сутунҳо вазъиятҳои гуногуни парвандаҳоро нишон медиҳанд («ПАРВАНДАҲОИ КУШОДА», «НАВ (ҲАФТАИ ГУЗАШТА)», «НАВ (ИН ҲАФТА)», «БАСТА (ҲАФТАИ ГУЗАШТА)», «БАСТА (ИН ҲАФТА)»). Одатан барои ҳисобҳои роҳбарон ё маъмурон истифода мешавад.
            label: ' Парвандаҳо аз рӯи макони гузоришдиҳӣ'
          dash_service_provisions:
            explanation: Шумораи парвандаҳоеро нишон медиҳад, ки дигар корбарон барои онҳо хизматрасонӣ илова кардаанд. Ин шумора дар қисмати асосии панели идоракунӣ намоиш дода мешавад.
