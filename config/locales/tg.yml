            explanation: ' Ба корбар имкон медиҳад, ки ҳамаи амалҳои дастрасро нисбат ба нақшҳо иҷро намояд. Иҷозати «Идоракунӣ» аслан маънои «ҳамаи имкониятҳо»-ро дорад. МУҲИМ: Ин иҷозат инчунин ҳуқуқи эҷод ва нест кардани нақшҳоро медиҳад.'
            label: Идоракунӣ (ҳамаи иҷозатҳо барои ин навъи захира)
          permitted_roles:
            explanation: ' Агар нақш ҳуқуқи иҷрои ягон амали дар боло зикршударо нисбат ба нақшҳо дошта бошад, он метавонад ин амалҳоро танҳо барои нақшҳое иҷро намояд, ки дар ин рӯйхат муайян шудаанд. Масалан, агар нақш барои нақшҳо иҷозатҳои «Хондан» ва «Таъин кардан» -ро дошта бошад, вале дар бахши «Нақшҳои идорашаванда» танҳо «Корманди масъули ҳифзи кӯдак» ва «Роҳбари ҳифзи кӯдак» нишон дода шуда бошанд, он танҳо ҳамин ду нақшро дида метавонад ва танҳо метавонад корбарони навро ба ҳамин ду нақш таъин намояд. Агар барои ҳамин нақш ягон «Нақши идорашаванда» муайян нашуда бошад, он метавонад ҳамаи нақшҳоро бинад ва ҳисобҳои нави корбарро бо ҳар гуна нақши мавҷуд дар низом эҷод намояд.'
