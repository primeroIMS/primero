            label: Вазъи арзёбӣ
          kpi_average_followup_meetings_per_case:
            explanation: Имконияти дидани ҳиссаи парвандаҳои фаъоле, ки корбар ба онҳо дастрасӣ дорад ва барои онҳо шакли арзёбӣ пурра анҷом дода шудааст.
            label: Шумораи миёнаи вохӯриҳои пайгирӣ барои ҳар як парванда
          kpi_average_referrals:
            explanation: Имконияти дидани шумораи миёнаи равонасозиҳо ба ҳар як намуди хизматрасонӣ дар байни ҳамаи парвандаҳои фаъоле, ки корбар ба онҳо дастрасӣ дорад.
            label: Шумораи миёнаи равонасозиҳо
          kpi_case_closure_rate:
            explanation: Имконияти дидани шумораи парвандаҳои басташуда дар ҳар як макон барои ҳар моҳ.
            label: Шумораи ҳолатҳои баста‌шуда
          kpi_case_load:
            explanation: Имконияти дидани шумораи миёнаи парвандаҳои кушодае, ки ҳар як корманди масъули парванда дорад.
            label: Ҳаҷми сарбории корманди масъули ҳолат
          kpi_client_satisfaction_rate:
            explanation: Имконияти дидани фоизи наҷотёфтагони қаноатманд аз миёни онҳое, ки Пурсиши бозхурдро анҷом додаанд, барои ҳар як парванда.
            label: Сатҳи қаноатмандии мизоҷон
          kpi_completed_case_action_plans:
            explanation: Имконияти дидани фоизи парвандаҳои фаъоле, ки Нақшаи амали парвандаи пуршуда доранд.
            label: ' Нақшаи чорабиниҳои парвандаҳое, ки ба анҷом расидаст'
          kpi_completed_case_safety_plans:
            explanation: Имконияти дидани фоизи парвандаҳои фаъоле, ки Нақшаи бехатарӣ талаб карда шуда ва пурра иҷро гардидааст.
            label: Нақшаҳои бехатарии парванда, ки пурра анҷом дода шудаанд
          kpi_completed_supervisor_approved_case_action_plans:
            explanation: ' Имконияти дидани фоизи парвандаҳои фаъоле, ки Нақшаи амали парвандаи тасдиқшуда аз ҷониби роҳбар доранд.'
            label: Нақшаҳои амали анҷомёфтаи парвандаҳо, ки аз ҷониби Роҳбар тасдиқ шудаанд
          kpi_goal_progress_per_need:
            explanation: Имконияти дидани фоизи ҳадафҳои амалӣшуда дар ҳар як категорияи эҳтиёҷот барои парвандаҳое, ки корбар ба онҳо дастрасӣ дорад.
            label: ' Сатҳи иҷрои ҳадафҳо'
          kpi_number_of_cases:
            explanation: ' Имконияти дидани шумораи парвандаҳои наве, ки ҳар моҳ дар ҳар як макон ба қайд гирифта ва кушода мешаванд.'
            label: Шумораи парвандаҳо
          kpi_number_of_incidents:
            explanation: ' Имконияти дидани теъдоди ҳодисаҳои нави кушодашуда аз рӯи ҳар макон ва ҳар моҳ.'
            label: Шумораи ҳодисахо
          kpi_reporting_delay:
            explanation: Имконияти дидани шумораи рӯзҳои гузашта байни рух додани зӯроварии гендерӣ  нисбат ба наҷотёфта ва гузориш додани он ба пешниҳодкунандаи хизматрасонӣ барои ҳамаи ҳодисаҳое, ки корбар ба онҳо дастрасӣ дорад.
            label: Таъхир дар гузоришдиҳӣ
          kpi_services_provided:
            explanation: Имконияти дидани намудҳои хизматрасониҳое, ки аз ҷониби ташкилот мустақиман пешниҳод шудаанд, барои ҳамаи парвандаҳое, ки корбар ба онҳо дастрасӣ дорад.
            label: Хизматрасониҳои пешниҳодшуда
          kpi_supervisor_to_caseworker_ratio:
            explanation: ' Имконияти дидани таносуби кормандони масъули парванда ба роҳбарон.'
            label: Таносуби супервизорҳо ба кормандони масъули парванда
          kpi_time_from_case_open_to_close:
            explanation: Имконияти дидани давомнокии кушода будани парвандаҳо барои ҳамаи парвандаҳои дастрас.
            label: Давомнокии вақт аз кушодани ҳолат то бастани ҳолат
        label: ' Нишондиҳандаҳои асосии самаранокӣ'
      agency:
        actions:
          assign:
            explanation: ' Имконияти интихоб кардани ташкилот ҳангоми эҷод ё таҳрири ҳисоби корбар. Агар корбари ҷорӣ ин иҷозатро дар баробари иҷозати «Хондани ташкилот» барои корбарон дошта бошад, ӯ танҳо метавонад корбарро ба ташкилоти худ илова намояд.'
            label: Вогузор кардан
          create:
            explanation: Қобилияти эҷод кардани макомот
            label: Эҷод кардан
          manage:
            explanation: 'Ба корбар иҷозат медиҳад, ки ҳамаи амалҳои дастрасро нисбат ба ташкилотҳо иҷро намояд. Иҷозати «Идоракунӣ» аслан маънои «дастрасии пурра ба ҳама амалҳо»-ро дорад. Муҳим: Инчунин ҳуқуқи эҷод кардани макомоти навро фароҳам меорад.'
            label: Идоракунӣ (ҳамаи иҷозатҳо барои ин навъи захира)
          read:
            explanation: Қобилияти дидани макомотхо
            label: Дидан
          write:
            explanation: Имконияти таҳрир кардани маълумот дар бораи ташкилотҳо. Лутфан дар назар дошта бошед, ки ин иҷозат нисбат ба ҳамаи ташкилотҳои мавҷуда дар низом татбиқ мешавад.
            label: Таҳрир кардан
        explanation: ' Ташкилоте, ки аъзояш Примеро-ро истифода мебаранд. Ташкилотҳо аз гурӯҳҳои корбарон мустақил мебошанд.'
        label: Мақомот
