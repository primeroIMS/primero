            label: Аз тарафи гурӯҳи ман мубодила шудааст
          dash_shared_with_me:
            explanation: ' Нишон медиҳад, ки чанд парванда ба шумо равона ё интиқол дода шудааст'
            label: Бо ман мубодила шудааст
          dash_shared_with_my_team:
            explanation: ' Ба роҳбар шумораи парвандаҳоеро нишон медиҳад, ки ба ҳар як корбар дар дастаи ӯ роҳхат ё интиқол дода шудаанд.'
            label: Бо гурӯҳи ман мубодила шудааст
          dash_shared_with_my_team_overview:
            explanation: ' Ба роҳбар шумораи парвандаҳоеро нишон медиҳад, ки ба ҳар як корбар дар дастаи ӯ роҳхат ё интиқол дода шудаанд.'
            label: Бо гурӯҳи ман мубодила шудааст  (Overview)
          dash_shared_with_others:
            explanation: Нишон медиҳад, ки чандто аз парвандаҳои ман роҳхатҳои фаъол, интиқолҳои дар интизорӣ қарордошта ё интиқолҳои радшуда доранд. Одатан барои роҳбарон пешбинӣ нашудааст, магар он ки онҳо худ парвандаҳоро идора намоянд.
            label: Бо дигарон мубодила шудааст
          dash_violations_category_verification_status:
            explanation: Нишон медиҳад, ки чанд қонунвайронкунии MRM аз ҳар як намуд ба қайд гирифта шудааст, бо тақсимот аз рӯи вазъи тасдиқкунӣ
            label: ' MRM - Шумораи қонунвайронкуниҳо аз рӯи вазъи тасдиқкунӣ'
          dash_violations_category_region:
            explanation: Нишон медиҳад, ки дар ҳар як минтақа чанд қонунвайронкунии MRM ба қайд гирифта шудааст, бо тақсимот аз рӯи навъи қонунвайронкунӣ.
            label: MRM - Қонунвайронкуниҳо аз рӯи минтақаҳо
          dash_perpetrator_armed_force_group_party_names:
            explanation: Нишон медиҳад, ки чанд қонунвайронкунии MRM аз ҳар як намуд ба қайд гирифта шудааст, бо тақсимот аз рӯи омилони қонунвайронкунӣ.
            label: MRM - Шумораи қонунвайронкуниҳо аз рӯи омилони қонунвайронкунӣ
          dash_show_none_values:
            explanation: Ба ҳамаи панелҳои идоракунӣ, ки парвандаҳоро аз рӯи сатҳи хатар гурӯҳбандӣ мекунанд, категорияи иловагии «Бе сатҳи хатар» илова мекунад. Ин махсус барои танзимоте пешбинӣ шудааст, ки дар майдонҳои сатҳи хатар варианти чоруми «Бе хатар» мавҷуд аст.
            label: Намоиши парвандаҳо бо «Бе сатҳи хатар» дар панели арзёбӣ
          dash_tasks:
            explanation: Ба корбар иҷозат медиҳад, ки саҳифаи вазифаҳоро бинад. Ин имконият бояд барои кормандони идоракунии ҳолатҳо ва пешниҳодкунандагони хизматрасонӣ истифода шавад, зеро нишондиҳандаҳо танҳо ба парвандаҳое дахл доранд, ки онҳо мустақиман идора мекунанд. Барои роҳбарон, ба ҷойи он, бояд панели идоракунии «Намоиши парвандаҳо аз рӯи вазифаҳои муҳлаташон гузашта» дастрас карда шавад, зеро он имкон медиҳад вазифаҳои муҳлатгузаштаи ҳамаи корбаронро дар гурӯҳҳои корбарии худ бинанд.
            label: ' Саҳифаи вазифаҳо'
          dash_national_admin_summary:
            explanation: Шумораи умумии парвандаҳои кушода дар низом, шумораи парвандаҳои нави таъсисёфта дар ҳар яке аз ду ҳафтаи охир ва шумораи парвандаҳои басташуда дар ҳар яке аз ду ҳафтаи охирро нишон медиҳад.
