          sync_mobile:
            explanation: ' Ин иҷозат, дар маҷмӯъ, ба корбар имкон медиҳад, ки аз барномаи мобилӣ истифода барад. Аввалан, он ба корбар имкон медиҳад амалҳои «Барои мобилӣ қайд кардан» ва «Аз қайди мобилӣ хориҷ кардан»-ро бинад, ки дар рӯйхати ҳодисаҳо ва саҳифаи намоиши ҳодиса дастрас мебошанд. Қайд кардани ҳодиса барои мобилӣ маънои онро дорад, ки маълумоти марбут ба он ҳодиса байни дастгоҳи мобилии корбар ва барномаи веб ҳамоҳанг карда мешавад. Баръакс, хориҷ кардани қайди мобилӣ ин ҳамоҳангсозиро қатъ менамояд. Корбароне, ки ин иҷозатро надоранд, инчунин наметавонанд дастгоҳҳои мобилии худро бо барномаи веб ҳамоҳанг созанд ва дар натиҷа наметавонанд барои идоракунии ҳодисаҳо аз барномаи мобилӣ истифода баранд.'
