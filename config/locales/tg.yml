          access_log:
            explanation: Имконияти дидани таърихи пурраи дастрасиҳо ба сабт аз ҷониби дигар корбарон (дидан ва навсозӣ) аз замони таъсиси сабт.
            label: ' Сабти дастрасиҳо'
          create:
            explanation: Имкони эҷод кардани дархости ҷустуҷӯ
            label: Эҷод кардан
          enable_disable_record:
            explanation: ' Имкони фаъол ё ғайрифаъол кардани дархости ҷустуҷӯ. Дархостҳои ҷустуҷӯии «ғайрифаъол» ба таври пешфарз дар рӯйхати дархостҳои ҷустуҷӯ намоиш дода намешаванд. Корбарон метавонанд тавассути истифодаи филтр дархостҳои ҷустуҷӯии ғайрифаъолро дар рӯйхат бубинанд.'
            label: Фаъол / Ғайрифаъол
          export_case_pdf:
            explanation: Корбар метавонад аз рӯйхати дархостҳои ҷустуҷӯ ё саҳифаҳои намоиши дархости ҷустуҷӯ содироти файли PDF-ро эҷод кунад, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад — барои як, якчанд ё ҳамаи сабтҳое, ки корбар ба онҳо дастрасӣ дорад. Дар файли содироти PDF, маълумот аввал аз рӯи парванда ва сипас аз рӯи шакле, ки маълумот дар он ҷойгир аст, тартиб дода мешавад.
            label: Содир кардани PDF
          export_csv:
            explanation: Корбар метавонад аз рӯйхати дархостҳои ҷустуҷӯ ё саҳифаҳои намоиши дархости ҷустуҷӯ содироти файли CSV-ро эҷод кунад, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад — барои як, якчанд ё ҳамаи дархостҳои ҷустуҷӯе, ки корбар ба онҳо дастрасӣ дорад.
            label: Содир кардани CSV
          export_custom:
            explanation: Корбар метавонад аз рӯйхати дархостҳои ҷустуҷӯ ё саҳифаҳои намоиши дархости ҷустуҷӯ содироти файли XLS-ро эҷод кунад, ки маҷмӯи фармоишии шаклҳо ё майдонҳоро дар бар мегирад — барои як, якчанд ё ҳамаи дархостҳои ҷустуҷӯе, ки корбар ба онҳо дастрасӣ дорад. Дар ин содирот, ҳар як шакл дар варақаи алоҳидаи худ дар дохили файли XLS ифода мешавад. Корбар метавонад бо истифода аз равзанаи "Содироти фармоишӣ" интихоб кунад, ки кадом шаклҳо ё майдонҳо ба содирот дохил карда шаванд. Лутфан таваҷҷӯҳ намоед, ки корбарон танҳо дар сурате метавонанд шаклҳо ва майдонҳоро ба содирот дохил кунанд, ки агар аллакай ҳангоми дидани дархости ҷустуҷӯ дар барнома қобилияти дидани он шаклҳо ва майдонҳоро дошта бошанд.
            label: Содироти фармоишӣ
          export_json:
            explanation: Корбар метавонад аз рӯйхати дархостҳои ҷустуҷӯ ё саҳифаҳои намоиши дархости ҷустуҷӯ содироти файли JSON-ро эҷод кунад, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад — барои як, якчанд ё ҳамаи дархостҳои ҷустуҷӯе, ки корбар ба онҳо дастрасӣ дорад. Ин содирот асосан барои онҳое истифода мешавад, ки мехоҳанд дархостҳои ҷустуҷӯро аз системаи ҷории Primero содир карда, сипас онҳоро ба системаи дигари Primero ё ба системаи дигари идоракунии маълумот ворид кунанд. Формати JSON бо мошин хондашаванда буда, барои аксари корбарон амалӣ нест.
            label: Содир кардани JSON
          export_list_view_csv:
