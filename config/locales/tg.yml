            explanation: Қобилияти интихоби гурӯҳҳои корбарӣ ҳангоми эҷод ё таҳрири ҳисоби корбарӣ. Лутфан таваҷҷӯҳ намоед, ки агар корбари ҷорӣ сатҳи дастрасии "танҳо сабтҳо ё корбарони гурӯҳи ман"-ро дошта бошад, ӯ танҳо метавонад як ё якчанд гурӯҳи корбарии худро барои ҳисоби корбарие, ки эҷод ё таҳрир карда истодааст, интихоб кунад. Ин маънои онро дорад, ки мудире, ки қобилияти таъини гурӯҳҳои корбариро дорад, метавонад корбарро танҳо ба он гурӯҳҳои корбарӣ илова кунад, ки худи мудир ҳоло ба онҳо мансуб аст. Ин иҷозат барои ҳар гуна нақше, ки ҳисобҳои корбариро эҷод ё таҳрир мекунад, зарур аст.
