            label: Намоиши парвандаҳо аз рӯи корманди иҷтимоӣ
          dash_cases_to_assign:
            explanation: ' МУҲИМ: Танҳо барои роҳбарон. Шумораи парвандаҳоеро нишон медиҳад, ки бевосита ба корбари ҷорӣ тааллуқ доранд (ки бояд роҳбар бошад). Ин панели идоракунӣ бар он асос ёфтааст, ки роҳбарон парвандаҳои худро мустақиман идора намекунанд ва агар роҳбар парвандаҳои шахсии худ дошта бошад, бояд онҳоро ба кормандони идоракунии ҳолатҳо дар дастаи худ вогузор намояд.'
            label: ' (Барои роҳбарон) Парвандаҳое, ки бояд ба кормандони даста таъйин шаванд'
          dash_flags:
