    delete_label: Оё мутмаин ҳастед, ки мехоҳед ин амалро иҷро намоед? Ин ҳамаи танзимотеро дар бар мегирад, ки ҳангоми эҷод шудани ин конфигуратсия мавҷуд буданд. Пас аз тоза кардани ин конфигуратсия, шумо дигар наметавонед ин танзимотро бозпас гиред ё барқарор намоед.
    explanation: 'Бо пахш кардани тугмаи «Захира кардан», сабти ҳамаи танзимоти ҷории конфигуратсия (масалан: нақшҳо, муассисаҳо, шаклҳо) дар ҳамин лаҳза эҷод карда мешавад. Пас аз хазира кардан шумо метавонед ин тағйиротро ба Примеро ирсол намоед. Агар дар оянда шумо тағйирот ба конфигуратсия ворид кунед, ки онро бекор кардан хоҳед, шумо метавонед ин сабти конфигуратсияро татбиқ кунед, то ҳамаи танзимот ба ҳолате, ки дар ҳамин лаҳза буданд, барқарор карда шаванд.'
