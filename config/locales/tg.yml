            explanation: Ба корбар имкон медиҳад, ки рӯйхати ҳамаи парвандаҳои ба парвандаи ҷорӣ вобасташударо бубинад.
            label: Намоиши парвандаҳои пайвастшуда
          update_case_relationships:
            explanation: Ба корбар имкон медиҳад, ки ҳангоми навсозии парвандаи худ парвандаи дигари мавҷударо ҷустуҷӯ намуда, онро ба парвандаи худ пайваст кунад. Инчунин ба корбарон иҷозат медиҳад, ки ин парвандаи дуюмро аз парвандаи худ ҷудо намоянд.
            label: ' Вобаста кардан / ҷудо кардани парванда аз парвандаи дигар'
          attribute:
            explanation: Интихоб кардани корбаре, ки парвандаро муайян кардааст. Дар баъзе системаҳо ин метавонад ҳамон корбаре бошад, ки аввалин маротиба раванди ворид шудани баҳрабарандаро ба низоми идоракунии парванда оғоз намудааст. Дар дигар низомҳо, ки бақайдгирии мустақилонаро иҷозат медиҳанд, ин корбар метавонад худи баҳрабаранда бошад.
            label: Таъин кунед
        explanation: Шахси алоҳидаеро ифода мекунад, ки метавонад кӯдак, наҷотёфта ё дигар баҳрабаранда бошад.
