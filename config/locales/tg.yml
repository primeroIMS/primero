          receive_referral:
            explanation: Ба корбар иҷозат медиҳад, ки роҳхатро қабул намояд. Корбароне, ки ин иҷозатро доранд, ҳамчун гирандагони эҳтимолии роҳхат намоиш дода мешаванд. Корбароне, ки ин иҷозатро надоранд, ҳангоми ҷустуҷӯи гиранда дар равзанаи роҳхат ҳамчун гирандаи эҳтимолӣ нишон дода намешаванд.
            label: Қабули равонасози
          receive_referral_different_module:
            explanation: ' Ба корбар иҷозат медиҳад, ки равонасозии сабтееро қабул намояд, ки дар модули дигари Примеро эҷод шудааст. Корбароне, ки ин иҷозатро доранд, ҳамчун гирандагони эҳтимолии равонасози барои чунин сабт намоиш дода мешаванд. Корбароне, ки ин иҷозатро надоранд, ҳангоми ҷустуҷӯи гиранда дар равзанаи расонасози ҳамчун гирандаи эҳтимолӣ нишон дода намешаванд.'
            label: ' Қабул кардани равонасози аз корбари модули дигар'
          receive_transfer:
            explanation: Ба корбар иҷозат медиҳад, ки интиқоли парвандаро қабул намояд. Корбароне, ки ин иҷозатро доранд, ҳамчун гирандагони эҳтимолии интиқол намоиш дода мешаванд. Корбароне, ки ин иҷозатро надоранд, ҳангоми ҷустуҷӯи гиранда дар равзанаи интиқол ҳамчун гирандаи эҳтимолӣ нишон дода намешаванд.
