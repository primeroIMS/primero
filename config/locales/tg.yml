            explanation: ' Корбарон метавонанд барои яке аз аъзои оилаи парванда дар зер-шакли «Тафсилоти оила» парвандаи нав эҷод намоянд. Лутфан дар назар дошта бошед, ки барои пайваст кардани ин ду парванда сабти оилавӣ ба таври худкор эҷод карда мешавад.'
            label: ' Эҷод кардани парванда аз тафсилоти оила'
          link_family_record:
            explanation: Ба корбар имкон медиҳад, ки сабти оилавии мавҷударо ҷустуҷӯ намуда, онро ба парвандаи худ пайваст кунад. Инчунин ба корбарон иҷозат медиҳад, ки пайвастагии сабти оилавиро аз парванда бекор намоянд.
            label: ' Вобаста кардан / ҷудо кардани сабти оилавӣ аз парванда'
