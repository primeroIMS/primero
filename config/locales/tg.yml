          dash_matching_results:
            explanation: ' Куҳнашуда. Ин панел кор намекунад ва дар v2 нест карда мешавад.'
            label: ' Намоиши натиҷаҳои мувофиқшуда'
          dash_protection_concerns:
            explanation: Ҷадвале, ки нишон медиҳад чанд парванда ҳар як масъалаи ҳифзиро дар бар мегирад. Ҳар як сатри ҷадвал як масъалаи ҳифзиро ифода мекунад, дар ҳоле ки сутунҳо вазъиятҳои гуногуни парвандаҳоро нишон медиҳанд («Ҳамаи парвандаҳо», «Парвандаҳои кушода», «Нав (ин ҳафта)», «Баста (ин ҳафта)»).
