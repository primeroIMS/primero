  configurations:
    apply_label: Шумо мутмаин ҳастед? Агар шумо ин танзимотро дар низом татбиқ кунед, тағирот дар низом сабт мешавад. Шумо ҳамаи танзимоти ҷории худро гум мекунед ва онҳоро баргардонида наметавонед, агар онҳоро аллакай дар конфигуратсияи дигар захира накарда бошед.
    apply_label_bold: Ҳангоми боргузории тағйирот, Примеро муддати чанд дақиқа барои истифодабарандагон дастнорас хоҳад буд.
    version_mismatch_tooltip: Шумо наметавонед ин танзимотро татбиқ намоед, зеро он бо истифода аз версияи навтраи Примеро нисбат ба версияе, ки айни ҳол сомонаи шумо истифода мебарад, эҷод шудааст. Лутфан то он даме интизор шавед, ки шумо версияи охирини Примеро‑ро истифода мебаред, баъд ин танзимотро татбиқ намоед.
    send_header: Ба муҳити истеҳсолӣ ирсол намоед
    send_text: Оё мутмаин ҳастед? Агар шумо «Ирсол кардан»-ро пахш намоед, ин танзимот ба сомонаи муҳити истеҳсолии шумо ирсол карда мешавад. Ин танзимот дар муҳити истеҳсолӣ то он даме татбиқ намешавад, ки маъмури он сомона онро ба таври дастӣ татбиқ накунад.
