            label: Арзёбиҳои дар муҳлат анҷомнашуда
          cases_by_task_overdue_case_plan:
            explanation: Ба роҳбар имкон медиҳад, ки шумораи парвандаҳоеро бубинад, ки барои ҳар як корманди масъули парванда вазифаҳои муҳлатгузаштаи Нақшаи парванда доранд.
