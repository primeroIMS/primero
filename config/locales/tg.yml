            label: Содироти CSV-и намоиши рӯйхат
          export_pdf:
            explanation: Корбар метавонад аз рӯйхати дархостҳои ҷустуҷӯ ё саҳифаҳои намоиши дархости ҷустуҷӯ содироти файли PDF-ро эҷод кунад, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад — барои як, якчанд ё ҳамаи сабтҳое, ки корбар ба онҳо дастрасӣ дорад. Дар файли содироти PDF, маълумот аввал аз рӯи парванда ва сипас аз рӯи шакле, ки маълумот дар он ҷойгир аст, тартиб дода мешавад.
            label: Содир кардани PDF
          export_xls:
            explanation: 'Корбар метавонад аз рӯйхати дархостҳои ҷустуҷӯ ё саҳифаҳои намоиши дархости ҷустуҷӯ содироти файли XLS-ро эҷод кунад, ки ҳамаи майдонҳоеро дар бар мегирад, ки корбари ҷорӣ ба онҳо дастрасӣ дорад — барои як, якчанд ё ҳамаи дархостҳои ҷустуҷӯе, ки корбар ба онҳо дастрасӣ дорад. Дар ин содирот, ҳар як шакл дар варақаи алоҳидаи худ дар дохили файли XLS ифода мешавад. ЭЗОҲ: Формати XLS аломатҳои ғайрилотиниро (масалан, арабӣ, бангалӣ) дар шакли хондашаванда намоиш медиҳад, дар ҳоле ки содироти CSV ин корро намекунад.'
            label: Содироти Excel (файли XLS)
          flag:
            explanation: Қобилияти илова кардани нишонагузори ба дархости ҷустуҷӯ. Корбароне, ки ин иҷозатро доранд, инчунин метавонанд байрақчаҳоеро, ки худашон ба дархости ҷустуҷӯ илова кардаанд, тоза кунанд.
            label: ' Нишонагузорӣ'
          resolve_any_flag:
            explanation: Ба корбар имкон медиҳад, ки ҳар гуна нишонагузориро дар сабт ҳал кунад, новобаста аз он ки нишонагузориро кӣ эҷод кардааст.
            label: Бартараф кардани ҳар гуна нишонагузори
          flag_update:
            explanation: Ба корбар имкон медиҳад, ки ҳар гуна нишонагузориро дар сабт навсозӣ кунад, новобаста аз он ки нишонагузориро кӣ эҷод кардааст.
            label: Нишонагузориро навсозӣ кунед
          import:
            explanation: Ба корбар имкон медиҳад, ки бо ворид кардани парвандаҳо аз файли CSV, Excel ё JSON як ё якчанд парвандаи нав эҷод кунад. Файли воридшаванда бояд хеле мушаххас формат карда шавад, то ки маълумот дуруст ворид карда шавад. Ин функсия бояд танҳо барои корбарони маъмурӣ, ки малакаҳои пешрафтаи техникӣ ва дониши амиқи тарзи форматбандии маълумот дар Primero доранд, дастрас бошад. Танҳо аз саҳифаи рӯйхати парвандаҳо иҷро карда мешавад.
