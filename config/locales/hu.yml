      no_disability: "Nincs fogyatékosság"
      helptext: |
        Ez a mutató a túlélőknek nyújtott szolgáltatásokat számolja az ügyfélkezelési folyamat során.
        A nyújtott szolgáltatás alatt azt a szolgáltatást értjük, amelyet a Felhasználó szervezete saját maga nyújt, nem pedig azokat, amelyeket más szolgáltatásokra történő referálás vagy belső referálás útján nyújtanak.
    average_referrals:
      title: "9. Átlagos Referenciák"
      label: "Átlagos referenciák esetenként"
      helptext: "Ez a mutató azt számolja, hogy átlagosan hány referálás történt minden rögzített ügyfélnél (minden szolgáltatástípusra vonatkozóan), függetlenül attól, hogy az ügy aktív/nyitott vagy lezárt. \nA referálások számítanak, amelyeket az ügyfél lapján rögzítettek, nem csak azokat, amelyeket a platformon keresztül hajtottak végre.\n"
    referrals_per_service:
