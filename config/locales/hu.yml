      title: "4. Értékelési státusz"
      completed: "Befejezett"
      completed_supervisor_approved: "Befejezve és vezető által jóváhagyva"
      helptext: |
        Ez a mutató azt számolja ki, hogy az aktív ügyfelek közül hány esetben fejeződött be az értékelési űrlap.
        Az értékelés akkor tekinthető befejezettnek, ha a Túlélő Értékelés űrlap kötelező mezői kitöltésre kerültek.
    completed_case_safety_plans:
      title: "5. Befejezett ügyfél biztonsági tervek"
      completed: "Befejezett ügyfél biztonsági terv"
      helptext: |
        Ez a mutató azt számolja ki, hogy az aktív ügyfelek közül hány esetben szükséges és készült el a biztonsági terv (pl. párkapcsolati erőszak, öngyilkossági/gyilkossági kockázat, gyermekvédelem).
        A biztonsági terv akkor tekinthető befejezettnek, ha a Biztonsági Terv űrlap kötelező mezői kitöltésre kerültek.
    completed_case_action_plans:
      title: "6. Befejezett ügyfél akciótervek"
      completed: "Befejezett ügyfél akcióterv"
      label: "Befejezett ügyfél akcióterv"
      helptext: |
        Ez a mutató azt számolja ki, hogy az aktív ügyfelek közül hány esetben készült el az akcióterv.
        Az akcióterv akkor tekinthető befejezettnek, ha az Akcióterv űrlap kötelező mezői kitöltésre kerültek.
    completed_supervisor_approved_case_action_plans:
      title: "7. Vezető által jóváhagyott ügyfél akciótervek"
      completed_and_approved: "Vezető által jóváhagyott befejezett ügyfél akciótervek"
      helptext: "Ez a mutató azt számolja ki, hogy az aktív ügyfelek közül hány esetben készült el és lett jóváhagyva az akcióterv a vezető által. \nAz ügyfél akcióterv akkor tekinthető jóváhagyottnak, amikor az ügyfélkezelő jóváhagyást kér az akciótervre, és a vezető jóváhagyja az akciótervet a platformon.\n"
    services_provided:
      title: "8. Szolgáltatások"
      service: "Szolgáltatás"
      count: "A megadott időpontok"
      male: "Férfi"
      female: "Nő"
      0-11: "0-11"
      12-17: "12-17"
      '>18': ">18"
