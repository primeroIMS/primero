      time: "Időtartam"
      percent: "Az esetek százalékos aránya"
      helptext: "Ez a mutató azt méri, hogy az ügyek mennyi ideig maradnak nyitva, és mennyi ideig tart az ügyfélkezelési folyamat a kezdeti bejelentéstől az ügy lezárásáig. \nAz időtartam a következő időkeretekre van felosztva: kevesebb mint 1 hónap; 1 és 3 hónap között; 3-6 hónap között; több mint 6 hónap.\n"
    case_closure_rate:
      title: "12. Az ügy lezárásának száma"
      reporting_site: "Jelentési hely"
      helptext: |
        Ez a mutató havonta méri az ügyek lezárásának számát a jelentési helyeken. A jelentési hely az a hely, ahol a Felhasználó szervezete szolgáltatásokat nyújt, és ahol az incidenst jelentették a szolgáltatónak.
    client_satisfaction_rate:
      title: "13. Ügyfél-elégedettségi arány"
      label: "Ügyfél-elégedettség"
      invalid: "Ezt jelenleg nem tudjuk kiszámítani."
      helptext: "Ez a mutató azt méri, hogy a túlélők hány százaléka töltötte ki az Ügyfél Visszajelzési Kérdőívet, és elégedett az ügyfélkezelési szolgáltatásokkal, amelyeket kapott. \nEzt a mutatót az Ügyfél Visszajelzési űrlap GBVIMS+ felületen történő kitöltése alapján számítják ki, egy olyan munkatárs által, aki nem az ügyfélkezelő volt.\n"
