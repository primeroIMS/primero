      label: "Átlagos nyomon követő találkozók ügyfelenként"
      helptext: "Ez a mutató azt számolja, hogy hány nyomon követő találkozót hajtottak végre minden aktív ügyfélnél az ügyfélkezelő által a platformon. \nA nyomon követő találkozó az ügyfélkezelő és a túlélő közötti találkozót jelenti a kezdeti interjú/megnyilatkozás után.\n"
    time_from_case_open_to_close:
