            label: Esetek száma
          kpi_number_of_incidents:
            explanation: Lehetővé teszi annak megtekintését, hogy havonta hány új incidenst jelentettek az egyes helyszíneken.
            label: Incidensek száma
          kpi_reporting_delay:
            explanation: Lehetővé teszi annak megtekintését, hogy mennyi idő telt el a GBV incidens és az első szolgáltatónak történő jelentés között az összes incidens esetében, amelyhez a felhasználó hozzáfér.
            label: Jelentési késedelem
          kpi_services_provided:
            explanation: Lehetővé teszi annak megtekintését, hogy az ügykezelési folyamat során milyen típusú szolgáltatásokat nyújtott az adott szervezet.
            label: Nyújtott szolgáltatások
          kpi_supervisor_to_caseworker_ratio:
            explanation: Lehetővé teszi a felügyelő és az esetmunkások arányának megtekintését.
            label: Felügyelő és esetmunkás arány
          kpi_time_from_case_open_to_close:
            explanation: Lehetőséget ad annak megtekintésére, hogy az ügyek mennyi ideig maradtak nyitva, azaz meddig tartott az ügykezelési folyamat.
            label: Az ügy nyitástól a lezárásig eltelt idő
        label: KPI
      agency:
        actions:
          assign:
            explanation: Lehetőséget biztosít egy szolgáltató kiválasztására felhasználói fiók létrehozásakor vagy szerkesztésekor. Ha a jelenlegi felhasználó rendelkezik ezzel a jogosultsággal, valamint a "Szolgáltató olvasás" jogosultsággal, csak saját szolgáltatójához adhat hozzá felhasználót.
            label: Szolgáltató hozzárendelése
          create:
            explanation: Ügynökség létrehozásának lehetősége.
            label: Hozzon létre
          manage:
            explanation: 'Lehetővé teszi a felhasználó számára, hogy minden elérhető műveletet végrehajtson a Szolgáltatókon. A "Kezelés" jogosultság minden jogosultságot megad ehhez az erőforrástípushoz. FONTOS: Ez magában foglalja egy új szolgáltató létrehozásának lehetőségét is.'
            label: Kezelés (az adott erőforrástípus teljes körű engedélyezése)
          read:
            explanation: Lehetőség az ügynökségek megtekintésére.
            label: Megtekintés
          write:
            explanation: Lehetőség az ügynökségekre vonatkozó információk szerkesztésére. Felhívjuk figyelmét, hogy ez a rendszerben lévő összes ügynökségre vonatkozik.
            label: Szerkesztés
        explanation: Olyan szervezetet képvisel, amelynek tagjai a Primero-t használják. Az ügynökségek a felhasználói csoportoktól függetlenül léteznek.
        label: Ügynökség
      audit_log:
        actions:
          read:
            explanation: Lehetővé teszi a felhasználó számára, hogy megtekintsen és szűrjön minden a rendszerben végrehajtott műveletet, felhasználónként, művelettípusonként, rekordazonosítónként és időbélyeg alapján. Ez leginkább országos vagy szolgáltatói szintű adminisztrátoroknak hasznos, mivel ez megjeleníti a rendszer összes felhasználójának tevékenységét. Kérjük, vegye figyelembe, hogy az audit napló nem tartalmaz személyazonosításra alkalmas információkat a rekordokkal kapcsolatban.
            label: Megtekintés
        explanation: A rendszerben végrehajtott összes művelet szűrhető listája. Nem tartalmaz semmilyen azonosítható információt az Ügyekről, Eseményekről vagy Nyomonkövetési kérelmekről.
        label: Ellenőrzési napló
      case:
        actions:
          add_note:
            explanation: Lehetővé teszi, hogy a felhasználó bejegyzést adjon hozzá a "Jegyzetek" alformhoz (más néven "Megjegyzések"). A felhasználó ezt úgy teszi meg, hogy rákattint az "Jegyzetek hozzáadása" gombra az ügy megtekintési oldalán. Ez a funkció különösen hasznos olyan menedzserek számára, akik nem tudják szerkeszteni az ügyeket, de emlékeztetőt szeretnének hozzáadni az ügyhöz az ügyintéző számára. Így a jegyzet hozzáadása hasonló a zászló hozzáadásához. Az előnye, hogy amikor a menedzser jegyzetet ad hozzá egy ügyhöz, értesítés jelenik meg az ügyintézőnél, amikor az ügyet megtekinti a mobil eszközén.
            label: Jegyzet hozzáadása az ügyhöz
          add_registry_record:
            explanation: Lehetővé teszi a felhasználó számára, hogy a nyilvántartás adatait tartalmazó űrlapon keresztül összekapcsoljon egy nyilvántartást egy esettel. Lehetővé teszi továbbá, hogy a felhasználó visszavonja az Ügyhöz már hozzákapcsolt nyilvántartás összekapcsolását.
            label: Nyilvántartási rekord hozzáadása/frissítése az Ügyiratból
          approve_action_plan:
            explanation: Lehetővé teszi a menedzser számára, hogy jóváhagyja a %{approval_label}az ügyintézők eseteit.
            label: Jóváhagyás%{approval_label}
          approve_assessment:
            explanation: Lehetővé teszi a menedzser számára, hogy jóváhagyja a %{approval_label}az ügyintézők eseteit.
            label: '%{approval_label}Nyomtatvány jóváhagyása'
          approve_bia:
            explanation: Lehetővé teszi a menedzser számára, hogy jóváhagyja a %{approval_label}az ügyintézők eseteit.
            label: '%{approval_label}Nyomtatvány jóváhagyása'
          approve_case_plan:
            explanation: Lehetővé teszi a menedzser számára, hogy jóváhagyja a %{approval_label}az ügyintézők eseteit.
            label: Jóváhagyás%{approval_label}
          approve_closure:
            explanation: Lehetővé teszi a menedzser számára, hogy jóváhagyja az %{approval_label} az ügyintézői ügyeiben.
            label: '%{approval_label}Nyomtatvány jóváhagyása'
          approve_gbv_closure:
            explanation: Lehetővé teszi a menedzser számára, hogy jóváhagyja a %{approval_label}az ügyintézők eseteit.
            label: '%{approval_label}Nyomtatvány jóváhagyása'
          assign:
            explanation: Megengedi a felhasználót, hogy elküldje az esetet az eredeti rekordtulajdonostól a rendszer bármely más felhasználójának. Ehhez nem szükséges a gyermek hozzájárulása. Az átvitelekkel ellentétben, a címzettnek nincs lehetősége elfogadni vagy elutasítani a megbízást.
            label: Hozzárendelés
          assign_within_agency:
            explanation: Megengedi a felhasználót, hogy elküldje az esetet az eredeti rekordtulajdonostól a ügynökség bármely más felhasználójának. Ehhez nem szükséges a gyermek hozzájárulása. Az átvitelekkel ellentétben, a címzettnek nincs lehetősége elfogadni vagy elutasítani a megbízást.
            label: Hozzárendelés saját szervezeten belüli felhasználóhoz
          assign_within_user_group:
            explanation: Megengedi a felhasználót, hogy elküldje az esetet az eredeti rekordtulajdonostól az aktuális felhasználói csoportok bármely más felhasználójának. Ehhez nem szükséges a gyermek hozzájárulása. Az átvitelekkel ellentétben, a címzettnek nincs lehetősége elfogadni vagy elutasítani a megbízást.
            label: Hozzárendelés a saját felhasználói csoportomban lévő felhasználóhoz
          create_case_from_referral:
            label: Ügy létrehozása referálásból
            explanation: Lehetővé teszi a felhasználó számára, hogy egy referálásból új ügyet hozzon létre.
          change_log:
            explanation: A felhasználó láthatja a bejegyzés létrehozásától kezdve a rajta végrehajtott összes változtatás előzményeit.
            label: Módosítási napló
          close:
            explanation: Lehetővé teszi a felhasználó számára, hogy az ügy státuszát zártra állítsa.
            label: Ügy lezárása
          consent_override:
            explanation: Megengedi a felhasználót, hogy beutalást vagy átvitelt hajtson végre olyan ügyben, amelyhez nem adtak hozzájárulást.
            label: A hozzájárulás hiányának felülbírálása utaláskor vagy átvitelkor
          create:
            explanation: Eset létrehozásának lehetősége
            label: Hozzon létre
          display_view_page:
            explanation: Ha egy felhasználó keresést végez egy ügyre, amelyhez nincs hozzáférése, ezzel a jogosultsággal egy kis modális ablakban alapvető információkat láthat az ügyről, még akkor is, ha nem tudja megnyitni az ügy teljes adatait. Az ebben a "Nézet modálban" megjelenő mezők azok, amelyeket "Rövid űrlapon megjelenítésre" állítottak be. Ez a modál hasznos azoknak a felhasználóknak, akik családkeresési és újraegyesítési tevékenységeket végeznek, mivel elérhetik a "Nézet modált", amikor potenciális egyezéseket vizsgálnak nyomkövetési kérelmekhez.
            label: Nézet oldal megjelenítése
          enable_disable_record:
            explanation: Lehetővé teszi az ügy letiltását vagy engedélyezését. A "Letiltott" ügyek alapértelmezés szerint nem jelennek meg az ügylistában. A felhasználók szűrő használatával láthatják a letiltott ügyeket az ügylistában. Mivel a Primero nem engedélyezi az ügyek törlését, a felhasználó letilthat egy ügyet helyette, például ha hibás adatokat tartalmaz vagy tévedésből lett létrehozva.
            label: Engedélyezés / Tiltás
          export_case_pdf:
            explanation: Lehetővé teszi a felhasználó számára, hogy PDF fájl exportot készítsen az ügylistából vagy az ügy megtekintési oldaláról, amely tartalmazza az összes mezőt, amelyhez a felhasználónak hozzáférése van, egy vagy több ügy esetében.
            label: Ügy PDF exportálása
          export_csv:
            explanation: 'Lehetővé teszi a felhasználó számára, hogy CSV fájl exportot készítsen az ügylistából vagy az ügy megtekintési oldaláról, amely tartalmazza az összes mezőt, amelyhez a felhasználónak hozzáférése van, egy vagy több ügy esetében. FONTOS: A CSV export nem jelenít meg olvasható formában nem-latin karaktereket (pl. arab, bangla).'
            label: CSV exportálása
          export_custom:
            explanation: Lehetővé teszi a felhasználó számára, hogy egyedi mezőket és űrlapokat válasszon ki XLS fájl export készítéséhez. Az exportált fájlban minden űrlap külön lapként jelenik meg az XLS fájlban. A felhasználó kiválaszthatja, hogy mely űrlapokat és mezőket szeretné az exportba belefoglalni a Custom Export modál segítségével.
            label: Egyéni exportálás
          export_duplicate_id_csv:
            explanation: CSV export létrehozása az azonos Nemzeti ID-vel rendelkező ügyekről (a konfigurációtól függően eltérő címke).
            label: Másolatok exportálása
          export_json:
            explanation: Lehetővé teszi a felhasználó számára, hogy JSON fájl exportot készítsen az ügylistából vagy az ügy megtekintési oldaláról. Ez az exportálási formátum elsősorban azoknak hasznos, akik az eseteket át akarják vinni egy másik Primero rendszerbe vagy egy másik információkezelő rendszerbe.
            label: JSON exportálása
          export_list_view_csv:
            explanation: Lehetővé teszi a felhasználó számára, hogy CSV fájl exportot készítsen az ügylista oldalról, amely tartalmazza azokat a mezőket, amelyek megjelennek az ügylistában.
            label: Listanézet csv exportálása
          export_pdf:
            explanation: Lehetővé teszi a felhasználó számára, hogy PDF fájl exportot készítsen az ügylistából vagy az ügy megtekintési oldaláról, amely tartalmazza az összes mezőt, amelyhez a felhasználónak hozzáférése van, egy vagy több ügy esetében.
            label: Ügy PDF exportálása
          export_photowall:
            explanation: Lehetővé teszi a felhasználó számára, hogy fotók exportját készítse az ügylista oldalról, amely tartalmazza az összes kiválasztott ügy fényképét. Ezt az exportálási funkciót főként családkeresési és újraegyesítési tevékenységekhez használják.
            label: Fotófal exportálása
          export_unhcr_csv:
            label: UNHCR CSV exportálása
            explanation: ELAVULT - Ez a funkció már nincs használatban.
          export_xls:
            explanation: 'Lehetővé teszi a felhasználó számára, hogy XLS fájl exportot készítsen az ügylistából vagy az ügy megtekintési oldaláról, amely tartalmazza az összes mezőt, amelyhez a felhasználónak hozzáférése van. Az exportált fájlban minden űrlap külön lapként jelenik meg az XLS fájlban. FONTOS: Az XLS formátum olvasható formában jeleníti meg a nem-latin karaktereket (pl. arab, bangla), míg a CSV export nem.'
            label: Excel (XLS fájl) exportálása
          find_tracing_match:
            explanation: Kizárólag családkeresési és újraegyesítési tevékenységekkel kapcsolatos kontextusban használják. Ezzel a jogosultsággal rendelkező felhasználók látni fogják a "Nyomkövetési egyezés keresése" gombot az ügy megtekintési oldalán.
            label: Nyomkövetési egyezés keresése az esetből
          flag:
            explanation: Lehetőség zászló hozzáadására egy ügyhöz. Azok a felhasználók, akik ezzel a jogosultsággal rendelkeznek, eltávolíthatják az általuk hozzáadott zászlókat is.
            label: Zászló hozzáadása
          resolve_any_flag:
            explanation: Lehetővé teszi a felhasználó számára, hogy feloldja bármely zászlót az ügyben, függetlenül attól, hogy ki hozta létre a zászlót.
            label: Bármely zászló feloldása
          import:
            explanation: Lehetővé teszi a felhasználó számára, hogy egy vagy több új ügyet hozzon létre CSV, Excel vagy JSON fájl importálásával.
            label: Import
          incident_details_from_case:
            explanation: Lehetővé teszi az incidens részletei alformhoz való bejegyzés hozzáadását olyan ügyekhez, amelyeket a felhasználó keresési eredmények között talál, de amelyhez nem rendelkezik hozzáféréssel.
            label: Esemény részleteinek hozzáadása egy másik felhasználó esetéhez a keresési eredmények oldaláról
          incident_from_case:
            explanation: Ez az engedély lehetővé teszi a felhasználó számára, hogy az "Incidens létrehozása" gombra kattintson. Ez egy incidenst generál, amely tartalmazhat néhány, az ügyből átmásolt információt. A GBV-ügyek esetében ez a gomb az ügyet megjelenítő oldal tetején található, és az ügy egészére vonatkozó információknak felel meg. Egyes incidenskövető kontextusokban ez a gomb az "Incidens részletei" alűrlapon található. Ebben a helyzetben bizonyos információk átmásolhatók az incidens részleteit tartalmazó alűrlapról, ahol a gombra kattintottak, valamint az eset egészéből. Vagyis a létrehozott új incidens tartalmazhatja az "Erőszak típusa" mezőt az egyedi incidens részleteit tartalmazó alűrlapról, de tartalmazhatja magának az esetnek a korát és nemét is. Megjegyzendő, hogy ez a jogosultság lehetővé teszi a felhasználó számára a létrehozott incidensre mutató link megtekintését is.
            label: Incidens létrehozása egy esetből
          remove_alert:
            explanation: Lehetővé teszi a felhasználó számára, hogy eltávolítson egy figyelmeztetést az ügyről.
            label: Figyelmeztetés eltávolítása az ügyből
          manage:
            explanation: Lehetővé teszi a felhasználó számára, hogy az összes rendelkezésre álló műveletet elvégezze az ügyeken. A "Kezelés" engedély lényegében "mindent" jelent.
            label: Kezelés (az adott erőforrástípus teljes körű engedélyezése)
          read:
            explanation: Az ügy megtekintésének képessége
            label: Megtekintés
          receive_referral:
            explanation: Lehetővé teszi a felhasználó számára, hogy referálást fogadjon. Azok a felhasználók, akik ezzel a jogosultsággal rendelkeznek, megjelennek a referálás címzettjei között.
            label: Referencia fogadása
          receive_referral_different_module:
            explanation: Lehetővé teszi a felhasználó számára, hogy olyan rekordra referálást fogadjon, amelyet egy másik Primero modulban hoztak létre.
            label: Referálás fogadása más modultól
          receive_transfer:
            explanation: Megengedi a felhasználót hogy elfogadja az átvitelet. Az ezzel az engedéllyel rendelkező felhasználók az átviteli művelet lehetséges címzettjeként jelennek meg, míg az ezzel az engedéllyel nem rendelkező felhasználók nem jelennek meg potenciális címzettként, amikor valaki az átviteli módban címzettet keres.
            label: Átvitel fogadása
          referral:
            explanation: Lehetővé teszi a felhasználó számára, hogy ideiglenesen hozzáférést adjon egy ügyhöz egy másik felhasználónak. Az átirányítás címzettje ugyanazokat a műveleteket végezheti el az átirányított ügyön, mint a saját ügyein. Amikor a címzettnek már nincs szüksége az ügyhöz való hozzáférésre, az "Átirányítások és átadások" alűrlapon a "Kész" gombra kattintva elveszíti az ügyhöz való hozzáférést. Ügyet csak olyan felhasználónak lehet átirányítani, akinek a szerepkörében lehetőség van átirányítások fogadására.
            label: Ajánlás
          referral_from_service:
            explanation: Lehetővé teszi a felhasználó számára, hogy lássa a "Referálás" gombot a Szolgáltatások alformon, és referálást kezdeményezzen.
            label: Referálás a Szolgáltatások alformból
          remove_assigned_users:
            explanation: Lehetővé teszi a felhasználó számára, hogy eltávolítsa a másik hozzárendelt felhasználókat az ügyből.
            label: Hozzárendelt felhasználók eltávolítása (hozzáférés visszavonása)
          reopen:
            explanation: Lehetővé teszi a felhasználó számára, hogy megnyisson egy jelenleg lezárt ügyet.
            label: Újranyitás
          request_approval_action_plan:
            explanation: Lehetővé teszi a felhasználó számára (általában egy ügyintéző), hogy kérje a menedzserét, hogy hagyja jóvá az ügyének %{approval_label}.
            label: Jóváhagyás iránti %{approval_label}kérelem
          request_approval_assessment:
            explanation: Lehetővé teszi a felhasználó számára (általában egy ügyintéző), hogy kérje a menedzserét, hogy hagyja jóvá az ügyének %{approval_label}.
            label: Jóváhagyás iránti %{approval_label}kérelem
          request_approval_bia:
            explanation: Lehetővé teszi a felhasználó számára (általában egy ügyintéző), hogy kérje a menedzserét, hogy hagyja jóvá az ügyének %{approval_label}.
            label: Jóváhagyás iránti %{approval_label}kérelem
          request_approval_case_plan:
            explanation: Lehetővé teszi a felhasználó (általában az ügyintéző) számára, hogy kérje, hogy a vezetője hagyja jóvá az ügyet%{approval_label}
            label: Jóváhagyás iránti %{approval_label}kérelem
          request_approval_closure:
            explanation: Lehetővé teszi a felhasználó (általában az ügyintéző) számára, hogy kérje, hogy a vezetője hagyja jóvá az ügyet%{approval_label}
            label: Jóváhagyás iránti %{approval_label}kérelem
          request_approval_gbv_closure:
            explanation: Lehetővé teszi a felhasználó számára (általában egy ügyintéző), hogy kérje a menedzserét, hogy hagyja jóvá az ügyének %{approval_label}.
            label: Jóváhagyás iránti %{approval_label}kérelem
          request_transfer:
            explanation: Megjeleníti az „Átvitel kérése” gombot a „Modális megtekintés” menüben. A gomb segítségével a felhasználó személyre szabott megjegyzéssel üzenetet küldhet e-mailben az ügy aktuális irattulajdonosának, arra kérve, hogy az irattulajdonos adja át az ügyet a kérelmet küldő felhasználónak. Ez olyan helyzetekben hasznos, amikor a gyerekek gyakran változtatják a helyszínt, és a szociális munkásoknak szükségük van a gyermek korábbi ügyvezetőjére, hogy információkat küldjenek a gyermekről, hogy elkerüljék az ismétlődő rekordok létrehozását.
            label: Átvitel kérvényezése
          search_owned_by_others:
            explanation: Lehetővé teszi a felhasználó számára, hogy keresést végezzen olyan rekordok között, amelyekhez általában nincs hozzáférése, akár azért, mert nem ő az ügy tulajdonosa, akár azért, mert a tulajdonos nem az ő felhasználói csoportjaiban van. Bár a felhasználó látni fogja az ügyet a keresési eredmények között, nem fog tudni belépni az ügy részletes oldalára, így nem fog tudni részletes információkat megtekinteni az ügyről.
            label: Más felhasználók által birtokolt ügyiratok keresése
          service_provision_incident_details:
            explanation: Lehetővé teszi a felhasználó számára, hogy az Esemény hozzáadása modal alján megjelenjen a "Mentés és szolgáltatásnyújtás hozzáadása" feliratú gomb. Erre a gombra kattintva a felhasználó elmenti az incidenssel kapcsolatban jelenleg megadott információkat, és közvetlenül a Szolgáltatás hozzáadása modalra lép. Mivel ez a művelet közvetlenül kapcsolódik az Esemény hozzáadása és a Szolgáltatásnyújtás hozzáadása műveletekhez, csak akkor van értelme ezt a jogosultságot megadni egy szerepkörnek, ha az adott szerepkör rendelkezik az "Eseményadatok hozzáadása egy másik felhasználó ügyéhez" és a "Szolgáltatásnyújtás hozzáadása egy másik felhasználó ügyéhez" jogosultságokkal is.
            label: Lásd a Szolgáltatásnyújtás hozzáadása gombot az Incidens részletek modulon.
          services_section_from_case:
            explanation: Lehetővé teszi a felhasználó számára, hogy szolgáltatási bejegyzést adjon hozzá egy olyan ügyhöz, amelyet a keresési eredmények között talált, de amelyhez nincs hozzáférése. A felhasználó ezt a műveletet a keresési eredmények oldalon hajtja végre.
            label: Szolgáltatásnyújtás hozzáadása más felhasználó ügyéhez
          service_own_entries_only:
            explanation: Azok a felhasználók, akik rendelkeznek ezzel a jogosultsággal, amikor hozzáférnek egy hozzájuk továbbított ügyfélhez, csak azokat a bejegyzéseket fogják látni a Szolgáltatások alűrlapon, amelyeknél őket választották szolgáltatóként. Ez jellemzően a szolgáltatói szerepköröknél használatos.
            label: Hozzáférés kizárólag a saját Szolgáltatások alűrlap-bejegyzéseimhez.
          sync_external:
            explanation: Lehetővé teszi, hogy a felhasználó szinkronizálja a rekordokat egy külső információkezelő rendszerrel.
            label: Szinkronizálás külső információkezelő rendszerrel
          sync_mobile:
            explanation: Lehetővé teszi a felhasználó számára, hogy az eseteket offline használatra tárolja.
            label: '"Offline" jelölés'
          transfer:
            explanation: Lehetővé teszi a felhasználó számára, hogy az ügyet átküldje bármelyik felhasználónak a rendszerben, akinek van jogosultsága átadás fogadására. Az ügy tulajdonosa azonban csak akkor változik, ha a címzett elfogadja a átadást.
            label: Adatátvitel
          view_photo:
            explanation: Lehetővé teszi a felhasználó számára, hogy megtekinthesse az ügy fényképeit az ügylista nézetből.
            label: Fénykép megtekintése az esetlista nézetéből
          view_incident_from_case:
            explanation: Lehetővé teszi a felhasználó számára, hogy megtekinthesse az egyes ügyekhez kapcsolódó incidensek listáját és azok összegző információit.
            label: '''Események'' megtekintése az ''Ügy'' menüpontból'
          view_protection_concerns_filter:
            explanation: Lehetővé teszi a felhasználó számára, hogy lássa a védelmi aggályok szűrőt az ügylista oldalon.
            label: Védelmi aggályok szűrőjének megtekintése az ügylista oldalon
          view_registry_record:
            explanation: Lehetővé teszi a felhasználó számára, hogy megtekintse az Ügyhöz kapcsolódó bármely nyilvántartás adatait. Lehetővé teszi továbbá a felhasználó számára, hogy megnézze az Ügy nyilvántartási adatlapját.
            label: A nyilvántartási rekord megtekintése az Ügyiratból
          write:
            explanation: Lehetővé teszi a felhasználó számára, hogy az "Szerkesztés" gombra kattintva frissítse az ügy információit és mentse azokat.
            label: Szerkesztés
          accept_or_reject_transfer:
            explanation: Lehetővé teszi a felhasználó számára, hogy elfogadjon vagy elutasítson egy átadást egy csapattag nevében (például, ha egy felügyelő elfogadja a átadást az ő ügyintézője nevében).
            label: Átadás elfogadása vagy elutasítása más felhasználó nevében
          list_case_names:
            explanation: A menedzserek általában nem láthatják az ügyek nevét az ügylistában. Ha egy menedzser rendelkezik ezzel a jogosultsággal, akkor látni fogja az ügyneveket a listában.
            label: Ügynevek megtekintése az ügylistában, ha menedzser
          mark_for_offline:
            explanation: Lehetővé teszi a felhasználó számára az "Ügy" gyorsítótárba helyezését offline használatra.
            label: '"Offline" jelölés'
          view_family_record:
            explanation: A felhasználók megtekinthetik az "Háztartás" űrlapot az ügyfélhez kapcsolódó családtagokra vonatkozóan.
            label: Háztartás megtekintése
          case_from_family:
            explanation: A felhasználók létrehozhatnak egy új ügyet egy családtag számára a Háztartás részletek alformban.
            label: Ügy létrehozása a Háztartás részletekből
          link_family_record:
            explanation: Lehetővé teszi a felhasználó számára, hogy egy meglévő Háztartást kapcsoljon egy ügyfélhez, illetve hogy szétkapcsolja a háztartást az ügyféltől.
            label: Háztartás kapcsolása / eltávolítása az ügyféltől
        explanation: Egyéni gyermeket, túlélő hozzátartozót vagy más kedvezményezettet képvisel.
        label: Eset
      dashboard:
        actions:
          action_needed_new_updated:
            explanation: Megjeleníti az "Új és frissített" jelzőt a "Tevékenység szükséges" irányítópulton. Ez magában foglalja azokat az eseteket, amelyek újonnan lettek hozzárendelve az aktuális felhasználóhoz, vagy amelyeket egy másik felhasználó frissített azóta, hogy az aktuális felhasználó utoljára frissítette.
            label: 'Tevékenység szükséges: Új vagy frissített'
          action_needed_transfer_awaiting_acceptance:
            explanation: Megjeleníti a "Várakozó átadások" jelzőt a "Tevékenység szükséges" irányítópulton. Ez magában foglal minden olyan esetet, amelyben az aktuális felhasználóhoz átadást küldtek, amelyet az aktuális felhasználó még nem fogadott el.
            label: 'Tevékenység szükséges: Várakozó átadások'
          approvals_action_plan:
            explanation: Megjeleníti a felhasználó által kezelt ügyek Akcióterv jóváhagyási kérelmeit, amelyek függőben vannak, jóváhagyva vagy elutasítva lettek.
            label: Az ügyintéző %{approval_label} jóváhagyásai
          approvals_action_plan_pending:
            explanation: Megjeleníti a menedzser csapatában lévő ügyek függő Akcióterv jóváhagyási kérelmeit.
            label: '%{approval_label}Menedzseri jóváhagyások'
          approvals_assessment:
            explanation: Megjeleníti a felhasználó által kezelt ügyek Értékelési jóváhagyási kérelmeit, amelyek függőben vannak, jóváhagyva vagy elutasítva lettek.
            label: Az ügyintéző %{approval_label} jóváhagyásai
          approvals_assessment_pending:
            explanation: Megjeleníti a menedzser csapatában lévő ügyek függő Értékelési jóváhagyási kérelmeit.
            label: '%{approval_label}Menedzseri jóváhagyások'
          approvals_case_plan:
            explanation: Megmutatja az aktuális felhasználó "Esetterv" jóváhagyási kérelmekkel rendelkező ügyeinek számát, amelyek Függőben, Jóváhagyva vagy Elutasítva vannak.
            label: Ügyintéző %{approval_label} jóváhagyások
          approvals_case_plan_pending:
            explanation: Megjeleníti a menedzser csapatában lévő ügyek függő Esetterv jóváhagyási kérelmeit.
            label: '%{approval_label}Menedzseri jóváhagyások'
          approvals_closure:
            explanation: Megmutatja az aktuális felhasználó "Lezárási jóváhagyási kérelemmel" rendelkező ügyeinek számát, amelyek Függőben, Jóváhagyva vagy Elutasítva vannak.
            label: Az ügyintéző %{approval_label} jóváhagyásai
          approvals_closure_pending:
            explanation: Megjeleníti a menedzser csapatában lévő ügyek függő Zárási jóváhagyási kérelmeit.
            label: '%{approval_label}Menedzseri jóváhagyások'
          approvals_gbv_closure:
            explanation: Megmutatja az aktuális felhasználó azon ügyeinek számát, amelyekben a GBV lezárási jóváhagyási kérelmek függőben, jóváhagyva vagy elutasítva vannak.
            label: Az ügyintéző %{approval_label} jóváhagyásai
          approvals_gbv_closure_pending:
            explanation: Megjeleníti a menedzser csapatában lévő ügyek függő GBV Zárási jóváhagyási kérelmeit.
            label: '%{approval_label}Menedzseri jóváhagyások'
          case_overview:
            explanation: A kezdőlap tetején található áttekintő műszerfal-kártya, amely olyan számadatokat tartalmaz, mint az "Összes" és az "Új esetek".
            label: Áttekintő Irányítópult
          case_risk:
            explanation: Megmutatja, mennyi eset tartozik az egyes kockázati szintekhez.
            label: Esetek kockázati szintek szerint
          cases_by_task_overdue_assessment:
            explanation: Lehetővé teszi a menedzser számára, hogy lássa, hány esetben van késedelmes Értékelési feladat az egyes ügyintézőiknél.
            label: Késedelmes Értékelési feladatok
          cases_by_task_overdue_case_plan:
            explanation: Lehetővé teszi a menedzser számára, hogy lássa, hány esetben van késedelmes Esetterv feladat az egyes ügyintézőiknél.
            label: Késedelmes Esetterv feladatok
          cases_by_task_overdue_followups:
            explanation: Lehetővé teszi a menedzser számára, hogy lássa, hány esetben van késedelmes Követés feladat az egyes ügyintézőiknél.
            label: Késedelmes Követés feladatok
          cases_by_task_overdue_services:
            explanation: Lehetővé teszi a menedzser számára, hogy lássa, hány esetben van lejárt Szolgáltatási feladat az egyes esetkezelői számára.
            label: Késedelmes Szolgáltatás feladatok
          dash_case_incident_overview:
            explanation: Megjeleníti a menedzser számára, hogy hány ügyet kezel az egyes csapattagok, amelyeket más felhasználókhoz utaltak át vagy továbbítottak.
            label: Áttekintés - Eseteim / incidenseim
          dash_cases_by_social_worker:
            explanation: Megjeleníti az egyes felhasználók által kezelt ügyek számát, mind az összesített, mind az új ügyek tekintetében.
            label: Ügyek megtekintése szociális munkás szerint
          dash_cases_to_assign:
            explanation: 'FONTOS: Csak menedzserek számára. Megjeleníti a menedzser által közvetlenül kezelt ügyek számát, amelyeket át kell adni más ügyintézőknek a csapatban.'
            label: (Menedzsereknek) Esetek, amelyeket a csapatomban dolgozóknak kell kiosztanom
          dash_flags:
            explanation: Megjeleníti azoknak a zászlóknak a listáját, amelyeket más felhasználók adtak hozzá a bejegyzéseimhez, valamint azoknak a zászlóknak a listáját, amelyeket én adtam hozzá más felhasználók bejegyzéseihez.
            label: Megjelölt bejegyzések
          dash_group_overview:
            explanation: Megjeleníti a menedzser számára, hogy hány nyitott és zárt ügyet kezelnek a csapattagok.
            label: A csoportom esetei
          dash_matching_results:
            explanation: MEGSZÜNTETVE. Ez a műszerfal nem funkcionális, és a v2-ben eltávolításra kerül.
            label: Találatok megtekintése
          dash_protection_concerns:
            explanation: Megjeleníti, hogy hány ügy van minden egyes védelemhez kapcsolódó aggodalomra.
            label: Védelmi aggályok szerinti esetek
          dash_protection_concerns_by_location:
            explanation: Ugyanaz, mint a Védelemhez Kapcsolódó Aggodalmak irányítópult, de a felhasználó kiválaszthat egy helyszínt, amely alapján statisztikákat láthat a védelemhez kapcsolódó aggodalmak előfordulásáról csak azon a helyen.
            label: Védelemhez Kapcsolódó Aggodalmak Megtekintése Hely Szerint
          dash_reporting_location:
            explanation: Megjeleníti, hogy hány ügy van minden helyszínen (egy specifikus szinten, például "Tartomány" vagy "Kerület").
            label: Ügyek Helyszín Szerint
          dash_service_provisions:
            explanation: Megjeleníti az ügyek számát, amelyekhez más felhasználók szolgáltatásokat adtak hozzá.
            label: Ügyek Szolgáltatás Nyújtás Szerint
          dash_shared_from_my_team:
            explanation: Megmutatja a menedzsereknek, hogy csapatuk egyes felhasználói hány olyan ügyet kezelnek, amelyeket más felhasználóknak továbbítanak vagy átadnak.
            label: Megosztva a Csapatomtól
          dash_shared_with_me:
            explanation: Megjeleníti, hogy hány ügyet utaltak vagy ruháztak át nekem.
            label: Megosztva velem
          dash_shared_with_my_team:
            explanation: Megjeleníti a menedzser számára, hogy hány ügyet utaltak vagy ruháztak át a csapattagoknak.
            label: Megosztva a csapatommal
          dash_shared_with_my_team_overview:
            explanation: Megjeleníti a menedzser számára, hogy hány ügyet utaltak vagy ruháztak át a csapattagoknak.
            label: Megosztva a Csapatommal (Áttekintés)
          dash_shared_with_others:
            explanation: Megjeleníti, hogy hány ügyem van aktív ajánlásokkal, függő átutalásokkal vagy elutasított átutalásokkal.
            label: Másokkal megosztva
          dash_violations_category_verification_status:
            explanation: Megjeleníti, hogy hány MRM megsértés történt minden kategóriában, megerősítési státusz szerint bontva.
            label: MRM - Megsértések száma megerősítési státusz szerint
          dash_violations_category_region:
            explanation: Megjeleníti, hogy hány MRM megsértés történt minden régióban, megsértés típus szerint bontva.
            label: MRM - Megsértések száma régió szerint
          dash_perpetrator_armed_force_group_party_names:
            explanation: Megjeleníti, hogy hány MRM megsértés történt minden kategóriában, elkövető szerint bontva.
            label: MRM - Megsértések száma elkövető szerint
          dash_show_none_values:
            explanation: Hozzáad egy "Nincs Kockázati Szint" kategóriát minden olyan irányítópulthoz, amely ügyeket bont le kockázati szint szerint.
            label: '"Nincs Kockázati Szint" ügyek megtekintése az Értékelési Irányítópulton'
          dash_tasks:
            explanation: Lehetővé teszi a felhasználó számára a feladatok oldalának megtekintését. Ez különösen hasznos ügyintézők és szolgáltatók számára, mivel a számok közvetlenül az általuk kezelt ügyekre vonatkoznak.
            label: Feladatok oldala
          dash_national_admin_summary:
            explanation: Megjeleníti a rendszerben lévő összes nyitott ügyet, az elmúlt két hétben létrehozott új ügyek számát, valamint az elmúlt két hétben lezárt ügyek számát.
            label: Rendszergazdai összefoglaló
          view_response:
            explanation: Megjeleníti, hogy az egyes válasz típusok alapján hány ügy van különböző kockázati szinteken, ahol a szolgáltatások határidő közeliek vagy túlléptek.
            label: Válaszok megtekintése
          workflow:
            explanation: Lehetővé teszi az ügyintéző számára, hogy egy kördiagramon lássa, hány ügye van az ügykezelési munkafolyamat egyes szakaszaiban.
            label: Ügyek a munkafolyamat lépései szerint
          workflow_team:
            explanation: Lehetővé teszi a menedzser számára, hogy lássa, hogy hány ügy van az egyes szociális munkások által a munkafolyamat különböző szakaszaiban.
            label: Ügyek Munkafolyamat és Ügyintéző Szerint
        explanation: Meghatározza, milyen összefoglaló információk jelenjenek meg a kezdőlapon.
        label: Irányítópult
      disabled:
        explanation: Ha letiltja ezt a szerepet, többé nem tudja hozzáadni a felhasználói fiókokhoz.
        label: Letiltva
      referral_authorization:
        explanation: Ez azt jelenti, hogy a szerepkör megjelenik az "Ajánlás Típusa" legördülő menü opciójaként, amikor a felhasználó belső ajánlást végez. Ha a felhasználó ezt a szerepkört választja az ajánlás típusaként, a címzett csak azokat az űrlapokat láthatja, amelyeket a kiválasztott szerepkör láthat.
        label: Felhasználható-e ez a szerepkör az "Ajánlás Típusa" legördülő menüben?
      duplicate:
        actions:
          read:
            explanation: Lehetővé teszi a felhasználó számára, hogy a rendszerben lévő összes esetre kiterjedő keresést végezzen, számos kritérium, többek között a név, becenév, nem, életkor és állampolgárság alapján.
            label: Megtekintés
        explanation: Részletes ügykeresés az adminisztrátorok számára.
        label: Duplikált 'Keresés'
      forms:
        case:
          explanation: 'Ha korlátozzuk egy felhasználó hozzáférését az ügyek űrlapjaihoz, akkor korlátozzuk, hogy milyen információkat láthat egy incidensnél. Például, ha a felhasználónak csak a Rekord Tulajdonos űrlaphoz van hozzáférése, akkor csak az ezen az űrlapon lévő információkat fogja látni. Ha a jelenlegi felhasználónak korlátozott hozzáférése van az űrlapokhoz és jogosult az űrlap konfigurációjának kezelésére, a hozzáférés korlátozása azt is korlátozza, hogy mely űrlapokat konfigurálhatja. MEGJEGYZÉS: Ha nincsenek megadva űrlapok, az azt jelenti, hogy a szerepkör hozzáfér az összes űrlaphoz az ügyekhez.'
          label: Nyomtatványok - Eset
        incident:
          explanation: 'A felhasználó hozzáférésének korlátozása az incidensűrlapokhoz korlátozza, hogy milyen információkat láthat az incidensről. Például, ha a felhasználó csak a Rekord Tulajdonos űrlaphoz fér hozzá, akkor csak az ezen az űrlapon szereplő információkat fogja látni. Ha a jelenlegi felhasználónak korlátozott hozzáférése van az űrlapokhoz és képes az űrlap konfigurálására, a hozzáférés korlátozása szintén korlátozza, hogy mely űrlapokat tudja konfigurálni. MEGJEGYZÉS: Ha nincsenek megadva űrlapok, az azt jelenti, hogy a szerepkör hozzáfér az összes incidensűrlaphoz.'
          label: Nyomtatványok - incidensek
        tracing_request:
          explanation: 'A felhasználó hozzáférésének korlátozása a nyomkövetési kérelmek űrlapjaihoz korlátozza, hogy milyen információkat láthat a nyomkövetési kérelemről. Például, ha a felhasználó csak a Rekord Tulajdonos űrlaphoz fér hozzá, akkor csak az ezen az űrlapon szereplő információkat fogja látni. Ha a jelenlegi felhasználónak korlátozott hozzáférése van az űrlapokhoz és képes az űrlap konfigurálására, a hozzáférés korlátozása szintén korlátozza, hogy mely űrlapokat tudja konfigurálni. MEGJEGYZÉS: Ha nincsenek megadva űrlapok, az azt jelenti, hogy a szerepkör hozzáfér az összes Nyomkövetési Kérelem űrlaphoz.'
          label: Űrlapok - Nyomkövetési Kérelmek
        registry_record:
          explanation: 'A felhasználó hozzáférésének korlátozása a bejegyzések űrlapjaihoz behatárolja, hogy a felhasználó milyen információkat láthat a bejegyzésekben. Ha például a felhasználónak csak a Nyilvántartás-tulajdonos űrlaphoz van hozzáférése, akkor csak az ezen az űrlapon található mezőkben szereplő információkat láthatja. Ha az aktuális felhasználó korlátozott űrlap-hozzáféréssel rendelkezik, és képes kezelni az űrlapok konfigurációját, az űrlap-hozzáférés korlátozása azt is limitálja, hogy mely űrlapokat konfigurálhatja. MEGJEGYZÉS: Ha nincsenek űrlapok megadva, az azt jelenti, hogy a szerepkörnek hozzáférése van a nyilvántartások összes űrlapjához.'
          label: Nyomtatványok - Nyilvántartás
        family:
          label: Űrlapok - Háztartások
          explanation: 'A felhasználó hozzáférésének korlátozása a háztartások űrlapjaihoz korlátozza, hogy milyen információkat láthat a háztartásokról. Például, ha a felhasználó csak a Rekord Tulajdonos űrlaphoz fér hozzá, akkor csak az ezen az űrlapon szereplő információkat fogja látni. Ha a jelenlegi felhasználónak korlátozott hozzáférése van az űrlapokhoz és képes az űrlap konfigurálására, a hozzáférés korlátozása szintén korlátozza, hogy mely űrlapokat tudja konfigurálni.'
      group:
        actions:
          admin_only:
            explanation: Ez azt jelenti, hogy a felhasználók ezzel a szerepkörrel csak az adminisztrációs funkciókkal kapcsolatos dolgokat láthatják, például jelentéseket, űrlap- és nézetkonfigurációkat, felhasználókat, szerepköröket és felhasználói csoportokat. Nem látnak egyedi ügyeket, nyomkövetési kérelmeket vagy incidenseket.
            label: Nincsenek bejegyzések - Csak admin funkciók
          agency:
            explanation: A szerepkör hozzáférhet a szociális szolgáltatók által kezelt rekordokhoz. Ha a felhasználó hozzáfér a felhasználókhoz, akkor hozzáférhet a szolgáltatójuk összes felhasználójához.
            label: Az ügynökségem összes bejegyzése vagy felhasználója
          all:
            explanation: A szerepkör hozzáfér az összes rekordhoz, felhasználóhoz és felhasználói csoporthoz a rendszerben, függetlenül attól, hogy mely felhasználói csoportokhoz tartozik.
            label: Hozzáférés az összes bejegyzéshez vagy felhasználóhoz
          group:
            explanation: A szerepkör hozzáférhet a Felhasználói csoportok összes Felhasználója által kezelt bejegyzésekhez. Csak a saját felhasználói csoportjukban lévő felhasználókhoz férhetnek hozzá. Csak a saját felhasználói csoportjaikhoz férhetnek hozzá.
            label: Hozzáférés a csoportom összes bejegyzéséhez vagy felhasználójához
          self:
            explanation: A szerepkör hozzáférhet a saját rekordjaihoz (ügyekhez, nyomkövetési kérelmekhez vagy incidensekhez), és szerkesztheti a saját felhasználói fiókját.
            label: Csak a saját bejegyzéseimhez vagy felhasználóimhoz való hozzáférés
        explanation: Meghatározza, hogy a szerepkör mely rekordokat (Ügyek, Nyomkövetési Kérelmek, vagy Incidensek) érheti el. Ha a szerepkör hozzáfér a Felhasználókhoz és Felhasználói Csoportokhoz, ez szintén meghatározza, hogy mely Felhasználókhoz és Felhasználói Csoportokhoz férhet hozzá.
        label: Milyen bejegyzéseket érint ez a szerepkör?
      incident:
        actions:
          assign:
            explanation: Lehetővé teszi a felhasználó számára, hogy egy Incidenst az eredeti rekord tulajdonosától bármely más felhasználóhoz küldjön a rendszerben. Azok az incidensek, amelyek már kapcsolódnak egy Ügyhöz, nem ruházhatók át; ehelyett újra kell osztani a kapcsolódó Ügyet, amely frissíti az Incidens rekord tulajdonjogát.
            label: Átruházás
          change_log:
            explanation: A felhasználó láthatja az összes változást, amelyeket a rekord létrehozása óta végrehajtottak. Ez magában foglalja az összes mezőben rögzített értékeket.
            label: Változási Napló
          create:
            explanation: Esemény létrehozásának képessége.
            label: Hozzon létre
          enable_disable_record:
            explanation: Képesség incidens letiltására vagy engedélyezésére. A "Letiltott" Incidensek alapértelmezés szerint nem jelennek meg az incidens listában. A felhasználók egy szűrő segítségével láthatják a letiltott incidenseket az incidens listában.
            label: Engedélyezés / Letiltás
          export_case_pdf:
            explanation: A felhasználó PDF fájlt exportálhat az incidensek listájából vagy az incidens megjelenítési oldalakról, amely tartalmazza az összes mezőt, amelyhez a felhasználó hozzáféréssel rendelkezik, egy vagy több incidensre vonatkozóan. Az exportált PDF fájlban az információkat először ügy szerint csoportosítják, majd az űrlapok szerint, amelyeken az információ megjelenik.
            label: PDF exportálása
          export_csv:
            explanation: A felhasználó CSV fájlt exportálhat az incidens listából vagy incidens megjelenítési oldalakról, amely tartalmazza az összes mezőt, amelyhez a felhasználó hozzáféréssel rendelkezik, egy vagy több incidensre vonatkozóan.
            label: CSV Exportálás
          export_custom:
            explanation: A felhasználó kiválaszthatja a konkrét űrlapokat vagy mezőket, amelyeket egy XLS fájlba exportál.
            label: Egyéni exportálás
          export_incident_recorder_xls:
            explanation: A felhasználó egy speciális XLS fájlt generálhat, amely lehetővé teszi az adatcserét a GBV Incidens Felvevő eszközzel.
            label: Incidens Felvevő XLS exportálás
          export_mrm_violation_xls:
            explanation: A felhasználó speciális Excel (XLS fájl) exportot generálhat MRM jogsértésekhez. Ez a művelet elérhető az incidens megjelenítési oldalon és az incidens listában.
            label: MRM Jogsértések Excel exportálása (XLS fájl)
          export_json:
            explanation: A felhasználó JSON fájlt exportálhat az incidens listából vagy incidens megjelenítési oldalakról, amely tartalmazza az összes mezőt, amelyhez a felhasználó hozzáféréssel rendelkezik. Ez az export főként azok számára hasznos, akik adatokat kívánnak exportálni a jelenlegi Primero rendszerből és egy másik Primero rendszerbe vagy egy másik információkezelő rendszerbe kívánják azokat importálni.
            label: JSON exportálása
          export_list_view_csv:
            explanation: A felhasználó az incidenslista oldalról CSV fájl exportálást generálhat, amely ugyanazokat a mezőket tartalmazza, amelyek az adott felhasználó esetében az incidenslistán megjelennek. Csak az incidenslista oldalról végezhető el.
            label: Listanézet csv exportálása
          export_pdf:
            explanation: A felhasználó PDF fájlt exportálhat az incidens listából vagy az incidens megjelenítési oldalakról, amely tartalmazza az összes mezőt, amelyhez a felhasználó hozzáféréssel rendelkezik. Az exportált PDF fájlban az információkat először ügy szerint, majd az űrlapok szerint csoportosítják.
            label: PDF exportálás
          export_xls:
            explanation: A felhasználó XLS fájl exportálást hozhat létre az incidens listából vagy az incidens megjelenítő oldalakról, amely egyedi űrlapokat vagy mezőket tartalmaz, egy, több vagy az összes ügyfélhez, amelyhez a felhasználó hozzáfér. Ebben az exportban minden űrlap saját fülön jelenik meg az XLS fájlban. A felhasználó kiválaszthatja, mely űrlapokat vagy mezőket szeretne belefoglalni az exportba az Egyéni Exportálás modal segítségével. Kérjük, vegye figyelembe, hogy a felhasználók csak akkor tartalmazhatják az exportban az űrlapokat és mezőket, ha már hozzáférnek azokhoz az űrlapokhoz és mezőkhöz, amikor egy ügyfél megtekintését végzik az alkalmazásban.
            label: Excel (XLS fájl) exportálása
          flag:
            explanation: Lehetővé teszi a felhasználó számára, hogy egy figyelmeztetést adjon egy incidenshez. A felhasználók eltávolíthatják az általuk hozzáadott figyelmeztetéseket is.
            label: Figyelmeztetés hozzáadása
          resolve_any_flag:
            explanation: Lehetővé teszi a felhasználónak, hogy bármely figyelmeztetést megoldjon a rekordban, függetlenül attól, hogy ki hozta létre a figyelmeztetést.
            label: Bármilyen figyelmeztetés megoldása
          import:
            explanation: Lehetővé teszi a felhasználónak, hogy egy vagy több új incidenst importáljon CSV, Excel vagy JSON fájlból. Az importált fájlnak *nagyon* pontosan kell formázottnak lennie, hogy az adatokat megfelelően lehessen importálni. Ez a funkció csak technikailag fejlett rendszergazdáknak szól, akik alaposan ismerik a Primero adatformátumait.
            label: Import
          remove_alert:
            explanation: Ez a jogosultság lehetővé teszi a felhasználónak, hogy eltávolítson egy figyelmeztetést egy incidensből. A figyelmeztetések általában akkor jönnek létre, amikor egy adott mező frissítésre kerül, például amikor megjegyzések frissülnek. A figyelmeztetések általában sárga pontként jelennek meg az incidensek mellett.
            label: Figyelmeztetés eltávolítása egy incidensből
          link_incident_to_case:
            explanation: Lehetővé teszi a felhasználó számára, hogy összekapcsolja az incidenst egy kiválasztott üggyel.
            label: Incidens összekapcsolása egy Üggyel
          manage:
            explanation: Lehetővé teszi a felhasználó számára, hogy minden rendelkezésre álló műveletet végrehajtson az incidenseken. A "Teljes kezelési jogosultság" lényegében mindent magában foglal.
            label: Kezelés (az adott erőforrástípus teljes körű engedélyezése)
          read:
            explanation: Lehetőség az incidens megtekintésére
            label: Megtekintés
          sync_mobile:
            explanation: Ez a jogosultság általában lehetővé teszi a felhasználónak a mobilalkalmazás használatát. Lehetővé teszi a felhasználó számára, hogy lássa a "Mobilra jelölés" és a "Mobilról eltávolítás" műveleteket az incidens listán és megjelenítési oldalakon.
            label: Szinkronizálás mobileszközzel
          verify_mrm:
            explanation: Az MRM felhasználó megváltoztathatja a jogsértések státuszát.
            label: MRM Ellenőrzés
          write:
            explanation: Képesség a "Szerkesztés" gombra kattintani, az incidens adatainak frissítése, és a "Mentés" gombra kattintás. Ez lehetővé teszi az incidens letiltását vagy engedélyezését is.
            label: Szerkesztés
        explanation: Egy bekövetkezett eseményt képvisel. Ezek általában bántalmazási vagy erőszakos esetek, bár megfelelhetnek olyan eseményeknek is, mint például a bűnüldöző szervekkel való összetűzések. Az incidensek gyakran kapcsolódnak az Ügyekhez.
        label: Incidens
      is_manager:
        explanation: Minden olyan felhasználói szerepkörre vonatkozik, amely általában más felhasználókat felügyel. Ez lehetővé teszi a felhasználó számára, hogy olyan műszerfalakat és szűrőket lásson, amelyek segítenek a felhasználónak a csapat irányításában.
        label: Menedzser?
      managed_report:
        actions:
          reporting_locations_report:
            label: Jelentési Helyszín (Ügyek)
            explanation: Képesség statisztikák megtekintésére a regisztrált Ügyek számáról egy adott időtartományon belül, Jelentési Helyszín alapján szűrve, életkor és nem alapján bontva. Ez a jogosultság lehetővé teszi a felhasználó számára az adatok exportálását egy Insight-ból.
          followups_report:
            label: Követések (Ügyek)
            explanation: Képesség statisztikák megtekintésére a végrehajtott Követések számáról egy adott időtartományon belül, Követés típusa szerint szűrve, életkor és nem alapján bontva.
          services_report:
            label: Szolgáltatások (Ügyek)
            explanation: Képesség statisztikák megtekintésére az elvégzett Szolgáltatások számáról egy adott időtartományon belül, szolgáltatási típus szerint szűrve, életkor és nem alapján bontva.
          protection_concerns_report:
            label: Védelmi Aggályok (Ügyek)
            explanation: Képesség statisztikák megtekintésére az Ügyek Védelmi Aggályairól egy adott időtartományon belül. Ez a jogosultság lehetővé teszi a felhasználó számára az adatok exportálását egy Insight-ból.
          managed_report_scope:
            label: Milyen rekordokat lásson ez a szerepkör az Insight-okban?
          managed_report_scope_all:
            label: Minden
          managed_report_scope_group:
            label: Csak csoport alapú adatok
          managed_report_scope_agency:
            label: Csak szolgáltató alapú adatok
          violations:
            explanation: Képesség hozzáférni az MRM Jogsértések Insight-hoz.
            label: Szabálysértések
          gbv_statistics:
            explanation: Képesség hozzáférni a GBV Statisztikák Insight-hoz.
            label: GBV statisztikák
          ghn_report:
            explanation: Képesség hozzáférni az MRM Globális Horizontális Jelentés Insight-hoz.
            label: Globális Horizontális Jelentés
          individual_children:
            explanation: Képesség hozzáférni az MRM Egyéni Gyermekek Insight-hoz.
            label: Egyéni Gyermekek
          workflow_report:
            label: Munkafolyamat (Ügyek és Incidensek)
            explanation: Képesség statisztikák megtekintésére az Ügyek és az azokhoz kapcsolódó Incidensek Munkafolyamat státuszairól.
          cases_workflow_report:
            label: Munkafolyamat (Ügyek)
            explanation: Képesség statisztikák megtekintésére az Ügyek Munkafolyamat státuszairól.
          violence_type_report:
            label: Erőszak Típusa (Ügyek és Incidensek)
            explanation: Képesség statisztikák megtekintésére az Erőszak Típusáról.
          referrals_transfers_report:
            label: Referálások és Átadások (Ügyek)
            explanation: A felhasználók megtekinthetik az egyes Felhasználói Csoportokból átadott és referált ügyek számát.
          protection_outcomes:
            label: Védelmi Eredmények
            explanation: A védelmi eredményeket eredetileg a PCM modulhoz fejlesztették ki. Tartalmazza a pszichoszociális jólétükben javulást mutató kliensek és a védelmi kockázatok által kevésbé érintett kliensek százalékos arányát.
          process_quality_total_cases:
            label: 'Folyamat és Minőség - Összes védelmi esetmenedzsment kliens száma'
            explanation: Csak a PCM (Védelmi Esetmenedzsment) modulra vonatkozik. Megmutatja az összes védelmi esetmenedzsment alatt álló eset számát.
          process_quality_average_cases:
            label: 'Folyamat és Minőség - Átlagos esetek száma eseti munkatársanként'
            explanation: Csak a PCM (Védelmi Esetmenedzsment) modulra vonatkozik. Megmutatja az egy eseti munkatársra jutó PCM esetek átlagos számát.
          process_quality_successful_referrals:
            label: 'Folyamat és Minőség - Sikeres referálások aránya (%)'
            explanation: Csak a PCM (Védelmi Esetmenedzsment) modulra vonatkozik. Megmutatja a sikeresen megvalósított szolgáltatási referálások százalékos arányát.
          process_quality_implemented_referrals:
            label: Folyamat és Minőség - Sikeres referálások megvalósítási dátum szerint
            explanation: Csak a PCM (Védelmi Esetmenedzsment) modulra vonatkozik. Megmutatja, hogy havonta hány sikeres szolgáltatási referálás került megvalósításra.
          case_characteristics:
            label: 'Esetjellemzők'
            explanation: 'Csak a PCM (Védelmi Esetmenedzsment) modulra vonatkozik. Az eseteket bontja le több kulcsfontosságú jellemző szerint: védelmi kockázat, kockázati szint, időtartam, fogyatékossági státusz, biztonsági terv teljesítése és nem.'
      matching_configuration:
        actions:
          manage:
            explanation: Lehetőség a megfelelő mezők kiválasztására, amelyeket az egyezések keresésére használnak a nyomkövetési kérelmek és ügyek között. Mivel ez a teljes rendszerben vezérli az egyezések futtatását, ezt a jogosultságot általában csak a rendszergazdának kell adni.
            label: Kezelés (az adott erőforrástípus teljes körű engedélyezése)
        explanation: Szabályozza, hogy a családok felkutatása és újraegyesítése során mely mezőket használják a Nyomkövetési kérelmek és az Ügyek összehasonlítására.
        label: Egyező konfiguráció
      metadata:
        actions:
          manage:
            label: Kezelés (az adott erőforrástípus teljes körű engedélyezése)
        explanation: A Primero űrlapok és mezők, valamint a bennük használt keresési opciók konfigurálásának lehetőségét vezérli.
        label: Nyomtatványok, keresések
      module:
        actions:
          cp:
            label: CP
          gbv:
            label: GBV
          mrm:
            label: MRM
        explanation: Szabályozza, mely modulokra vonatkozik ez a szerepkör
        label: Modulok
      potential_match:
        actions:
          read:
            explanation: Képviseli a nyomkövetési kérelem és az ügy közötti kapcsolatot. Az Egyezések megtekintéséhez szükséges a Családi Nyomkövetés és Újraegyesítés (FTR) munkájához. Lehetővé teszi a felhasználónak, hogy lássa az Ügyek Nyomkövetési Összefoglaló űrlapját.
            label: Megtekintés
          view_audio:
            explanation: Szabályozza, hogy egy nyomkövetési egyezést kereső felhasználó láthatja-e az audiofájlokat, amelyek az Üggyel vagy a Nyomkövetési Kérelemmel kapcsolatosak.
            label: Audiók megtekintése
          view_photo:
            explanation: Szabályozza, hogy egy nyomkövetési egyezést kereső felhasználó láthatja-e a fényképeket, amelyek az Üggyel vagy a Nyomkövetési Kérelemmel kapcsolatosak.
            label: Fényképek megtekintése
          manage:
            explanation: Lehetővé teszi a felhasználónak, hogy minden rendelkezésre álló műveletet végrehajtson a Lehetséges Egyezéseken. A "Teljes kezelési jogosultság" lényegében mindent magában foglal.
            label: Teljes kezelési jogosultság
        label: Potenciális egyezés
      primero_configuration:
        actions:
          manage:
            explanation: Konfigurációk mentésének, alkalmazásának és küldésének lehetősége. Ez a jogosultság általában a rendszergazdának van fenntartva.
            label: Kezelés (az adott erőforrástípus teljes körű engedélyezése)
        label: Konfiguráció
      referral:
        actions:
          refer:
            explanation: Ez azt jelenti, hogy a szerepkör megjelenik a "Címzett Típus" lehetőségek között, amikor a felhasználó külső referálást hajt végre. Ha a felhasználó ezt a szerepkört választja a címzett típusának, az exportált fájl csak azokat az űrlapokat fogja tartalmazni, amelyekhez ez a szerepkör hozzáféréssel rendelkezik. Például, ha a felhasználó a "Orvosi Szolgáltató" szerepkört választja címzettként, és az Orvosi Szolgáltató szerepkör csak az Alapvető Személyazonosító és Védelmi Aggályok űrlapokhoz fér hozzá, akkor az exportált fájl csak ezen két űrlap mezőit tartalmazza.
            label: Használható-e ez a szerep külső Ajánlásokhoz?
        label: Ajánlás
      registry_record:
        actions:
          change_log:
            explanation: A felhasználó láthatja a bejegyzés létrehozásától kezdve a rajta végrehajtott összes változtatás előzményeit.
            label: Változási napló
          create:
            explanation: Képes nyilvántartási bejegyzés létrehozására.
            label: Hozzon létre
          enable_disable_record:
            explanation: Lehetőség a nyilvántartási bejegyzések letiltására vagy engedélyezésére. A "letiltott" bejegyzések alapértelmezés szerint nem jelennek meg a nyilvántartási listában. A felhasználók egy szűrő használatával láthatják a letiltott " Nyilvántartási bejegyzéseket" a "Nyilvántartási listában".
            label: Engedélyezés / Tiltás
          export_csv:
            explanation: 'A felhasználó a Nyilvántartási lista vagy a Nyilvántartás megjelenítése oldalakról CSV fájl exportálást hozhat létre, amely tartalmazza az összes olyan mezőt, amelyhez az aktuális felhasználónak hozzáférése van, egy, több vagy az összes olyan nyilvántartási bejegyzéshez, amelyhez a felhasználónak hozzáférése van. MEGJEGYZÉS: A CSV export nem jeleníti meg a nem latin betűket (pl. arab, bangla).'
            label: CSV exportálása
          export_json:
            explanation: A felhasználó létrehozhat egy JSON fájl exportot a Nyilvántartási lista vagy a Nyilvántartás megjelenítése oldalakról, amely tartalmazza az összes olyan mezőt, amelyhez az aktuális felhasználónak hozzáférése van. A JSON formátum gépileg olvasható, és a legtöbb felhasználó számára nem praktikus.
            label: JSON exportálása
          export_xls:
