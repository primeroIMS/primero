    number_of_cases:
      title: "1. A rögzített esetek száma"
      reporting_site: "Jelentési hely"
      helptext: |
        Ez a mutató azt számolja, hány új ügyfelet hoztak létre havonta a jelentési helyen.
        A jelentési hely azt a helyet jelenti, ahol a Felhasználó szervezete szolgáltatásokat nyújt, és ahol az ügyfelet jelentették a szolgáltatónak.
    number_of_incidents:
      title: "2. Rögzített incidensek száma"
      reporting_site: "Jelentési hely"
      helptext: |
        Ez a mutató azt számolja, hogy hány új incidenst nyitottak meg havonta a jelentési helyen.
        A jelentési hely azt a helyet jelenti, ahol a Felhasználó szervezete szolgáltatásokat nyújt, és ahol az incidenst jelentették a szolgáltatónak.
    reporting_delay:
      title: "3. Jelentési késedelem"
      delay: "Késleltetés"
      total_incidents: "Összes incidens"
      helptext: "Ez a mutató azt számolja és kategorizálja, hogy hány nap telt el azóta, hogy az áldozat átélte a GBV-t, és mikor jelentette először a szolgáltatónak. \nA számítás azon alapul, hogy mikor jelentették először az incidenst a felhasználó szervezetének. \nAz adatokat különböző időtartamok alapján kategorizálják (0-3 nap; 4-5 nap; 6-14 nap; 15-30 nap; 1 hónap felett; 3 hónap felett).\n"
    service_access_delay:
      title: "Szolgáltatáshoz való hozzáférés késedelme"
      delay: "Késleltetés"
      total_incidents: "Összes incidens"
